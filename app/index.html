ssier. Tous les montants de chiffrage sont des ajouts fictifs en fourchettes."},{"id":"scn-c","code":"c","marque":"FICTIF","titre":"Incendie d'un entrepôt de batteries lithium","resume":"Cellule de stockage de batteries lithium-ion. Trois hypothèses : emballement thermique, source externe, malveillance. Sous-déclaration du bâtiment, stock correctement déclaré, carence du client en PE, volet cargo (UN 3480/3481).","donnees":{"surface_cellule_m2":{"valeur":4000,"origine":"fictif-ajout"},"batiment_dommage_van":{"valeur":900000,"origine":"fictif-ajout"},"batiment_declare":{"valeur":2800000,"origine":"fictif-ajout"},"batiment_reel":{"valeur":3500000,"origine":"fictif-ajout"},"taux_vetuste_batiment":{"valeur":0.2,"origine":"fictif-ajout"},"taux_rachat_max":{"valeur":0.25,"origine":"fictif-ajout"},"stock_dommage":{"valeur":1200000,"origine":"fictif-ajout","note":"Stock de batteries, correctement déclaré : pas de RP"},"franchise":{"valeur":25000,"origine":"fictif-ajout"},"lci":{"valeur":2000000,"origine":"fictif-ajout"},"baisse_ca":{"valeur":800000,"origine":"fictif-ajout"},"taux_marge_brute":{"valeur":0.55,"origine":"fictif-ajout"},"frais_supplementaires":{"valeur":60000,"origine":"fictif-ajout"},"perte_evitee_par_frais":{"valeur":100000,"origine":"fictif-ajout"},"economies_charges":{"valeur":20000,"origine":"fictif-ajout"}},"resultats_calcules":{"chaine_batiment":{"calcul":"calc-chaine-indemnite","entrees":{"dommage_van":900000,"taux_vetuste":0.2,"declare":2800000,"reel":3500000,"franchise":25000,"plafond":null,"taux_rachat_max":0.25},"attendu":{"immediat":551000,"differe":144000},"note":"VD 720 k€ × 80 % − 25 k€ = 551 k€ ; différé min(180 ; 180) × 80 % = 144 k€"},"pe":{"calcul":"calc-pe","entrees":{"baisse_ca":800000,"taux_marge":0.55,"frais_supp":60000,"perte_evitee":100000,"economies":20000},"attendu":480000}},"deroule":[{"etapeId":"et-01","contenu":"Mission DAB/PE de l'exploitant de l'entrepôt. Identifier les dépositaires : le stock appartient-il à des clients (contrat d'entreposage) ?"},{"etapeId":"et-02","contenu":"ATTENTION ré-inflammation : les batteries endommagées peuvent repartir en emballement des jours après. Zone de quarantaine extérieure, surveillance thermique, scellés sur la travée d'origine."},{"etapeId":"et-03","contenu":"Convoquer l'exploitant, les déposants concernés, le fournisseur des racks/chargeurs, et les assureurs RC. Expert d'assuré probable."},{"etapeId":"et-04","contenu":"Exploiter vidéosurveillance et BMS (système de gestion des batteries) : alarmes de température/tension avant départ de feu ?"},{"etapeId":"et-05","contenu":"Police, plan de stockage, inventaire par déposant, contrats d'entreposage (Incoterms des flux), conformité UN 3480/3481 des lots reçus."},{"etapeId":"et-06","contenu":"Trois hypothèses à instruire en parallèle : emballement thermique (défaut interne ou charge), source externe, malveillance. Scellés, prélèvements, sapiteur batterie si besoin."},{"etapeId":"et-07","contenu":"Garanties : vérifier les règles de stockage imposées par la police (sprinklers, hauteurs, quantités) et les déclarations. Bâtiment sous-déclaré → RP 80 %."},{"etapeId":"et-08","contenu":"Bâtiment : chaîne complète → 551 k€ immédiat + 144 k€ différé. Stock : 1,2 M€ sans RP. Total sous LCI 2 M€ : vérifier ligne à ligne."},{"etapeId":"et-09","contenu":"PE : 55 % × 800 k€ + 60 k€ de frais (retenus car perte évitée 100 k€) − 20 k€ = 480 k€. Penser à la carence subie par LE CLIENT de l'entrepôt (contingent BI chez lui, pas ici)."},{"etapeId":"et-10","contenu":"Volet cargo : recours contre l'expéditeur d'un lot non conforme UN 3480/3481 ; contrats d'entreposage et Incoterms déterminent qui supporte quoi."},{"etapeId":"et-11","contenu":"Réserve : DAB ≈ 1,8 M€ + PE ≈ 0,5 M€. Acomptes dans les délais L.121-18."},{"etapeId":"et-12","contenu":"Rapport : cause documentée (ou hypothèses hiérarchisées), chiffrage par poste, application LCI/franchise, recours cargo."}],"pieges":["Sous-estimer la ré-inflammation","Oublier le volet contractuel (entreposage, Incoterms)","Mélanger PE de l'exploitant et carence des clients"],"version_en":"Lithium battery warehouse fire: thermal runaway vs external vs arson, BMS/CCTV evidence, re-ignition risk, UN 3480/3481 cargo compliance, recovery against shipper.","statut":"fictif","source_url":null,"date_verification":null,"note":"Cadre : cas 3 du dossier. Tous les montants sont des ajouts fictifs."}]},"trames":{"_table":"trames","_source":"dossier_reconversion.pdf — Parties 4 (pitchs, writing guide, phrases EN, récit) et 7.3 (messages), Partie 5 cas 8 (réunion contradictoire). Employeur actuel anonymisé en « organisme public de recherche » (règle du dépôt).","items":[{"id":"tr-rapport-preliminaire","categorie":"rapport","titre":"Rapport préliminaire (plan type)","contenu":["Mandat (qui, quoi, quand)","Circonstances","Dommages constatés","Garantie et réserves éventuelles (« Nous réservons notre position sur la garantie dans l'attente de la police complète »)","Mesures conservatoires prises","Prochaines étapes","Réserve chiffrée"],"statut":"V","source_url":null,"date_verification":null,"note":"Writing guide, Partie 4.4"},{"id":"tr-risk-survey","categorie":"rapport","titre":"Risk survey report (plan type, EN)","contenu":["Summary : grade, EML/MFL","COPE : construction, occupation, protection, exposure","Natural catastrophe exposure","Business interruption","Ranked recommendations (par réduction d'EML et par coût)"],"statut":"V","source_url":null,"date_verification":null,"note":"Writing guide, Partie 4.4"},{"id":"tr-red-flag","categorie":"rapport","titre":"Red flag report DD EHS (plan type, EN)","contenu":["Scope","Summary table","Findings","Cost ranges with assumptions","SPA recommendations (specific indemnity, escrow, condition suspensive)","Reliance"],"statut":"V","source_url":null,"date_verification":null,"note":"Writing guide, Partie 4.4. Un red flag est matériel, probable, chiffrable et traitable contractuellement."},{"id":"tr-reunion-contradictoire","categorie":"reunion","titre":"Réunion contradictoire (déroulé)","contenu":["1. Objet de la réunion et présences","2. Règles d'échange","3. Constats","4. Divergences","5. Actions","6. Procès-verbal"],"phrases_fr":["« Je note votre position, elle figurera au procès-verbal. »","« Nous réservons notre position sur la garantie. »","« Je propose un sapiteur commun. »"],"phrases_en":["\"I note your position; it will be recorded in the minutes.\"","\"Let's agree on a joint expert.\""],"statut":"V","source_url":null,"date_verification":null,"note":"Cas 8 du dossier"},{"id":"tr-phrases-en","categorie":"langue","titre":"Key phrases EN (terrain)","contenu":["\"Before anything is moved, all parties will be invited to a joint inspection.\"","\"We reserve our position on cover pending review of the policy.\"","\"Walk me through the sprinkler impairment procedure.\"","\"Any regulatory notices or fines in the last five years? Any historical spills or underground tanks?\"","\"Three red flags; one potentially material: historic chlorinated solvents, likely cost €[X]–[Y]k. We recommend a specific indemnity rather than a price reduction.\"","\"The loss estimate assumes the sprinkler system is impaired and the fire wall holds.\""],"statut":"V","source_url":null,"date_verification":null,"note":"Parties 2.3 et 4.4"},{"id":"tr-model-answers","categorie":"langue","titre":"Model answers EN (entretien)","contenu":["Why loss adjusting? → investigation leading to financial decisions.","Why leave after a year? → \"delivered [X]; now seeking decision-making.\"","Why us? → recent deal (AM Group, HPC) + training path.","Explain BI → \"Lost gross profit plus extra costs to keep trading, during the indemnity period.\"","EML? → \"Largest loss if a key protection fails, under stated assumptions.\"","Lithium? → thermal runaway, re-ignition, toxic gases, segregation.","Military? → composure and accountability, not rigidity."],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.4"},{"id":"tr-pitch-30s-fr","categorie":"pitch","titre":"Pitch 30 s FR (expertise)","contenu":["« Ingénieur en gestion des risques, je suis conseiller à la sécurité TMD dans un organisme public de recherche : j'audite les flux de marchandises dangereuses, j'analyse les incidents et je fais appliquer des actions correctives. Avant cela : deux ans d'alternance au Ministère des Armées sur les audits TMD et environnement, deux ans chez Eiffage Route sur la traçabilité des déchets, et quatre ans comme chef de groupe d'infanterie, dont des OPEX au Tchad et au Niger. Je veux mettre cette capacité d'enquête et ce calme sous pression au service de l'expertise des sinistres d'entreprise et transport. »"],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.1 — employeur anonymisé pour le dépôt ; rétablir le nom à l'oral"},{"id":"tr-pitch-30s-en","categorie":"pitch","titre":"Pitch 30 s EN (risk engineering)","contenu":["\"I'm a risk and environmental engineer, currently Dangerous Goods Safety Adviser at a national public research organisation. I audit hazardous materials flows across classes 1 to 9, investigate incidents and drive corrective actions. Before that: two years of dangerous goods and environmental audits with the French Ministry of Armed Forces, two years on waste traceability at Eiffage Route, and four years as an infantry NCO section leader. I want to apply that field and audit experience to property risk assessment: hazardous storage, lithium batteries, fire protection.\""],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.1 — anonymisé pour le dépôt"},{"id":"tr-pitch-90s","categorie":"pitch","titre":"Pitch 90 s (trame FR) et 3 min","contenu":["1. Ingénieur ESAIP (CTI/EUR-ACE)","2. Audits TMD dans l'organisme actuel [nombre de laboratoires : à compléter]","3. Outil interne d'audit TMD (checklists automatisées)","4. Formation des préventeurs ; commandement de 8 soldats","5. Pourquoi ce métier : enquête, décision, enjeux financiers","6. Pourquoi vous : [spécialité de l'agence]","3 min = 90 s + un STAR sur le lithium + la mission en Espagne + l'objectif à 5 ans : référent entreprises/transport, certifié EEA. NE PAS parler du futur cabinet de conseil."],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.1 ; version EN 90 s dans le dossier"},{"id":"tr-recit-transition","categorie":"pitch","titre":"Récit de transition (FR/EN)","contenu":["FR : « Mon poste actuel m'a donné une maîtrise fine de l'audit réglementaire. Je veux maintenant que mon analyse technique débouche sur une décision : déterminer une cause, chiffrer un dommage, défendre une position en réunion contradictoire. »","EN : \"My current role gave me rigorous audit skills. Now I want my technical analysis to drive decisions with real financial stakes.\"","Sur la durée au poste actuel : « J'ai livré [outil, guides, formations] ; le dispositif est documenté. »","À ÉVITER : « assumer l'ennui » — le recruteur entend « il s'ennuiera ici aussi »."],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.2 — anonymisé"},{"id":"tr-contact-fr","categorie":"message","titre":"Premier contact (FR)","contenu":["« Bonjour [Prénom], ingénieur en gestion des risques et conseiller sécurité TMD dans un organisme public de recherche, je m'intéresse à l'expertise des sinistres d'entreprise et transport. Accepteriez-vous un échange de 15 minutes pour me donner votre regard sur le métier ? »","Relance à J+7 : « Je me permets une courte relance ; je reste disponible, y compris par téléphone. »"],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.3 — anonymisé"},{"id":"tr-contact-en","categorie":"message","titre":"First contact (EN)","contenu":["\"Hi [Name], I'm a risk engineer and dangerous goods safety adviser exploring a move into loss adjusting / risk engineering. Would you have 15 minutes for a quick call?\""],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.3"},{"id":"tr-script-appel","categorie":"message","titre":"Script d'appel (entretien informatif)","contenu":["1. Qui je suis","2. Pourquoi je contacte cette personne","3. « Qu'est-ce qui distingue un bon junior ? Recrutez-vous des profils sans expérience des sinistres ? »","4. Demander un nom ou une offre","5. Suivi écrit"],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.3"},{"id":"tr-checklist-200","categorie":"checklist","titre":"Checklist « prêt à 200 % » (avant entretien)","contenu":["J-7 : actualités de l'entreprise · 3 récits STAR · un cas chronométré · prétentions salariales · anglais","J-1 : fiche réflexe · 5 questions à poser · itinéraire · CV imprimé · certificats (Suisse)","Jour J : arriver 10 min avant · pitch de 90 s · reformuler les questions techniques · demander les prochaines étapes · remercier sous 24 h"],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.5"}]},"grilles_entretien":{"_table":"grilles_entretien","_source":"dossier_reconversion.pdf — Parties 2, 4 et 7. Le rapport_recherche.md (bloc « grilles d'entretien ») n'ayant pas été fourni, ces grilles sont assemblées depuis le dossier.","items":[{"id":"gr-expert-iard","poste":"Expert IARD junior — entreprises / transport","themes_evalues":["Compréhension du métier (enquête + argent + contradictoire + service)","Bases juridiques (L.113-2/8/9, L.114-1, L.121-1/5/12, L.121-18)","Chiffrage : règle proportionnelle, chaîne VàN→indemnité, perte d'exploitation","Posture contradictoire et fermeté calme","Réalisme salarial (40-45 k€)"],"questionIds":["q-rh-pourquoi-expertise","q-rh-conformite","q-rh-chantier","q-rh-cv-officer","q-rh-militaire","q-rh-pretentions","q-rh-faiblesse","q-fond-cause-electrique","q-fond-acte-volontaire","q-fond-convocation","q-fond-scelles","q-fond-aggravation","q-tech-deb-dab-rc","q-tech-deb-franchise","q-tech-deb-subrogation","q-tech-int-rp","q-tech-int-marge","q-tech-int-adr14","q-tech-conf-faute","q-tech-conf-carence","q-tech-conf-clause", ,"a_eviter":"Survente","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-cv-officer","type":"rh","niveau":null,"question":"« Votre CV dit officer training »","teste":"Rigueur","reponse":"« Erreur corrigée : l'ENSOA forme les sous-officiers. Je suis réserviste spécialiste au grade de capitaine au titre de mon expertise TMD. »","a_eviter":"Minimiser","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-allemand","type":"rh","niveau":null,"question":"« Pourquoi pas d'allemand ? » (Suisse)","teste":"Réalisme","reponse":"Plan concret [à compléter], postes francophones.","a_eviter":"Promettre un B2 en 3 mois","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-militaire","type":"rh","niveau":null,"question":"« Ancien militaire, trop rigide ? »","teste":"Posture","reponse":"« J'ai appris à écouter avant de décider ; je fais respecter une méthode, pas un grade. »","a_eviter":"Anecdotes guerrières","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-pretentions","type":"rh","niveau":null,"question":"Prétentions salariales","teste":"Réalisme","reponse":"France : 40-45 k€ fixe selon véhicule et variable ; Suisse : grilles du marché.","a_eviter":"55-70 k€ sans expérience","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-faiblesse","type":"rh","niveau":null,"question":"Votre faiblesse ?","teste":"Lucidité","reponse":"Chiffrage assurance/PE encore récent + plan FEDEA pour y remédier.","a_eviter":"Fausse faiblesse","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-cause-electrique","type":"fond","niveau":null,"question":"« La cause est électrique ? »","teste":null,"reponse":"« C'est une hypothèse : arc mapping, perles de fusion analysées en laboratoire, zone d'origine établie par les figures de feu et les témoins. »","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-acte-volontaire","type":"fond","niveau":null,"question":"« Et l'acte volontaire ? »","teste":null,"reponse":"Foyers multiples, accélérants (prélèvements, labo), effraction, contexte financier. « Je documente et je propose un sapiteur. »","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-convocation","type":"fond","niveau":null,"question":"« Qui convoquez-vous avant de déplacer l'armoire ? »","teste":null,"reponse":"L'assuré, le mainteneur ou l'installateur, le fabricant et leurs assureurs RC, ainsi que l'expert d'assuré. Par écrit, avec un délai raisonnable.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-scelles","type":"fond","niveau":null,"question":"« Les scellés ? »","teste":null,"reponse":"Photos, étiquetage, numérotation, stockage sécurisé, procès-verbal contradictoire ; aucune ouverture hors présence des parties.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-aggravation","type":"fond","niveau":null,"question":"« Aggravation du risque ? »","teste":null,"reponse":"Comparer les déclarations à la réalité (L.113-8/9), sans confondre avec une exclusion.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-tech-deb-dab-rc","type":"technique","niveau":"debutant","question":"DAB vs RC : quelle différence et pourquoi est-ce structurant ?","teste":null,"reponse":"Dommages aux biens = contrat d'indemnité sur les biens de l'assuré ; RC = dette de responsabilité envers un tiers. Garanties, plafonds et gestion distincts. La confusion est éliminatoire.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Questions techniques — débutant"},{"id":"q-tech-deb-franchise","type":"technique","niveau":"debutant","question":"Franchise vs plafond ?","teste":null,"reponse":"La franchise reste à charge de l'assuré en bas de l'indemnité ; le plafond (ou LCI) borne l'indemnité en haut. EN : deductible / limit.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-deb-subrogation","type":"technique","niveau":"debutant","question":"La subrogation ?","teste":null,"reponse":"L'assureur qui a payé est subrogé dans les droits de l'assuré contre le tiers responsable (L.121-12), à concurrence de l'indemnité. D'où l'importance de préserver recours et preuves.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-int-rp","type":"technique","niveau":"intermediaire","question":"La règle proportionnelle ?","teste":null,"reponse":"Capitaux (L.121-5) : indemnité = dommage × déclaré/réel, sauf convention contraire. Prime (L.113-9) : réduction au prorata des taux de prime en cas de déclaration inexacte non intentionnelle.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-int-marge","type":"technique","niveau":"intermediaire","question":"La marge brute assurée ?","teste":null,"reponse":"CA − charges variables (≠ marge comptable). Perte = taux de marge × baisse de CA + frais supplémentaires − économies.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-int-fca","type":"technique","niveau":"intermediaire","question":"FCA (Incoterm) ?","teste":null,"reponse":"Free Carrier : le vendeur livre au transporteur désigné par l'acheteur ; le transfert de risque a lieu à la remise. Structure qui supporte le risque pendant le transport.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-int-adr14","type":"technique","niveau":"intermediaire","question":"ADR 1.4 ?","teste":null,"reponse":"Obligations de sécurité de chaque intervenant : expéditeur, transporteur, destinataire, chargeur, emballeur, remplisseur, exploitant de citerne, déchargeur. Grille de répartition des responsabilités dans un sinistre TMD.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-faute","type":"technique","niveau":"confirme","question":"Faute intentionnelle vs défaut d'entretien ?","teste":null,"reponse":"La faute intentionnelle ou dolosive (L.113-1) exclut la garantie : volonté de créer le dommage. Le défaut d'entretien reste couvert sauf exclusion formelle et limitée — il peut en revanche fonder un recours ou une règle proportionnelle si déclaré inexactement.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-carence","type":"technique","niveau":"confirme","question":"La carence ?","teste":null,"reponse":"PE subie sans dommage direct chez l'assuré : défaillance d'un fournisseur ou client sinistré (contingent BI). Garantie spécifique, souvent sous-limitée.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-clause","type":"technique","niveau":"confirme","question":"Clause limitative de responsabilité : opposable ?","teste":null,"reponse":"En transport intérieur, les clauses contraires à L.133-1 sont nulles ; les plafonds du contrat type s'appliquent à défaut de convention. Le dol et la faute inexcusable font sauter les limitations (CMR art. 29).","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-cmr29","type":"technique","niveau":"confirme","question":"CMR art. 29 ?","teste":null,"reponse":"Le transporteur perd le bénéfice des limitations (8,33 DTS/kg) en cas de dol ou de faute considérée comme équivalente au dol par la loi du for.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-eml","type":"technique","niveau":"confirme","question":"EML avec un mur percé ?","teste":null,"reponse":"L'EML raisonne sur le plus grand compartiment : un mur coupe-feu percé (porte calée, trémie non recoupée) fusionne les compartiments et fait exploser l'EML. « The loss estimate assumes the sprinkler system is impaired and the fire wall holds. »","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-recruteur","type":"a_poser","niveau":null,"question":"Questions à poser au recruteur","teste":null,"reponse":"1. Délégation de règlement et tutorat d'un junior ? 2. Parcours TEA/EEA ? 3. Véhicule, secteur, nuits dehors, astreintes catastrophes naturelles ? 4. Outils ? 5. En Suisse : langue des rapports ?","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"qf-01","type":"flash","niveau":null,"question":"Prescription biennale ?","reponse":"L.114-1","statut":"V","source_url":null,"date_verification":null,"note":"Auto-évaluation n°1"},{"id":"qf-02","type":"flash","niveau":null,"question":"Subrogation ?","reponse":"L.121-12","statut":"V","source_url":null,"date_verification":null,"note":"n°2"},{"id":"qf-03","type":"flash","niveau":null,"question":"Fausse déclaration intentionnelle ?","reponse":"Nullité (L.113-8)","statut":"V","source_url":null,"date_verification":null,"note":"n°3"},{"id":"qf-04","type":"flash","niveau":null,"question":"Fausse déclaration non intentionnelle ?","reponse":"Réduction proportionnelle (L.113-9)","statut":"V","source_url":null,"date_verification":null,"note":"n°4"},{"id":"qf-05","type":"flash","niveau":null,"question":"Règle proportionnelle ?","reponse":"Dommage × capital déclaré / valeur réelle","statut":"V","source_url":null,"date_verification":null,"note":"n°5"},{"id":"qf-06","type":"flash","niveau":null,"question":"Marge brute assurée ?","reponse":"CA − charges variables","statut":"V","source_url":null,"date_verification":null,"note":"n°6"},{"id":"qf-07","type":"flash","niveau":null,"question":"Frais supplémentaires ?","reponse":"Coûts engagés pour limiter la perte","statut":"V","source_url":null,"date_verification":nu <script>
/* Moteur de calcul — source unique des formules côté application.
   Également chargé par Node pour les tests (résultats identiques app/Excel). */
(function (root) {
  'use strict';

  function round2(x) { return Math.round(x * 100) / 100; }

  const CalcEngine = {

    /** Règle proportionnelle de capitaux (L.121-5). */
    rpCapitaux({ dommage, declare, reel }) {
      const coeff = reel > 0 ? Math.min(1, declare / reel) : 1;
      return { coeff: round2(coeff), indemnite: round2(Math.min(dommage, dommage * coeff)) };
    },

    /** Règle proportionnelle de prime (L.113-9). */
    rpPrime({ dommage, prime_payee, prime_due }) {
      if (!prime_due) return { coeff: null, indemnite: null };
      const coeff = Math.min(1, prime_payee / prime_due);
      return { coeff: round2(coeff), indemnite: round2(Math.min(dommage, dommage * coeff)) };
    },

    /** Chaîne VàN → vétusté → RP → franchise → plafond → différé. */
    chaineIndemnite({ dommage_van, taux_vetuste, declare, reel, franchise, plafond, taux_rachat_max }) {
      const tr = (taux_rachat_max == null) ? 0.25 : taux_rachat_max;
      const vetuste = dommage_van * taux_vetuste;
      const vd = dommage_van - vetuste;
      const coeff = reel > 0 ? Math.min(1, declare / reel) : 1;
      let immediat = Math.max(0, vd * coeff - (franchise || 0));
      if (plafond != null && plafond > 0) immediat = Math.min(immediat, plafond);
      const differe = Math.min(vetuste, tr * vd) * coeff;
      return {
        vetuste: round2(vetuste), valeur_vetuste_deduite: round2(vd), coeff: round2(coeff),
        immediat: round2(immediat), differe: round2(differe),
      };
    },

    /** Perte d'exploitation (marge brute assurée). */
    pe({ baisse_ca, taux_marge, frais_supp, perte_evitee, economies }) {
      const margePerdue = baisse_ca * taux_marge;
      const fraisRetenus = Math.min(frais_supp || 0, perte_evitee || 0);
      return {
        marge_perdue: round2(margePerdue), frais_retenus: round2(fraisRetenus),
        perte: round2(margePerdue + fraisRetenus - (economies || 0)),
      };
    },

    /** Plafonds transport. Renvoie {plafond_dts|plafond_eur, en_euros?}. */
    plafondsTransport({ regime, poids_kg, nb_colis, taux_montreal, cours_dts }) {
      const colis = nb_colis || 1;
      let out = {};
      switch (regime) {
        case 'cmr': out = { plafond_dts: round2(8.33 * poids_kg) }; break;
        case 'montreal': out = { plafond_dts: round2((taux_montreal == null ? 26 : taux_montreal) * poids_kg) }; break;
        case 'hague_visby': out = { plafond_dts: round2(Math.max(666.67 * colis, 2 * poids_kg)) }; break;
        case 'ctg_moins_3t': out = { plafond_eur: round2(Math.min(33 * poids_kg, 1000 * colis)) }; break;
        case 'ctg_3t_et_plus': out = { plafond_eur: round2(Math.min(20 * poids_kg, 3200 * (poids_kg / 1000))) }; break;
        default: out = {};
      }
      if (out.plafond_dts != null && cours_dts) out.en_euros = round2(out.plafond_dts * cours_dts);
      return out;
    },

    /** Échéancier : dates ISO → échéances calculées. */
    echeancier({ date_sinistre, date_declaration, date_livraison, date_accord }) {
      const p = (iso) => (iso ? new Date(iso + 'T12:00:00') : null);
      const fmt = (d) => d.toISOString().slice(0, 10);
      const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
      const addM = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
      const addOuvres = (d, n) => { // jours ouvrés lun-ven, fériés non décomptés (à vérifier à la main)
        let x = new Date(d), c = 0;
        while (c < n) { x = addD(x, 1); const j = x.getDay(); if (j !== 0 && j !== 6) c++; }
        return x;
      };
      const S = p(date_sinistre), D = p(date_declaration), L = p(date_livraison), A = p(date_accord);
      const out = {};
      if (S) {
        out['d-declaration'] = fmt(addOuvres(S, 5));
        out['d-declaration-vol'] = fmt(addOuvres(S, 2));
        out['d-aggravation'] = fmt(addD(S, 15));
        out['d-prescription-assurance'] = fmt(addM(S, 24));
      }
      if (D) {
        out['d-reponse-sans-expert'] = fmt(addM(D, 2));
        out['d-reponse-avec-expert'] = fmt(addM(D, 6));
        out['d-catnat-info'] = fmt(addM(D, 1));
      }
      if (A) out['d-paiement'] = fmt(addD(A, 21));
      if (L) {
        out['d-protestation'] = fmt(addD(L, 3));
        out['d-cmr-non-apparent'] = fmt(addD(L, 7));
        out['d-cmr-retard'] = fmt(addD(L, 21));
        out['d-presomption-perte'] = fmt(addD(L, 30));
        out['d-prescription-transport'] = fmt(addM(L, 12));
        out['d-cmr-prescription'] = fmt(addM(L, 12));
      }
      return out;
    },

    /** Exécute un vecteur de test de calculs.json ; renvoie {ok, obtenu}. */
    runVector(calcId, entrees) {
      const map = {
        'calc-rp-capitaux': (e) => this.rpCapitaux(e),
        'calc-rp-prime': (e) => this.rpPrime(e),
        'calc-chaine-indemnite': (e) => this.chaineIndemnite(e),
        'calc-pe': (e) => this.pe(e),
        'calc-plafonds-transport': (e) => this.plafondsTransport(e),
        'calc-echeancier': (e) => this.echeancier(e),
      };
      return map[calcId] ? map[calcId].call(this, entrees) : null;
    },
  };

  root.CalcEngine = CalcEngine;
  if (typeof module !== 'undefined' && module.exports) module.exports = CalcEngine;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* Expert assurance — application autonome (aucune requête réseau).
   Données de référence : injectées au build (window.DB).
   Données personnelles : localStorage, ensemencées depuis data/personal/. */
(function () {
  'use strict';

  // ---------------------------------------------------------------- état
  const DB = JSON.parse(document.getElementById('data-ref').textContent);
  const SEED = JSON.parse(document.getElementById('data-perso').textContent);
  const LS_KEY = 'expert-assurance-perso-v1';

  function loadPerso() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* stockage indisponible : on travaille en mémoire */ }
    return JSON.parse(JSON.stringify(SEED));
  }
  const P = loadPerso();
  P.ui = P.ui || { theme: 'auto' };
  P.methode = P.methode || {};
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) { /* ignoré */ }
  }

  // ---------------------------------------------------------------- utils
  const $ = (sel, el) => (el || document).querySelector(sel);
  const main = () => $('#vue');
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function eur(x) {
    if (x == null || isNaN(x)) return '—';
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(x) + ' €';
  }
  function num(x) {
    if (x == null || isNaN(x)) return '—';
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(x);
  }
  const STATUT_LABEL = { V: 'V · vérifié', NV: 'NV · non vérifié', ordre_de_grandeur: 'ordre de grandeur', fictif: 'FICTIF' };
  function badge(st) {
    return st ? `<span class="badge ${esc(st)}" title="${esc(STATUT_LABEL[st] || st)}">${esc(st === 'ordre_de_grandeur' ? '≈' : st.toUpperCase())}<\/span>` : '';
  }

  // Index global des éléments par id (navigation croisée + recherche)
  const INDEX = {};
  const ROUTES_TABLE = {
    fiches: (id) => '#/fiche/' + id, references: (id) => '#/references?focus=' + id,
    calculs: (id) => '#/calc/' + id, etapes_methode: () => '#/methode',
    pieces: () => '#/methode', scenarios: (id) => '#/scenario/' + id,
    trames: (id) => '#/trames?focus=' + id, grilles_entretien: (id) => '#/entretien?grille=' + id,
    questions: (id) => '#/entretien?q=' + id, accidents: () => '#/averifier',
    ressources: () => '#/ressources', cabinets: (id) => '#/cabinets?focus=' + id,
    lexique_fr_en: () => '#/lexique', a_verifier: () => '#/averifier',
  };
  Object.keys(ROUTES_TABLE).forEach((t) => {
    (DB[t].items || []).forEach((it) => {
      INDEX[it.id] = { table: t, item: it, route: ROUTES_TABLE[t](it.id) };
    });
  });
  (SEED.star.items || []).forEach((it) => { INDEX[it.id] = { table: 'star', item: it, route: '#/entretien?star=1' }; });

  function titleOf(it, table) {
    return it.titre || it.intitule || it.label || it.question || it.nom || it.fr || it.sujet || it.poste || it.id;
  }
  function refLink(id) {
    const e = INDEX[id];
    if (!e) return esc(id);
    const t = titleOf(e.item, e.table);
    const numero = e.item.numero && e.table === 'references' ? e.item.numero + ' — ' : '';
    return `<a href="${e.route}">${esc(numero + t)}<\/a> ${badge(e.item.statut)}`;
  }

  // ---------------------------------------------------------------- thème
  function applyTheme() {
    const t = P.ui.theme;
    const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('#btn-theme').textContent = t === 'auto' ? '◐' : (t === 'dark' ? '●' : '○');
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // ---------------------------------------------------------------- vues
  const VUES = {};

  VUES.accueil = function () {
    const nv = DB.a_verifier.items.length;
    const dues = srsDue().length;
    return `
    <h1>Expert assurance — base personnelle<\/h1>
    <div class="bandeau-fictif">Les scénarios sont FICTIFS. Statuts : V vérifié · NV non vérifié · ≈ ordre de grandeur.<\/div>
    <div class="grid cols2">
      <div class="card"><h3>Réviser<\/h3>
        <p><a href="#/quiz">Cartes à répétition espacée<\/a> — <b>${dues}<\/b> carte(s) dues.<\/p>
        <p><a href="#/entretien">Entraînement entretien<\/a> : tirage chronométré, grilles par poste, banque STAR.<\/p>
        <p><a href="#/fiches">Fiches<\/a> · <a href="#/lexique">Lexique FR↔EN<\/a><\/p><\/div>
      <div class="card"><h3>Travailler un sinistre<\/h3>
        <p><a href="#/methode">Méthode en 12 étapes<\/a> + 3 scénarios fictifs déroulables.<\/p>
        <p><a href="#/calculs">Calculateurs<\/a> : règles proportionnelles, chaîne d'indemnisation, PE, plafonds transport, délais.<\/p><\/div>
      <div class="card"><h3>Chercher un poste<\/h3>
        <p><a href="#/cabinets">Cibles et cabinets<\/a> · <a href="#/candidatures">Suivi des candidatures<\/a><\/p>
        <p><a href="#/ressources">Ressources et sprint de 6 semaines<\/a><\/p><\/div>
      <div class="card"><h3>Fiabilité<\/h3>
        <p><a href="#/averifier">Vue « À vérifier »<\/a> : <b>${nv}<\/b> éléments NV avec leur source primaire.<\/p>
        <p><a href="#/references">Références juridiques et normatives<\/a><\/p>
        <p><a href="#/donnees">Exporter / importer mes données<\/a><\/p><\/div>
    <\/div>`;
  };

  // ------------------------------------------------ recherche plein texte
  function searchCorpus() {
    const corpus = [];
    Object.keys(ROUTES_TABLE).forEach((t) => {
      DB[t].items.forEach((it) => {
        corpus.push({ id: it.id, table: t, titre: titleOf(it, t), statut: it.statut, route: INDEX[it.id].route, text: JSON.stringify(it).toLowerCase() });
      });
    });
    return corpus;
  }
  let CORPUS = null;
  VUES.recherche = function (params) {
    const q = (params.get('q') || '').trim().toLowerCase();
    if (!CORPUS) CORPUS = searchCorpus();
    let hits = [];
    if (q.length >= 2) {
      hits = CORPUS.filter((c) => c.text.includes(q)).slice(0, 80);
    }
    const TABLE_LABEL = { fiches: 'fiche', references: 'référence', calculs: 'calculateur', etapes_methode: 'étape', pieces: 'pièce', scenarios: 'scénario', trames: 'trame', grilles_entretien: 'grille', questions: 'question', accidents: 'accident', ressources: 'ressource', cabinets: 'cible', lexique_fr_en: 'lexique', a_verifier: 'à vérifier' };
    return `<h1>Recherche<\/h1>
      <p class="muted">${q ? `${hits.length} résultat(s) pour « ${esc(q)} »` : 'Saisir au moins 2 caractères dans la barre du haut.'}<\/p>
      <ul class="clean searchhit">${hits.map((h2) => `<li><a href="${h2.route}">${esc(h2.titre)}<\/a>
        <span class="badge theme">${TABLE_LABEL[h2.table]}<\/span> ${badge(h2.statut)}<\/li>`).join('')}<\/ul>`;
  };

  // ---------------------------------------------------------------- fiches
  VUES.fiches = function (params) {
    const th = params.get('theme') || '';
    const st = params.get('statut') || '';
    const themes = [...new Set(DB.fiches.items.map((f) => f.theme))];
    const items = DB.fiches.items.filter((f) => (!th || f.theme === th) && (!st || f.statut === st));
    return `<h1>Fiches<\/h1>
      <div class="filters">${themes.map((t) => `<a class="chip ${t === th ? 'on' : ''}" href="#/fiches${t === th ? '' : '?theme=' + t}">${esc(t)}<\/a>`).join('')}
        ${['V', 'NV', 'ordre_de_grandeur'].map((s) => `<a class="chip ${s === st ? 'on' : ''}" href="#/fiches${s === st ? '' : '?statut=' + s}${th ? '&theme=' + th : ''}">${esc(s)}<\/a>`).join('')}<\/div>
      <ul class="clean">${items.map((f) => `<li><a href="#/fiche/${f.id}"><b>${esc(f.numero)}<\/b> — ${esc(f.titre)}<\/a>
        <span class="badge theme">${esc(f.theme)}<\/span> ${badge(f.statut)}<\/li>`).join('')}<\/ul>
      <p class="muted">La numérotation « noyau dur 1.0-1.11 » viendra du rapport_recherche.md (non fourni) — voir <a href="#/averifier">À vérifier<\/a>.<\/p>`;
  };

  VUES.fiche = function (_p, id) {
    const f = DB.fiches.items.find((x) => x.id === id);
    if (!f) return '<p>Fiche introuvable.<\/p>';
    const l = f.liens || {};
    const bloc = (label, ids) => (ids && ids.length ? `<p><b>${label} :<\/b> ${ids.map(refLink).join(' · ')}<\/p>` : '');
    return `<div class="toolbar no-print"><a class="btn" href="#/fiches">← Fiches<\/a>
        <button onclick="window.print()">Imprimer (A4)<\/button><\/div>
      <div class="card">
      <h1>${esc(f.numero)} — ${esc(f.titre)} ${badge(f.statut)} <span class="badge theme">${esc(f.theme)}<\/span><\/h1>
      <ul>${f.points.map((p) => `<li>${esc(p)}<\/li>`).join('')}<\/ul>
      ${bloc('Références', l.referenceIds)}${bloc('Calculateurs', l.calculIds)}${bloc('Questions', l.questionIds)}${bloc('Scénarios', l.scenarioIds)}
      ${f.note ? `<p class="muted">Note : ${esc(f.note)}<\/p>` : ''}
      <p class="print-only muted">Base personnelle de révision — ${new Date().toLocaleDateString('fr-FR')}. Statut : ${esc(STATUT_LABEL[f.statut] || f.statut)}.<\/p>
      <\/div>`;
  };

  // ------------------------------------------------------------ références
  VUES.references = function (params) {
    const ty = params.get('type') || '';
    const st = params.get('statut') || '';
    const focus = params.get('focus') || '';
    const types = [...new Set(DB.references.items.map((r) => r.type))];
    const items = DB.references.items.filter((r) => (!ty || r.type === ty) && (!st || r.statut === st));
    setTimeout(() => { const el = document.getElementById(focus); if (el) el.scrollIntoView({ block: 'center' }); }, 30);
    return `<h1>Références<\/h1>
      <div class="filters">${types.map((t) => `<a class="chip ${t === ty ? 'on' : ''}" href="#/references${t === ty ? '' : '?type=' + t}">${esc(t)}<\/a>`).join('')}
      ${['V', 'NV'].map((s) => `<a class="chip ${s === st ? 'on' : ''}" href="#/references${s === st ? '' : '?statut=' + s}${ty ? '&type=' + ty : ''}">${s}<\/a>`).join('')}<\/div>
      ${items.map((r) => `<div class="card" id="${r.id}">
        <h3>${esc(r.code)}${r.numero ? ' · ' + esc(r.numero) : ''} ${badge(r.statut)}<\/h3>
        <p><b>${esc(r.intitule)}<\/b><\/p><p>${esc(r.resume)}<\/p>
        ${r.source_url ? `<p><a href="${esc(r.source_url)}" rel="noopener">Source consultée<\/a>${r.date_verification ? ' · vérifié le ' + esc(r.date_verification) : ''}<\/p>` : ''}
        ${r.note ? `<p class="muted">${esc(r.note)}<\/p>` : ''}<\/div>`).join('')}`;
  };

  // ----------------------------------------------------------- calculateurs
  VUES.calculs = function () {
    return `<h1>Calculateurs<\/h1>
      ${DB.calculs.items.map((c) => `<div class="card"><h3><a href="#/calc/${c.id}">${esc(c.titre)}<\/a> ${badge(c.statut)}<\/h3>
      <p class="muted">${esc(c.formule.slice(0, 140))}${c.formule.length > 140 ? '…' : ''}<\/p>
      <p><b>Base :<\/b> ${c.base_juridique.map(refLink).join(' · ') || '—'}<\/p><\/div>`).join('')}`;
  };

  const CALC_FORMS = {
    'calc-rp-capitaux': { run: (v) => CalcEngine.rpCapitaux(v), out: (r) => `Coefficient : <b>${num(r.coeff * 100)} %<\/b><br>Indemnité : <strong class="total">${eur(r.indemnite)}<\/strong>` },
    'calc-rp-prime': { run: (v) => CalcEngine.rpPrime(v), out: (r) => (r.indemnite == null ? 'Renseigner la prime due.' : `Coefficient : <b>${num(r.coeff * 100)} %<\/b><br>Indemnité réduite : <strong class="total">${eur(r.indemnite)}<\/strong>`) },
    'calc-chaine-indemnite': { run: (v) => CalcEngine.chaineIndemnite(v), out: (r) => `Vétusté : ${eur(r.vetuste)} · Valeur vétusté déduite : ${eur(r.valeur_vetuste_deduite)} · Coeff RP : ${num(r.coeff * 100)} %<br>Indemnité immédiate : <strong class="total">${eur(r.immediat)}<\/strong><br>Indemnité différée (rachat de vétusté) : <strong>${eur(r.differe)}<\/strong>` },
    'calc-pe': { run: (v) => CalcEngine.pe(v), out: (r) => `Marge brute perdue : ${eur(r.marge_perdue)} · Frais retenus (écrêtés) : ${eur(r.frais_retenus)}<br>Perte d'exploitation : <strong class="total">${eur(r.perte)}<\/strong>` },
    'calc-plafonds-transport': { run: (v) => CalcEngine.plafondsTransport(v), out: (r) => `${r.plafond_dts != null ? `Plafond : <strong class="total">${num(r.plafond_dts)} DTS<\/strong>` : ''}${r.plafond_eur != null ? `Plafond : <strong class="total">${eur(r.plafond_eur)}<\/strong>` : ''}${r.en_euros != null ? `<br>≈ ${eur(r.en_euros)} (au cours saisi)` : ''}` },
  };

  function calcForm(c) {
    if (c.id === 'calc-echeancier') return echeancierForm(c);
    const spec = CALC_FORMS[c.id];
    const inputs = c.parametres.map((p) => {
      if (p.type === 'choix') {
        return `<label>${esc(p.label)}<\/label><select name="${p.nom}">${p.options.map((o) => `<option>${o}<\/option>`).join('')}<\/select>`;
      }
      const defv = p.defaut != null ? ` value="${p.defaut}"` : '';
      const step = p.type === 'taux' ? ' step="0.01" placeholder="ex. 0,20 pour 20 %"' : ' step="any"';
      return `<label>${esc(p.label)}${p.optionnel ? ' <small>(optionnel)<\/small>' : ''}<\/label><input name="${p.nom}" type="number" inputmode="decimal"${step}${defv}>`;
    }).join('');
    return `<form class="calc" id="f-${c.id}" onsubmit="return false">${inputs}
      <p><button class="primary" data-run="${c.id}">Calculer<\/button><\/p>
      <div class="resultat" id="r-${c.id}" hidden><\/div><\/form>`;
  }

  function echeancierForm(c) {
    const dates = [['date_sinistre', 'Date du sinistre / de sa connaissance'], ['date_declaration', 'Date de déclaration'], ['date_livraison', 'Date de livraison (transport)'], ['date_accord', "Date d'accord sur la proposition"]];
    return `<form class="calc" id="f-${c.id}" onsubmit="return false">
      ${dates.map(([n, l]) => `<label>${l}<\/label><input type="date" name="${n}">`).join('')}
      <p><button class="primary" data-run="${c.id}">Calculer l'échéancier<\/button><\/p>
      <div class="resultat" id="r-${c.id}" hidden><\/div><\/form>`;
  }

  function runCalc(id) {
    const c = DB.calculs.items.find((x) => x.id === id);
    const form = document.getElementById('f-' + id);
    const out = document.getElementById('r-' + id);
    const vals = {};
    new FormData(form).forEach((v, k) => { vals[k] = v === '' ? null : (form.elements[k].type === 'number' ? parseFloat(v) : v); });
    out.hidden = false;
    if (id === 'calc-echeancier') {
      const r = CalcEngine.echeancier(vals);
      const labels = {}; const bases = {}; const stat = {};
      c.delais.forEach((d) => { labels[d.id] = d.label + ' — ' + d.regle; bases[d.id] = d.base; stat[d.id] = (INDEX[d.base] || {}).item; });
      labels['d-declaration-vol'] = 'Déclaration en cas de vol (2 jours ouvrés) — L.113-2';
      const rows = Object.keys(r).map((k) => {
        const st2 = stat[k] ? badge(stat[k].statut) : badge('V');
        return `<tr><td>${esc(labels[k] || k)} ${st2}<\/td><td><b>${new Date(r[k] + 'T12:00:00').toLocaleDateString('fr-FR')}<\/b><\/td><\/tr>`;
      }).join('');
      out.innerHTML = rows ? `<div class="tablewrap"><table class="flat"><tr><th>Échéance (base, règle)<\/th><th>Date limite<\/th><\/tr>${rows}<\/table><\/div><p class="muted">Jours fériés non décomptés automatiquement : les vérifier à la main (L.113-2, L.133-3).<\/p>` : 'Saisir au moins une date.';
      return;
    }
    const spec = CALC_FORMS[id];
    const r = spec.run(vals);
    out.innerHTML = spec.out(r);
  }

  VUES.calc = function (_p, id) {
    const c = DB.calculs.items.find((x) => x.id === id);
    if (!c) return '<p>Calculateur introuvable.<\/p>';
    return `<div class="toolbar no-print"><a class="btn" href="#/calculs">← Calculateurs<\/a><\/div>
      <h1>${esc(c.titre)} ${badge(c.statut)}<\/h1>
      <div class="card"><p><b>Formule.<\/b><\/p><div class="formule">${esc(c.formule)}<\/div>
      <p><b>Hypothèses :<\/b><\/p><ul>${c.hypotheses.map((h2) => `<li>${esc(h2)}<\/li>`).join('')}<\/ul>
      <p><b>Base juridique :<\/b> ${c.base_juridique.map(refLink).join(' · ')}<\/p>
      ${c.note ? `<p class="muted">${esc(c.note)}<\/p>` : ''}<\/div>
      <div class="card">${calcForm(c)}<\/div>
      <div class="card"><h3>Vecteurs de test embarqués<\/h3>
      <ul class="clean">${(c.vecteurs_test || []).map((v) => `<li><b>${esc(v.nom)}<\/b> — entrées ${esc(JSON.stringify(v.entrees))} → attendu ${esc(JSON.stringify(v.attendu))}${v.note ? `<br><small class="muted">${esc(v.note)}<\/small>` : ''}<\/li>`).join('')}<\/ul><\/div>`;
  };

  // -------------------------------------------------------------- méthode
  VUES.methode = function () {
    const scns = DB.scenarios.items;
    return `<h1>Méthode sinistre — 12 étapes<\/h1>
      <div class="toolbar"><button id="btn-reset-methode">Réinitialiser la checklist<\/button><\/div>
      <p>Scénarios fictifs déroulables : ${scns.map((s) => `<a class="btn" href="#/scenario/${s.id}">(${s.code}) ${esc(s.titre.slice(0, 40))}…<\/a>`).join(' ')}<\/p>
      <div class="checklist">
      ${DB.etapes_methode.items.map((e) => {

  // Tirage chronométré
  const TIRAGE = { actif: false, questions: [], i: 0, notes: [], timer: null, restant: 90, grille: '' };
  function startTirage(grilleId) {
    const g = DB.grilles_entretien.items.find((x) => x.id === grilleId);
    const pool = g.questionIds.map(questionById).filter(Boolean).filter((q) => q.type !== 'a_poser');
    const n = Math.min(5, pool.length);
    const qs = [...pool].sort(() => Math.random() - 0.5).slice(0, n);
    Object.assign(TIRAGE, { actif: true, questions: qs, i: 0, notes: [], restant: 90, grille: g.poste });
    renderTirage();
    TIRAGE.timer = setInterval(() => {
      TIRAGE.restant--; const el = $('#chrono');
      if (el) { el.textContent = fmtChrono(TIRAGE.restant); el.className = 'timer' + (TIRAGE.restant <= 0 ? ' over' : (TIRAGE.restant <= 15 ? ' warn' : '')); }
    }, 1000);
  }
  function fmtChrono(s) { const a = Math.abs(s); const m = Math.floor(a / 60); const r = a % 60; return (s < 0 ? '−' : '') + m + ':' + String(r).padStart(2, '0'); }
  function renderTirage() {
    const z = $('#zone-tirage'); if (!z) return;
    if (!TIRAGE.actif) { z.innerHTML = ''; return; }
    if (TIRAGE.i >= TIRAGE.questions.length) {
      clearInterval(TIRAGE.timer);
      const moyenne = TIRAGE.notes.reduce((a, b) => a + b, 0) / TIRAGE.notes.length;
      P.progression.historique_entrainements.push({ date: new Date().toISOString().slice(0, 10), grille: TIRAGE.grille, n: TIRAGE.notes.length, moyenne: Math.round(moyenne * 10) / 10 });
      save();
      z.innerHTML = `<div class="card"><h3>Terminé<\/h3><p>Note moyenne auto-évaluée : <b>${num(moyenne)}/5<\/b>. Historique enregistré.<\/p><\/div>`;
      TIRAGE.actif = false;
      return;
    }
    const q = TIRAGE.questions[TIRAGE.i];
    TIRAGE.restant = 90;
    z.innerHTML = `<div class="card">
      <p class="muted">Question ${TIRAGE.i + 1}/${TIRAGE.questions.length} — réponds à voix haute, 90 s<\/p>
      <div class="timer" id="chrono">1:30<\/div>
      <p><b>${esc(q.question)}<\/b><\/p>
      <p><button id="btn-reveal">Voir la réponse attendue<\/button><\/p>
      <div id="rep" hidden><p>${esc(q.reponse)}<\/p>${q.a_eviter ? `<p><small>À éviter : ${esc(q.a_eviter)}<\/small><\/p>` : ''}
      <p>Auto-notation :<\/p><div class="notation">${[1, 2, 3, 4, 5].map((n) => `<button data-note="${n}">${n}<\/button>`).join('')}<\/div><\/div><\/div>`;
    $('#btn-reveal').onclick = () => { $('#rep').hidden = false; };
    z.querySelectorAll('[data-note]').forEach((b) => {
      b.onclick = () => { TIRAGE.notes.push(+b.dataset.note); TIRAGE.i++; renderTirage(); };
    });
  }

  // ------------------------------------------------------------------ quiz
  function srsState(id) { return P.progression.srs[id] || { ease: 2.5, interval: 0, due: '1970-01-01', reps: 0 }; }
  function srsDue() {
    const today = new Date().toISOString().slice(0, 10);
    const pool = DB.questions.items.filter((q) => q.type === 'flash' || q.type === 'technique');
    return pool.filter((q) => srsState(q.id).due <= today);
  }
  function srsGrade(id, grade) { // 0 encore, 3 difficile, 4 bien, 5 facile
    const s = srsState(id);
    if (grade < 3) { s.interval = 0; s.reps = 0; }
    else {
      s.reps += 1;
      s.ease = Math.max(1.3, s.ease + (0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02)));
      s.interval = s.reps === 1 ? 1 : (s.reps === 2 ? 3 : Math.round(s.interval * s.ease));
    }
    const d = new Date(); d.setDate(d.getDate() + Math.max(s.interval, grade < 3 ? 0 : 1));
    s.due = d.toISOString().slice(0, 10);
    P.progression.srs[id] = s;
    save();
  }

  }

  function ouvreCandidature(idx, cible) {
    const dlg = $('#dlg-cand'); if (!dlg) return;
    const f = dlg.querySelector('form');
    f.elements.idx.value = idx == null ? '' : idx;
    const c = idx != null ? P.candidatures.items[idx] : { cible: cible || '', poste: '', etape: 'repérée', contact: '' };
    f.elements.cible.value = c.cible; f.elements.poste.value = c.poste;
    f.elements.etape.value = c.etape; f.elements.contact.value = c.contact || '';
    f.elements.note.value = '';
    dlg.showModal();
    dlg.onclose = () => {
      if (dlg.returnValue === 'ok') {
        const date = new Date().toISOString().slice(0, 10);
        const item = idx != null ? P.candidatures.items[idx] : { id: 'cand-' + Date.now(), statut: 'NV', source_url: null, date_verification: null, note: null, historique: [] };
        item.cible = f.elements.cible.value; item.poste = f.elements.poste.value;
        item.etape = f.elements.etape.value; item.contact = f.elements.contact.value;
        if (f.elements.note.value) item.historique.push({ date, note: f.elements.note.value });

      } else if (dlg.returnValue === 'suppr' && idx != null) {
        if (confirm('Supprimer cette candidature ?')) { P.candidatures.items.splice(idx, 1); save(); route(); }

    };

      <p>Télécharge un JSON de tes données personnelles (STAR, candidatures, notes, progression, checklist méthode). Les données de référence, régénérées par build.py, n'y figurent pas : une mise à jour de l'outil n'écrase jamais tes données.<\/p>
      <p><button class="primary" id="btn-export">Exporter mes données (JSON)<\/button><\/p><\/div>
      <div class="card"><h3>Import<\/h3>
      <p>Recharge un export précédent (remplace les données personnelles actuelles après confirmation).<\/p>
      <p><input type="file" id="inp-import" accept="application/json"><\/p><\/div>
      <div class="card"><h3>Réinitialiser<\/h3>
      <p><button id="btn-reset">Revenir aux données d'origine<\/button><\/p><\/div>`;
  };

  // ---------------------------------------------------------------- routage
  const NAV = [
    ['#/accueil', 'Accueil'], ['#/fiches', 'Fiches'], ['#/references', 'Références'],
    ['#/calculs', 'Calculs'], ['#/methode', 'Méthode'], ['#/entretien', 'Entretien'],
    ['#/quiz', 'Quiz'], ['#/lexique', 'Lexique'], ['#/trames', 'Trames'],
    ['#/cabinets', 'Cibles'], ['#/candidatures', 'Candidatures'],
    ['#/ressources', 'Ressources'], ['#/averifier', 'À vérifier'], ['#/donnees', 'Mes données'],
  ];
  function route() {
    const hash = location.hash || '#/accueil';
    const [path, qs] = hash.split('?');
    const parts = path.replace(/^#\//, '').split('/');
    const vue = parts[0] || 'accueil';
    const arg = parts[1] ? decodeURIComponent(parts[1]) : null;
    const params = new URLSearchParams(qs || '');
    const fn = VUES[vue] || VUES.accueil;
    main().innerHTML = fn(params, arg);
    document.querySelectorAll('nav.tabs a').forEach((a) => {
      a.classList.toggle('active', a.getAttribute('href').split('?')[0] === '#/' + vue);
    });
    window.scrollTo(0, 0);
    bind(vue);
  }

  function bind(vue) {
    // délégation des actions propres à chaque vue
    main().querySelectorAll('[data-run]').forEach((b) => { b.onclick = () => runCalc(b.dataset.run); });
    main().querySelectorAll('[data-etape]').forEach((cb) => {
      cb.onchange = () => { P.methode[cb.dataset.etape] = cb.checked; save(); cb.closest('.etape').classList.toggle('done', cb.checked); };
    });
    const r1 = $('#btn-reset-methode'); if (r1) r1.onclick = () => { if (confirm('Décocher les 12 étapes ?')) { P.methode = {}; save(); route(); } };
    const t1 = $('#btn-tirage'); if (t1) t1.onclick = () => startTirage(t1.dataset.grille);
    const sa = $('#btn-star-add'); if (sa) {
      sa.onclick = () => {
        const titre = prompt('Titre du récit :'); if (!titre) return;
        P.star.items.push({ id: 'star-' + Date.now(), titre, situation: '', tache: '', action: '', resultat: '', chiffres: '', tags: [], statut: 'NV', source_url: null, date_verification: null, note: null });
        save(); route();
      };
    }
    main().querySelectorAll('[data-star]').forEach((ta) => {
      ta.onchange = () => { P.star.items[+ta.dataset.star][ta.dataset.field] = ta.value; save(); };
    });
    const ca = $('#btn-cand-add'); if (ca) ca.onclick = () => ouvreCandidature(null);
    main().querySelectorAll('[data-edit-cand]').forEach((b) => { b.onclick = () => ouvreCandidature(+b.dataset.editCand); });
    const ex = $('#btn-export'); if (ex) {
      ex.onclick = () => {
        const blob = new Blob([JSON.stringify(P, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'expert-assurance-mes-donnees-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      };
    }
    const im = $('#inp-import'); if (im) {
      im.onchange = () => {
        const f = im.files[0]; if (!f) return;
        f.text().then((txt) => {
          const data = JSON.parse(txt);
          if (!data.star || !data.candidatures) { alert('Fichier non reconnu.'); return; }
          if (confirm('Remplacer les données personnelles actuelles par cet export ?')) {
            Object.keys(data).forEach((k) => { P[k] = data[k]; });
            save(); route();
          }
        }).catch(() => alert('JSON invalide.'));
      };
    }
    const rz = $('#btn-reset'); if (rz) {
      rz.onclick = () => {
        if (confirm('Effacer toutes les données personnelles (STAR, candidatures, progression) ?')) {
          try { localStorage.removeItem(LS_KEY); } catch (e) { /* */ }
          location.reload();
        }
      };
    }
  }

  // ---------------------------------------------------------------- amorçage
  function boot() {
    $('#nav').innerHTML = NAV.map(([h2, l]) => `<a href="${h2}">${l}<\/a>`).join('');
    $('#btn-theme').onclick = () => {
      P.ui.theme = P.ui.theme === 'auto' ? 'dark' : (P.ui.theme === 'dark' ? 'light' : 'auto');
      save(); applyTheme();
    };
    const si = $('#inp-recherche');
    si.addEventListener('input', () => {
      const q = si.value.trim();
      if (q.length >= 2) location.hash = '#/recherche?q=' + encodeURIComponent(q);
    });
    si.addEventListener('keydown', (e) => { if (e.key === 'Enter') location.hash = '#/recherche?q=' + encodeURIComponent(si.value.trim()); });
    window.addEventListener('hashchange', route);
    applyTheme();
    route();
  }
  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
