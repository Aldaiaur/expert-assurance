 transport, l'emballage, le remplissage, l'expédition, le chargement et le déchargement.","source_url":"https://www.fedlex.admin.ch/","statut":"V","date_verification":null,"note":"Fact-check n°19 + Partie 2.5 (auto-évaluation Q33)."},{"id":"ref-lca","type":"texte_suisse","code":"LCA","numero":null,"intitule":"Loi sur le contrat d'assurance (CH), révisée au 1er janvier 2022","resume":"Révision en vigueur depuis le 1er janvier 2022 : notamment prescription de 5 ans et action directe en RC. Articles précis à vérifier.","source_url":"https://www.fedlex.admin.ch/","statut":"NV","date_verification":null,"note":"Le dossier note « articles à vérifier ». RS 221.229.1 à confirmer sur Fedlex."},{"id":"ref-co-ch","type":"texte_suisse","code":"Code des obligations (CH)","numero":"art. 41/55/58/97 ; 335b ; 340 et s.","intitule":"Responsabilité civile, période d'essai, non-concurrence","resume":"Art. 41 (acte illicite), 55 (employeur), 58 (propriétaire d'ouvrage), 97 (inexécution). Art. 335b : période d'essai 1 mois par défaut, 3 mois au maximum. Art. 340 et s. : clause de non-concurrence, 3 ans au maximum.","source_url":"https://www.fedlex.admin.ch/","statut":"V","date_verification":null,"note":"Cités par le dossier (Partie 3 et 7.4). CC 679/684 (immissions) : à vérifier (dossier cas 6)."},{"id":"ref-sia-118","type":"norme","code":"SIA 118","numero":null,"intitule":"Conditions générales pour l'exécution des travaux de construction (CH)","resume":"Norme contractuelle suisse de référence dans la construction (garanties, réception, avis des défauts). Texte non reproduit.","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le dossier (lexique, cas 6)."},{"id":"ref-aeai","type":"referentiel","code":"Prescriptions AEAI (PPI)","numero":null,"intitule":"Prescriptions de protection incendie (CH)","resume":"PPI 2015 en vigueur, partiellement révisées au 1er avril 2026 ; les « PPI 2026 » entreront en vigueur à l'automne 2027 (AEAI/AIET) après plus de 11 000 commentaires et l'incendie de Crans-Montana. Texte non reproduit.","source_url":"https://www.bsvonline.ch/","statut":"V","date_verification":null,"note":"Fact-check n°21 et auto-évaluation Q35 du dossier."},{"id":"ref-cfst-6508","type":"referentiel","code":"Directive CFST 6508","numero":null,"intitule":"Appel aux médecins du travail et spécialistes MSST (CH)","resume":"Directive suisse sur le recours aux spécialistes de la sécurité au travail (MSST), cadre de la prévention en entreprise avec la LAA/OPA et la Suva.","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le lexique du dossier."},{"id":"ref-decret-86-83","type":"article_loi","code":"Décret n° 86-83 du 17 janvier 1986","numero":"art. 48","intitule":"Préavis de démission des agents contractuels de l'État","resume":"Préavis de démission selon l'ancienneté — 1 mois entre 6 mois et 2 ans d'ancienneté (à confirmer sur le texte).","source_url":null,"statut":"NV","date_verification":null,"note":"Le dossier (7.4) note « à vérifier ». Contrôler sur Légifrance avant de poser sa démission."}]},"calculs":{"_table":"calculs","_source":"Formules : Code des assurances / contrat type / conventions (voir references) + rapport_recherche (blocs 1.3, 1.4, 2.4) et dossier fact-check. Les vecteurs de test sont la source unique de vérité partagée par l'app, le classeur Excel et tests/.","items":[{"id":"calc-rp-capitaux","titre":"Règle proportionnelle de capitaux (L.121-5)","formule":"Indemnité = Dommage × (Capitaux déclarés / Valeur réelle au jour du sinistre), plafonnée au dommage","hypotheses":["Applicable sauf convention contraire : tolérance (souvent 10 %, pratique non sourcée), premier risque, abandon de règle proportionnelle, indexation, déclaration révisable.","La valeur réelle s'apprécie au jour du sinistre.","Si capitaux déclarés ≥ valeur réelle : pas de réduction (coefficient plafonné à 1)."],"base_juridique":["ref-l121-5","ref-l121-1"],"parametres":[{"nom":"dommage","label":"Montant du dommage (€)","type":"montant"},{"nom":"declare","label":"Capitaux déclarés (€)","type":"montant"},{"nom":"reel","label":"Valeur réelle au jour du sinistre (€)","type":"montant"}],"vecteurs_test":[{"nom":"acceptation-mission","entrees":{"dommage":200000,"declare":800000,"reel":1000000},"attendu":{"indemnite":160000},"note":"Exemple du rapport (bloc 1.2) ; cumul éventuel avec L.113-9 (→ 128 k€) à vérifier en doctrine [NV]"},{"nom":"scn-a-materiel","entrees":{"dommage":1800000,"declare":4000000,"reel":5000000},"attendu":{"indemnite":1440000},"note":"Scénario (a) : coefficient 0,80 sur le matériel (appliqué après vétusté dans la chaîne)"},{"nom":"sur-assurance","entrees":{"dommage":100000,"declare":1200000,"reel":1000000},"attendu":{"indemnite":100000},"note":"Coefficient plafonné à 1 (principe indemnitaire L.121-1)"}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Texte de L.121-5 contrôlé verbatim le 2026-11-10 (édition DILA)."},{"id":"calc-rp-prime","titre":"Règle proportionnelle de prime (L.113-9)","formule":"Indemnité = Dommage × (Taux de prime payé / Taux de prime dû si le risque avait été exactement déclaré)","hypotheses":["Suppose une omission ou déclaration inexacte SANS mauvaise foi établie (sinon : nullité, L.113-8).","Constatée après sinistre. Avant sinistre : maintien avec surprime ou résiliation à 10 jours.","Le rapport s'applique aux taux de prime ; à assiette constante, le rapport des primes donne le même résultat.","Le cumul avec la règle proportionnelle de capitaux (L.121-5) est à vérifier en doctrine [NV]."],"base_juridique":["ref-l113-9","ref-l113-8"],"parametres":[{"nom":"dommage","label":"Montant du dommage (€)","type":"montant"},{"nom":"prime_payee","label":"Prime (ou taux) payée","type":"montant"},{"nom":"prime_due","label":"Prime (ou taux) qui aurait été due","type":"montant"}],"vecteurs_test":[{"nom":"exemple-rapport","entrees":{"dommage":160000,"prime_payee":8000,"prime_due":10000},"attendu":{"indemnite":128000},"note":"Exemple du rapport (bloc 1.2) : cumul L.121-5 puis L.113-9 → 128 k€ (cumul à vérifier en doctrine [NV])"}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Texte de L.113-9 contrôlé verbatim le 2026-11-10 (édition DILA)."},{"id":"calc-chaine-indemnite","titre":"Chaîne d'indemnisation : valeur à neuf → vétusté → règle proportionnelle → franchise → plafond → indemnité différée","formule":"Vétusté = VN × taux de vétusté ; Valeur d'usage (VD) = VN − Vétusté ; coeff RP = min(1, déclaré/réel) ; Immédiat = min(VD × coeff RP − franchise ; plafond éventuel) ; Différé (vétusté récupérable) = min(Vétusté ; taux max × VN) × coeff RP","hypotheses":["Ordre usuel du rapport (bloc 1.3) : VN → − vétusté → × RP → − franchise → écrêtement au plafond → différé avec le même coefficient. LIRE TOUJOURS LA POLICE [NV sur l'ordre].","La vétusté récupérable (différé) est versée si reconstruction dans le délai prévu (souvent 2 ans) et plafonnée, souvent à 25 % ou 33 % de la VALEUR À NEUF — pratique [NV].","Il n'existe pas de grille légale de vétusté : bâtiment 1-2 %/an, matériel industriel 5-10 %/an, informatique 15-33 %/an sont des ordres de grandeur NON SOURCÉS.","TVA : indemnisation hors taxes si l'entreprise la récupère [NV] ; sauvetage en déduction ; stock de produits finis au prix de revient (la marge relève de la PE).","Erreurs de débutant : franchise avant la règle proportionnelle ; TVA récupérable indemnisée ; stock au prix de vente."],"base_juridique":["ref-l121-5","ref-l121-1","ref-l121-17"],"parametres":[{"nom":"dommage_van","label":"Dommage en valeur à neuf (€)","type":"montant"},{"nom":"taux_vetuste","label":"Taux de vétusté","type":"taux"},{"nom":"declare","label":"Capitaux déclarés (€)","type":"montant"},{"nom":"reel","label":"Valeur réelle (€)","type":"montant"},{"nom":"franchise","label":"Franchise (€)","type":"montant"},{"nom":"plafond","label":"Plafond / LCI (€, optionnel)","type":"montant","optionnel":true},{"nom":"taux_rachat_max","label":"Vétusté récupérable plafonnée à (en % de la VN)","type":"taux","defaut":0.25}],"vecteurs_test":[{"nom":"acceptation-mission-batiment","entrees":{"dommage_van":900000,"taux_vetuste":0.2,"declare":3000000,"reel":3600000,"franchise":10000,"plafond":null,"taux_rachat_max":0.25},"attendu":{"immediat":590000,"differe":150000},"note":"Exercice du dossier fact-check : RP 83,33 % ; 720 k€ × 83,33 % − 10 k€ = 590 k€ ; différé min(180 ; 225) × 83,33 % = 150 k€"},{"nom":"scn-a-batiment","entrees":{"dommage_van":900000,"taux_vetuste":0.25,"declare":0,"reel":0,"franchise":0,"plafond":null,"taux_rachat_max":0.25},"attendu":{"immediat":675000,"differe":225000},"note":"Scénario (a) : bâtiment correctement déclaré (RP 1,00) ; différé min(225 ; 225) = 225 k€"},{"nom":"scn-a-materiel","entrees":{"dommage_van":1800000,"taux_vetuste":0.4,"declare":4000000,"reel":5000000,"franchise":0,"plafond":null,"taux_rachat_max":0.25},"attendu":{"immediat":864000,"differe":360000},"note":"Scénario (a) : VD 1 080 k€ × 0,80 = 864 k€ ; différé min(720 ; 25 % × 1 800 = 450) × 0,80 = 360 k€ — le plafond en % de la VN est ici contraignant"}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Bases L.121-5/L.121-1 vérifiées. Plafond du rachat de vétusté en % de la VN : pratique de marché [NV] (rapport blocs 1.3 et 2.4)."},{"id":"calc-pe","titre":"Perte d'exploitation","formule":"Indemnité = [(Baisse de CA × tendance) × taux de MB + FSE retenus − économies] × coeff RP (MB déclarée / MB réelle) − franchise, dans la limite du plafond. FSE retenus = min(FSE ; marge brute sauvée). Franchise en montant, ou en jours ouvrés de MB (base 250 jours/an)","hypotheses":["Marge brute ASSURÉE, méthode soustractive : CA + variation des stocks − charges variables (≠ marge comptable) ; méthode additive : résultat + frais généraux permanents [NV].","Les frais supplémentaires d'exploitation (FSE) sont admis dans la limite de la marge brute qu'ils sauvent.","Tendance : ajustement du CA de référence (ex. ×1,05).","Règle proportionnelle en PE : MB déclarée / MB réelle.","Période d'indemnisation 12 à 24 mois ; franchise en jours ouvrés (base 250 j/an) ou en montant — pratique [NV].","Extensions : carence de fournisseurs ou de clients, impossibilité d'accès."],"base_juridique":["ref-l121-1"],"parametres":[{"nom":"baisse_ca","label":"Baisse de chiffre d'affaires (€)","type":"montant"},{"nom":"tendance","label":"Coefficient de tendance","type":"taux","defaut":1},{"nom":"taux_marge","label":"Taux de marge brute assurée","type":"taux"},{"nom":"frais_supp","label":"Frais supplémentaires engagés (FSE, €)","type":"montant","defaut":0},{"nom":"perte_evitee","label":"Marge brute sauvée par ces frais (€)","type":"montant","defaut":0},{"nom":"economies","label":"Économies de charges (€)","type":"montant","defaut":0},{"nom":"mb_declaree","label":"MB déclarée (€, optionnel — RP)","type":"montant","optionnel":true},{"nom":"mb_reelle","label":"MB réelle (€, optionnel — RP)","type":"montant","optionnel":true},{"nom":"mb_annuelle","label":"MB annuelle (€, pour franchise en jours)","type":"montant","optionnel":true},{"nom":"franchise_jours","label":"Franchise (jours ouvrés)","type":"montant","defaut":0},{"nom":"franchise_pe","label":"Franchise (montant, prime sur les jours)","type":"montant","defaut":0}],"vecteurs_test":[{"nom":"cas1-fact-check-sans-frais","entrees":{"baisse_ca":1200000,"tendance":1,"taux_marge":0.6,"frais_supp":0,"perte_evitee":0,"economies":30000},"attendu":{"perte":690000},"note":"Cas 1 du dossier fact-check : 720 − 30 = 690 k€"},{"nom":"cas1-fact-check-avec-frais","entrees":{"baisse_ca":1200000,"tendance":1,"taux_marge":0.6,"frais_supp":90000,"perte_evitee":90000,"economies":30000},"attendu":{"perte":780000}},{"nom":"acceptation-scenario-a","entrees":{"baisse_ca":2400000,"tendance":1.05,"taux_marge":0.55,"frais_supp":250000,"perte_evitee":462000,"economies":60000,"mb_declaree":4000000,"mb_reelle":4400000,"mb_annuelle":4400000,"franchise_jours":3},"attendu":{"marge_perdue":1386000,"sous_total":1576000,"franchise":52800,"perte":1379927.27},"note":"Scénario (a) du rapport (bloc 2.4) : 1 576 000 × (4,0/4,4) = 1 432 727 ; − 52 800 → 1 379 927 (le rapport arrondit à l'euro). Le taux de 55 % n'est pas vérifié pour le secteur du décolletage."}],"statut":"V","source_url":null,"date_verification":null,"note":"Formule du rapport (bloc 1.4) — reproduit exactement la PE du scénario (a) : 1 379 927 €."},{"id":"calc-plafonds-transport","titre":"Plafonds d'indemnisation transport (contrat type général, CMR, Montréal, La Haye-Visby)","formule":"Contrat type général : envois < 3 t → min(33 € × kg ; 1 000 € × colis) ; envois ≥ 3 t → min(20 € × kg ; 3 200 € × tonnage). CMR : 8,33 DTS × kg. Montréal : 26 DTS × kg (22 DTS avant le 28/12/2024). La Haye-Visby : max(666,67 DTS × colis ; 2 DTS × kg). Conversion : montant DTS × cours du DTS saisi à la main","hypotheses":["Le cours du DTS (droit de tirage spécial, FMI) est SAISI MANUELLEMENT — aucune récupération réseau. Source : FMI ou Banque de France du jour.","Plafonds hors dol / faute inexcusable (CMR art. 29 ; C. com. L.133-8 ; contrat type art. 22.1) et hors déclaration de valeur ou intérêt spécial à la livraison.","Contrat type général : supplétif, applicable à défaut de convention écrite ; anciens plafonds (avant 2017) : 23 €/kg, 750 €/colis ; 14 €/kg, 2 300 €/t. Il existe 9 contrats types routiers (citerne, température dirigée…) aux plafonds propres [NV]. UTI : 2 875 € (source secondaire).","Montréal : la limite applicable est celle en vigueur à la date de l'événement (26 DTS/kg depuis le 28/12/2024).","La Haye-Visby : le décompte des colis d'un conteneur suit l'énumération au connaissement (art. IV(5)(c))."],"base_juridique":["ref-contrat-type-general","ref-cmr","ref-montreal","ref-hague-visby","ref-l133-8-ccom"],"parametres":[{"nom":"regime","label":"Régime","type":"choix","options":["ctg_moins_3t","ctg_3t_et_plus","cmr","montreal","hague_visby"]},{"nom":"poids_kg","label":"Poids brut concerné (kg)","type":"montant"},{"nom":"nb_colis","label":"Nombre de colis","type":"entier","defaut":1},{"nom":"taux_montreal","label":"Taux Montréal (DTS/kg)","type":"montant","defaut":26},{"nom":"cours_dts","label":"Cours du DTS (€/DTS, saisi à la main)","type":"montant","optionnel":true}],"vecteurs_test":[{"nom":"acceptation-mission-cmr","entrees":{"regime":"cmr","poids_kg":8000,"nb_colis":1},"attendu":{"plafond_dts":66640},"note":"8 000 kg × 8,33 = 66 640 DTS — scénario (c) : une fraction des 480 000 € de valeur, justification même de l'assurance facultés"},{"nom":"ctg-petit-envoi","entrees":{"regime":"ctg_moins_3t","poids_kg":400,"nb_colis":10},"attendu":{"plafond_eur":10000},"note":"min(33 × 400 = 13 200 ; 1 000 × 10 = 10 000) = 10 000 €"},{"nom":"ctg-gros-envoi","entrees":{"regime":"ctg_3t_et_plus","poids_kg":8000,"nb_colis":1},"attendu":{"plafond_eur":25600},"note":"min(20 × 8 000 = 160 000 ; 3 200 × 8 = 25 600) = 25 600 €"},{"nom":"hague-visby-max","entrees":{"regime":"hague_visby","poids_kg":5000,"nb_colis":4},"attendu":{"plafond_dts":10000},"note":"max(666,67 × 4 ; 2 × 5 000) = 10 000 DTS"},{"nom":"montreal-actuel","entrees":{"regime":"montreal","poids_kg":1000,"nb_colis":1,"taux_montreal":26},"attendu":{"plafond_dts":26000}}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Contrat type et limites Montréal/La Haye-Visby vérifiés le 2026-11-10 (voir references). CMR 8,33 : rapport + sources concordantes."},{"id":"calc-echeancier","titre":"Échéancier des délais (assurance et transport)","formule":"À partir des dates saisies (sinistre, déclaration, livraison, accord d'indemnisation), calcule les échéances : déclaration (L.113-2), réponse assureur (L.121-18), CatNat (L.125-2), protestation (L.133-3), réserves CMR (art. 30), prescriptions (L.114-1, L.133-6, CMR art. 32), présomption de perte (contrat type art. 21)","hypotheses":["« Jours ouvrés » (L.113-2) : lundi-vendredi hors jours fériés français vérifiés à la main (aucune table de fériés embarquée ne fait foi).","L.133-3 : 3 jours NON COMPRIS les jours fériés, à compter du lendemain de la réception.","L.121-18 : texte en vigueur, mais application pratique suspendue au décret en Conseil d'État (liste des contrats exclus) selon les commentateurs — publication du décret NV. Compteur à suivre dès maintenant.","La prescription biennale est interrompue notamment par la désignation d'expert ou une lettre recommandée (L.114-2) [NV].","CMR art. 30/32 : délais usuels affichés mais base NV (texte à contrôler) — badge affiché.","Les délais conventionnels plus favorables priment (L.125-2 in fine)."],"base_juridique":["ref-l113-2","ref-l121-18","ref-l125-2","ref-l133-3-ccom","ref-l133-6-ccom","ref-l114-1","ref-cmr","ref-contrat-type-general"],"parametres":[{"nom":"date_sinistre","label":"Date du sinistre / de sa connaissance","type":"date"},{"nom":"date_declaration","label":"Date de déclaration à l'assureur","type":"date","optionnel":true},{"nom":"date_livraison","label":"Date de livraison (transport)","type":"date","optionnel":true},{"nom":"date_accord","label":"Date d'accord sur la proposition","type":"date","optionnel":true}],"delais":[{"id":"d-declaration","label":"Déclaration du sinistre","base":"ref-l113-2","regle":"5 jours ouvrés (2 jours ouvrés en cas de vol, 24 h mortalité bétail) — minimum légal, le contrat peut prévoir plus","depuis":"date_sinistre"},{"id":"d-aggravation","label":"Déclaration de circonstances nouvelles","base":"ref-l113-2","regle":"15 jours à partir de la connaissance","depuis":"date_sinistre"},{"id":"d-reponse-sans-expert","label":"Proposition ou refus motivé de l'assureur (sans expert)","base":"ref-l121-18","regle":"2 mois depuis la déclaration","depuis":"date_declaration"},{"id":"d-reponse-avec-expert","label":"Proposition, refus motivé ou acompte (expert désigné)","base":"ref-l121-18","regle":"6 mois depuis la déclaration","depuis":"date_declaration"},{"id":"d-paiement","label":"Versement (ou missionnement de l'entreprise) après accord","base":"ref-l121-18","regle":"21 jours pour verser / 1 mois pour missionner, sinon intérêt légal","depuis":"date_accord"},{"id":"d-catnat-info","label":"CatNat : information de l'assuré et expertise","base":"ref-l125-2","regle":"1 mois depuis déclaration ou publication de l'arrêté","depuis":"date_declaration"},{"id":"d-protestation","label":"Protestation motivée au voiturier (France)","base":"ref-l133-3-ccom","regle":"3 jours, jours fériés non compris, après la réception","depuis":"date_livraison"},{"id":"d-cmr-apparent","label":"CMR : réserves avaries apparentes","base":"ref-cmr","regle":"au plus tard à la livraison","depuis":"date_livraison"},{"id":"d-cmr-non-apparent","label":"CMR : réserves avaries non apparentes","base":"ref-cmr","regle":"7 jours (dimanches et fériés non compris)","depuis":"date_livraison"},{"id":"d-cmr-retard","label":"CMR : réserve écrite pour retard","base":"ref-cmr","regle":"21 jours après la mise à disposition","depuis":"date_livraison"},{"id":"d-presomption-perte","label":"Présomption de perte (contrat type)","base":"ref-contrat-type-general","regle":"30 jours après l'expiration du délai de livraison","depuis":"date_livraison"},{"id":"d-prescription-transport","label":"Prescription des actions transport (France)","base":"ref-l133-6-ccom","regle":"1 an depuis la livraison (ou la date prévue en cas de perte totale)","depuis":"date_livraison"},{"id":"d-cmr-prescription","label":"CMR : prescription","base":"ref-cmr","regle":"1 an (3 ans en cas de dol)","depuis":"date_livraison"},{"id":"d-prescription-assurance","label":"Prescription biennale assurance","base":"ref-l114-1","regle":"2 ans depuis l'événement (5 ans sécheresse-réhydratation CatNat) ; interrompue par désignation d'expert ou LR (L.114-2 [NV])","depuis":"date_sinistre"}],"vecteurs_test":[{"nom":"delais-statiques","entrees":{"date_sinistre":"2027-01-04","date_declaration":"2027-01-05","date_livraison":"2027-01-04","date_accord":"2027-06-01"},"attendu":{"d-prescription-assurance":"2029-01-04","d-prescription-transport":"2028-01-04","d-reponse-sans-expert":"2027-03-05","d-paiement":"2027-06-22"},"note":"Contrôles simples : +2 ans, +1 an, +2 mois, +21 jours"}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Bases françaises vérifiées verbatim le 2026-11-10. Lignes CMR : NV. Décret L.121-18 : NV (voir a_verifier)."}]},"etapes_methode":{"_table":"etapes_methode","_source":"Structure : trame du classeur méthode (mission) + démarche des cas pratiques et fiches réflexes du dossier (Partie 2.2, Partie 5). Le rapport_recherche.md (bloc « portfolio et méthode ») n'ayant pas été fourni, cette liste de 12 étapes est une synthèse dossier + mission, à rapprocher de l'original quand il sera disponible.","items":[{"id":"et-01","ordre":1,"titre":"Prise de mission","objectif":"Cadrer le mandat avant tout acte","actions":["Lire la lettre de mission : qui mandate, pour quoi, quel périmètre","Vérifier l'absence de conflit d'intérêts","Identifier la police concernée et les intervenants connus","Noter les délais qui courent déjà (déclaration, protestation, prescription)"],"pieges":["Commencer les constatations sans mandat clair"],"pieceIds":["pc-police","pc-lettre-mission"],"referenceIds":["ref-l113-2"],"calculIds":["calc-echeancier"],"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"et-02","ordre":2,"titre":"Mesures conservatoires","objectif":"Limiter l'aggravation du dommage et préserver la preuve","actions":["Faire bâcher, mettre hors d'eau / hors d'air","Rétention des eaux d'extinction, traitement anticorrosion des machines","Sécuriser la zone (risque de ré-inflammation pour le lithium)","Poser les scellés : photos, étiquetage, numérotation, stockage sécurisé, procès-verbal contradictoire"],"pieges":["Laisser démonter ou déblayer avant convocation des parties","Ouvrir un scellé hors présence des parties"],"pieceIds":["pc-photos","pc-pv-scelles"],"referenceIds":["ref-nfpa-921"],"calculIds":[],"statut":"V","source_url":null,"date_verificati  12 mois / 3 jours ouvrés. Compteur L.121-18 ouvert à la déclaration (6 mois avec expert)."},{"etapeId":"et-02","contenu":"Bâchage, mise hors d'eau, rétention des eaux d'extinction, anticorrosion sur les tours épargnées, scellés sur l'armoire électrique d'origine. Courrier de préconisations tracé."},{"etapeId":"et-03","contenu":"Convoquer par écrit : assuré, mainteneur (contrat couvrant les armoires), fabricant du tour, leurs assureurs RC, et l'expert d'assuré s'il est mandaté. RIEN ne bouge avant la réunion contradictoire."},{"etapeId":"et-04","contenu":"Chronologie : alarme, télésurveillance, intervention SDIS. Récupérer le rapport Q18 : un échauffement signalé NON LEVÉ sur l'armoire en cause — pièce centrale du dossier."},{"etapeId":"et-05","contenu":"Pièces : police complète, Kbis, 3 liasses, grand livre, balances mensuelles, carnet de commandes, factures et registre des immobilisations, inventaires et méthode de valorisation des stocks, Q18/Q19 et levées de réserves, permis de feu, contrats de maintenance, bail (renonciation à recours ?)."},{"etapeId":"et-06","contenu":"Origine : zone de l'armoire électrique (figures de feu, arc mapping). Hypothèses multiples testées (NFPA 921 éd. 2024) ; refus de la « negative corpus ». Prélèvements sous protocole accepté avant toute analyse destructive."},{"etapeId":"et-07","contenu":"Garantie : exclusions formelles et limitées (L.113-1) ; la réserve Q18 non levée n'est PAS en soi une exclusion, sauf clause formelle et très apparente. Contrôle des capitaux : matériel 4,0 M€ déclarés / 5,0 M€ réels → RP 0,80 sur CE poste. Vérifier une tolérance (souvent 10 %, pratique)."},{"etapeId":"et-08","contenu":"Chiffrage : bâtiment 675 k€ (+225 k€ différés) ; matériel 864 k€ (+360 k€ différés, plafond 25 % VN contraignant) ; marchandises 500 k€ AU PRIX DE REVIENT ; frais 300 k€ ; − franchise 10 k€ → 2 329 k€ immédiat, 585 k€ différé."},{"etapeId":"et-09","contenu":"PE : (2,4 M€ × 1,05) × 55 % = 1 386 k€ ; + FSE 250 k€ (sauvent 462 k€) ; − 60 k€ d'économies = 1 576 k€ ; × RP MB 4,0/4,4 = 1 432,7 k€ ; − franchise 3 j (52,8 k€) → 1 379 927 €."},{"etapeId":"et-10","contenu":"Recours subrogatoire (L.121-12) contre le mainteneur (1231-1 C. civ., obligation de moyens/résultat selon contrat) et son assureur RC. La réserve non levée peut réduire le recours (faute partagée de l'assuré)."},{"etapeId":"et-11","contenu":"Réserve : DD ≈ 2,9 M€ (immédiat + différé) + PE ≈ 1,4 M€. Acompte motivé si causes/évaluation non établies à 6 mois (L.121-18)."},{"etapeId":"et-12","contenu":"Rapport préliminaire (circonstances, garantie apparente, provision) sous J+15-30 ; rapport définitif transmis à l'assureur ET à l'assuré une fois L.121-18 applicable ; quittance subrogative ; fiche recours avant prescription."}],"pieges":["Démonter avant convocation","Appliquer la franchise avant la règle proportionnelle","Valoriser le stock au prix de vente","Confondre réserve Q18 non levée et exclusion","Oublier que le plafond du différé se calcule sur la VN"],"version_en":"Bar-turning workshop fire (electrical cabinet): joint origin & cause, average on underinsured machinery (0.80), recoverable depreciation capped at 25% of replacement value, BI with trend, underinsurance and 3-working-day deductible, recovery against the maintenance contractor (unresolved thermography finding).","statut":"fictif","source_url":null,"date_verification":null,"note":"Scénario (a) complet du rapport (bloc 2.4) — reproduit exactement 2 329 000 / 585 000 / 1 379 927 €."},{"id":"scn-b","code":"b","marque":"FICTIF","titre":"Renversement d'une citerne d'UN 1202, affluent de l'Arve","resume":"Citerne de 30 m³ couchée dans un virage ; 8 m³ répandus, dont environ 3 m³ dans le cours d'eau ; 400 t de terres excavées. Comparables réels : ARIA 50520 (vitesse et mouvement du liquide) et ARIA 37008 (ballant dans une courbe).","donnees":{"produit":{"valeur":"UN 1202 (gazole)","origine":"dossier"},"capacite_citerne_m3":{"valeur":30,"origine":"dossier"},"volume_repandu_m3":{"valeur":8,"origine":"dossier"},"volume_cours_eau_m3":{"valeur":3,"origine":"dossier","note":"Environ"},"terres_excavees_t":{"valeur":400,"origine":"dossier"},"poids_kg":{"valeur":6800,"origine":"fictif-ajout","note":"8 m³ × 0,85 kg/L — hypothèse de densité pour l'exercice de plafond"},"chiffrage":{"valeur":"Uniquement sur devis — aucun coût de dépollution vérifié (travailler avec des entreprises type SOVEA)","origine":"dossier"}},"resultats_calcules":{"plafond_cmr_si_international":{"calcul":"calc-plafonds-transport","entrees":{"regime":"cmr","poids_kg":6800,"nb_colis":1},"attendu":{"plafond_dts":56644},"note":"Pour la marchandise elle-même ; le contrat type citerne (national) a ses propres plafonds [NV]"}},"deroule":[{"etapeId":"et-01","contenu":"Selon le mandant : assureur RC auto du transporteur, facultés, ou RC atteinte à l'environnement. Bien cadrer qui couvre quoi — l'étendue pollution de la RC auto est à vérifier [NV]."},{"etapeId":"et-02","contenu":"Urgence déjà en cours : SDIS, gendarmerie, maire/préfet, DREAL, police de l'eau, OFB, ARS (captages). Barrages, pompage, excavation des 400 t de terres."},{"etapeId":"et-03","contenu":"Convoquer transporteur, remplisseur, expéditeur (obligations ADR 1.4) et leurs assureurs. Rapport d'accident du conseiller (1.8.3.6) et déclaration 1.8.5 (seuil 1 000 L pour la catégorie de transport 3 [NV])."},{"etapeId":"et-04","contenu":"Chronologie : vitesse dans le virage, taux de remplissage (ballant — comparables ARIA 50520 et 37008), état du véhicule, heure d'alerte, cinétique d'arrivée au cours d'eau."},{"etapeId":"et-05","contenu":"Pièces transport : lettre de voiture, document ADR, consignes écrites, certificat de formation du conducteur, disque/tachygraphe, certificat de lavage/précédent chargement, contrat de transport."},{"etapeId":"et-06","contenu":"Cause du renversement : dynamique du véhicule (vitesse, ballant), chargement, infrastructure. Répartition selon ADR 1.4 : qui a rempli, à quel taux, qui a contrôlé ?"},{"etapeId":"et-07","contenu":"Garanties : RC automobile (pollution ?) ; RC atteinte à l'environnement / LRE (régime administratif du préfet : réparation primaire, complémentaire, compensatoire) ; préjudice écologique (C. civ. 1246 : OFB, fédération de pêche) ; marchandise en facultés ou RC du transporteur (contrat type citerne [NV])."},{"etapeId":"et-08","contenu":"Chiffrage SUR DEVIS uniquement : pompage, excavation et traitement des 400 t, analyses, suivi du milieu. Aucun ordre de grandeur sourcé — l'afficher tel quel."},{"etapeId":"et-09","contenu":"PE de tiers éventuelle (pisciculture, restriction de captage) : à traiter en RC, pas en dommages aux biens."},{"etapeId":"et-10","contenu":"Recours : de l'assureur RC auto contre le remplisseur si le remplissage n'était pas conforme (taux, catégorie ADR). Plafond marchandise : CMR 8,33 DTS/kg si international."},{"etapeId":"et-11","contenu":"Réserve en fourchette sur devis, révisée après les premières analyses du milieu."},{"etapeId":"et-12","contenu":"Rapport : séparer dommages à la marchandise (plafonnés), frais de dépollution (LRE/RC env.) et dommages aux tiers. Fiche recours avec prescriptions (1 an transport)."}],"pieges":["Oublier les captages et usages en aval","Mélanger RC auto / RC env / LRE / facultés","Avancer un coût de dépollution non sourcé","Laisser passer réserves et prescription transport (1 an)"],"version_en":"Overturned fuel tanker in a bend (liquid surge): emergency actors, ADR 1.4 duties and 1.8.3.6 report, layered covers (motor TPL, EIL/environmental liability, cargo), quote-based costing, recovery against the filler.","statut":"fictif","source_url":null,"date_verification":null,"note":"Scénario (b) du rapport (bloc 2.5). Comparables réels : voir accidents (ARIA 50520, 37008)."},{"id":"scn-c","code":"c","marque":"FICTIF","titre":"Batteries lithium vendues CIP, emballement chez le commissionnaire (Saint-Priest)","resume":"20 palettes d'UN 3480 (8 000 kg, 480 000 €) vendues CIP par un fournisseur asiatique. Une palette s'emballe pendant le stockage chez le commissionnaire. Transfert de risque, couverture ICC (A), exclusions emballage/vice propre, et recours en cascade.","donnees":{"marchandise":{"valeur":"20 palettes UN 3480 (batteries lithium-ion)","origine":"dossier"},"poids_kg":{"valeur":8000,"origine":"dossier"},"valeur_marchandise":{"valeur":480000,"origine":"dossier"},"incoterm":{"valeur":"CIP — risque transféré à la remise au premier transporteur ; le vendeur doit une couverture ICC (A) [NV]","origine":"dossier"},"lieu":{"valeur":"Stockage en transit chez le commissionnaire (Saint-Priest)","origine":"dossier"}},"resultats_calcules":{"plafond_cmr":{"calcul":"calc-plafonds-transport","entrees":{"regime":"cmr","poids_kg":8000,"nb_colis":1},"attendu":{"plafond_dts":66640},"note":"66 640 DTS : une fraction des 480 000 € — la justification même de l'assurance facultés"}},"deroule":[{"etapeId":"et-01","contenu":"Mission de l'assureur facultés (police du vendeur, bénéfice à l'acheteur) ou RC du commissionnaire. Identifier qui supporte le risque : transfert CIP à la remise au premier transporteur."},{"etapeId":"et-02","contenu":"RÉ-INFLAMMATION : quarantaine extérieure des palettes atteintes, surveillance thermique (comparable réel : Grand-Couronne, reprise du feu vers 3 h). Scellés sur la palette d'origine et les palettes intactes."},{"etapeId":"et-03","contenu":"Convoquer : commissionnaire, transporteur, expéditeur/vendeur, acheteur, leurs assureurs. Protocole d'analyse accepté AVANT toute analyse destructive."},{"etapeId":"et-04","contenu":"Chronologie : vidéosurveillance de l'entrepôt, température, historique du transport (choc ?), état de charge à l'expédition (recommandé 30-60 %, source secondaire)."},{"etapeId":"et-05","contenu":"Pièces : connaissement/CMR et réserves, facture, liste de colisage, déclaration en douane, document ADR, certificats d'emballage ONU (épreuves UN 38.3), contrat de commission, titre ICPE de l'entrepôt."},{"etapeId":"et-06","contenu":"Cause : choc en transport, cellule défectueuse, état de charge, emballage non conforme ? Analyse contradictoire en laboratoire des palettes intactes."},{"etapeId":"et-07","contenu":"Couverture : clause « warehouse to warehouse » (stockage en transit normal couvert). Au cœur du dossier : exclusions ICC (A) 4.3 (emballage insuffisant) et 4.4 (vice propre) [NV]."},{"etapeId":"et-08","contenu":"Chiffrage : palette détruite + dommages à l'entrepôt + frais de quarantaine et d'élimination (déchets dangereux). Vérifier la conformité ICPE de l'entrepôt pour ce stockage (leçon de Grand-Couronne)."},{"etapeId":"et-09","contenu":"PE : carence éventuelle de l'acheteur (contingent BI chez lui) ; frais supplémentaires de réapprovisionnement."},{"etapeId":"et-10","contenu":"Recours en cascade : expéditeur (ADR 1.4.2.1 — classement, emballage, épreuves) ; commissionnaire garant (L.132-5 et L.132-6) ; transporteur CMR limité à 8,33 × 8 000 = 66 640 DTS (sauf dol, art. 29). L'écart valeur/plafond justifie l'assurance facultés."},{"etapeId":"et-11","contenu":"Réserve : marchandise (jusqu'à 480 k€ selon cause et couverture) + dommages entrepôt + frais. Acomptes selon L.121-18 si applicable au contrat."},{"etapeId":"et-12","contenu":"Cargo survey report (EN) : instructions, attendance, consignment, packing, condition, extent, cause, mitigation, salvage, recovery."}],"pieges":["Sous-estimer la ré-inflammation","Analyser avant protocole contradictoire accepté","Ignorer les exclusions 4.3/4.4","Oublier le recours contre le commissionnaire (L.132-5/6)","Croire que le plafond CMR couvre la valeur"],"version_en":"Li-ion batteries sold CIP, thermal runaway at the forwarder's warehouse: risk transfer vs cover, warehouse-to-warehouse clause, ICC (A) packing and inherent-vice exclusions, UN 38.3 tests, cascading recoveries (shipper, freight forwarder, CMR carrier at 66,640 SDR).","statut":"fictif","source_url":null,"date_verification":null,"note":"Scénario (c) du rapport (bloc 2.6)."}]},"trames":{"_table":"trames","_source":"dossier_reconversion.pdf — Parties 4 (pitchs, writing guide, phrases EN, récit) et 7.3 (messages), Partie 5 cas 8 (réunion contradictoire). Employeur actuel anonymisé en « organisme public de recherche » (règle du dépôt).","items":[{"id":"tr-rapport-preliminaire","categorie":"rapport","titre":"Rapport préliminaire (plan type)","contenu":["Mandat (qui, quoi, quand)","Circonstances","Dommages constatés","Garantie et réserves éventuelles (« Nous réservons notre position sur la garantie dans l'attente de la police complète »)","Mesures conservatoires prises","Prochaines étapes","Réserve chiffrée"],"statut":"V","source_url":null,"date_verification":null,"note":"Writing guide, Partie 4.4"},{"id":"tr-risk-survey","categorie":"rapport","titre":"Risk survey report (plan type, EN)","contenu":["Summary : grade, EML/MFL","COPE : construction, occupation, protection, exposure","Natural catastrophe exposure","Business interruption","Ranked recommendations (par réduction d'EML et par coût)"],"statut":"V","source_url":null,"date_verification":null,"note":"Writing guide, Partie 4.4"},{"id":"tr-red-flag","categorie":"rapport","titre":"Red flag report DD EHS (plan type, EN)","contenu":["Scope","Summary table","Findings","Cost ranges with assumptions","SPA recommendations (specific indemnity, escrow, condition suspensive)","Reliance"],"statut":"V","source_url":null,"date_verification":null,"note":"Writing guide, Partie 4.4. Un red flag est matériel, probable, chiffrable et traitable contractuellement."},{"id":"tr-reunion-contradictoire","categorie":"reunion","titre":"Réunion contradictoire (déroulé)","contenu":["1. Objet de la réunion et présences","2. Règles d'échange","3. Constats","4. Divergences","5. Actions","6. Procès-verbal"],"phrases_fr":["« Je note votre position, elle figurera au procès-verbal. »","« Nous réservons notre position sur la garantie. »","« Je propose un sapiteur commun. »"],"phrases_en":["\"I note your position; it will be recorded in the minutes.\"","\"Let's agree on a joint expert.\""],"statut":"V","source_url":null,"date_verification":null,"note":"Cas 8 du dossier"},{"id":"tr-phrases-en","categorie":"langue","titre":"Key phrases EN (terrain)","contenu":["\"Before anything is moved, all parties will be invited to a joint inspection.\"","\"We reserve our position on cover pending review of the policy.\"","\"Walk me through the sprinkler impairment procedure.\"","\"Any regulatory notices or fines in the last five years? Any historical spills or underground tanks?\"","\"Three red flags; one potentially material: historic chlorinated solvents, likely cost €[X]–[Y]k. We recommend a specific indemnity rather than a price reduction.\"","\"The loss estimate assumes the sprinkler system is impaired and the fire wall holds.\""],"statut":"V","source_url":null,"date_verification":null,"note":"Parties 2.3 et 4.4"},{"id":"tr-model-answers","categorie":"langue","titre":"Model answers EN (entretien)","contenu":["Why loss adjusting? → investigation leading to financial decisions.","Why leave after a year? → \"delivered [X]; now seeking decision-making.\"","Why us? → recent deal (AM Group, HPC) + training path.","Explain BI → \"Lost gross profit plus extra costs to keep trading, during the indemnity period.\"","EML? → \"Largest loss if a key protection fails, under stated assumptions.\"","Lithium? → thermal runaway, re-ignition, toxic gases, segregation.","Military? → composure and accountability, not rigidity."],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.4"},{"id":"tr-pitch-30s-fr","categorie":"pitch","titre":"Pitch 30 s FR (expertise)","contenu":["« Ingénieur en gestion des risques, je suis conseiller à la sécurité TMD dans un organisme public de recherche : j'audite les flux de marchandises dangereuses, j'analyse les incidents et je fais appliquer des actions correctives. Avant cela : deux ans d'alternance au Ministère des Armées sur les audits TMD et environnement, deux ans chez Eiffage Route sur la traçabilité des déchets, et quatre ans comme chef de groupe d'infanterie, dont des OPEX au Tchad et au Niger. Je veux mettre cette capacité d'enquête et ce calme sous pression au service de l'expertise des sinistres d'entreprise et transport. »"],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.1 — employeur anonymisé pour le dépôt ; rétablir le nom à l'oral"},{"id":"tr-pitch-30s-en","categorie":"pitch","titre":"Pitch 30 s EN (risk engineering)","contenu":["\"I'm a risk and environmental engineer, currently Dangerous Goods Safety Adviser at a national public research organisation. I audit hazardous materials flows across classes 1 to 9, investigate incidents and drive corrective actions. Before that: two years of dangerous goods and environmental audits with the French Ministry of Armed Forces, two years on waste traceability at Eiffage Route, and four years as an infantry NCO section leader. I want to apply that field and audit experience to property risk assessment: hazardous storage, lithium batteries, fire protection.\""],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.1 — anonymisé pour le dépôt"},{"id":"tr-pitch-90s","categorie":"pitch","titre":"Pitch 90 s (trame FR) et 3 min","contenu":["1. Ingénieur ESAIP (CTI/EUR-ACE)","2. Audits TMD dans l'organisme actuel [nombre de laboratoires : à compléter]","3. Outil interne d'audit TMD (checklists automatisées)","4. Formation des préventeurs ; commandement de 8 soldats","5. Pourquoi ce métier : enquête, décision, enjeux financiers","6. Pourquoi vous : [spécialité de l'agence]","3 min = 90 s + un STAR sur le lithium + la mission en Espagne + l'objectif à 5 ans : référent entreprises/transport, certifié EEA. NE PAS parler du futur cabinet de conseil."],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.1 ; version EN 90 s dans le dossier"},{"id":"tr-recit-transition","categorie":"pitch","titre":"Récit de transition (FR/EN)","contenu":["FR : « Mon poste actuel m'a donné une maîtrise fine de l'audit réglementaire. Je veux maintenant que mon analyse technique débouche sur une décision : déterminer une cause, chiffrer un dommage, défendre une position en réunion contradictoire. »","EN : \"My current role gave me rigorous audit skills. Now I want my technical analysis to drive decisions with real financial stakes.\"","Sur la durée au poste actuel : « J'ai livré [outil, guides, formations] ; le dispositif est documenté. »","À ÉVITER : « assumer l'ennui » — le recruteur entend « il s'ennuiera ici aussi »."],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.2 — anonymisé"},{"id":"tr-contact-fr","categorie":"message","titre":"Premier contact (FR)","contenu":["« Bonjour [Prénom], ingénieur en gestion des risques et conseiller sécurité TMD dans un organisme public de recherche, je m'intéresse à l'expertise des sinistres d'entreprise et transport. Accepteriez-vous un échange de 15 minutes pour me donner votre regard sur le métier ? »","Relance à J+7 : « Je me permets une courte relance ; je reste disponible, y compris par téléphone. »"],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.3 — anonymisé"},{"id":"tr-contact-en","categorie":"message","titre":"First contact (EN)","contenu":["\"Hi [Name], I'm a risk engineer and dangerous goods safety adviser exploring a move into loss adjusting / risk engineering. Would you have 15 minutes for a quick call?\""],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.3"},{"id":"tr-script-appel","categorie":"message","titre":"Script d'appel (entretien informatif)","contenu":["1. Qui je suis","2. Pourquoi je contacte cette personne","3. « Qu'est-ce qui distingue un bon junior ? Recrutez-vous des profils sans expérience des sinistres ? »","4. Demander un nom ou une offre","5. Suivi écrit"],"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.3"},{"id":"tr-pv-contradicto te_verification":null,"note":null}]},"questions":{"_table":"questions","_source":"dossier_reconversion.pdf — Partie 4.3 (questions clés RH), questions techniques par niveau, questions de fond, Partie 8 (auto-évaluation, 40 questions).","items":[{"id":"q-rh-pourquoi-expertise","type":"rh","niveau":null,"question":"Pourquoi l'expertise ?","teste":"Compréhension","reponse":"Enquête + argent + contradictoire + service.","a_eviter":"« Pour le terrain » seul","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-conformite","type":"rh","niveau":null,"question":"« Profil conformité documentaire »","teste":"Stigmate","reponse":"Inspections de stockage, flux, incidents, OPEX — des verbes de terrain et des chiffres.","a_eviter":"Se justifier","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-chantier","type":"rh","niveau":null,"question":"« Avez-vous dirigé un chantier ? »","teste":"Honnêteté","reponse":"« Non : bureau performance RSE. Je connais les flux de déchets, pas la conduite de travaux ; d'où mon ciblage entreprise/transport. »","a_eviter":"Survente","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-cv-officer","type":"rh","niveau":null,"question":"« Votre CV dit officer training »","teste":"Rigueur","reponse":"« Erreur corrigée : l'ENSOA forme les sous-officiers. Je suis réserviste spécialiste au grade de capitaine au titre de mon expertise TMD. »","a_eviter":"Minimiser","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-allemand","type":"rh","niveau":null,"question":"« Pourquoi pas d'allemand ? » (Suisse)","teste":"Réalisme","reponse":"Plan concret [à compléter], postes francophones.","a_eviter":"Promettre un B2 en 3 mois","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-militaire","type":"rh","niveau":null,"question":"« Ancien militaire, trop rigide ? »","teste":"Posture","reponse":"« J'ai appris à écouter avant de décider ; je fais respecter une méthode, pas un grade. »","a_eviter":"Anecdotes guerrières","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-pretentions","type":"rh","niveau":null,"question":"Prétentions salariales","teste":"Réalisme","reponse":"France : 40-45 k€ fixe selon véhicule et variable ; Suisse : grilles du marché.","a_eviter":"55-70 k€ sans expérience","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-rh-faiblesse","type":"rh","niveau":null,"question":"Votre faiblesse ?","teste":"Lucidité","reponse":"Chiffrage assurance/PE encore récent + plan FEDEA pour y remédier.","a_eviter":"Fausse faiblesse","statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-cause-electrique","type":"fond","niveau":null,"question":"« La cause est électrique ? »","teste":null,"reponse":"« C'est une hypothèse : arc mapping, perles de fusion analysées en laboratoire, zone d'origine établie par les figures de feu et les témoins. »","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-acte-volontaire","type":"fond","niveau":null,"question":"« Et l'acte volontaire ? »","teste":null,"reponse":"Foyers multiples, accélérants (prélèvements, labo), effraction, contexte financier. « Je documente et je propose un sapiteur. »","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-convocation","type":"fond","niveau":null,"question":"« Qui convoquez-vous avant de déplacer l'armoire ? »","teste":null,"reponse":"L'assuré, le mainteneur ou l'installateur, le fabricant et leurs assureurs RC, ainsi que l'expert d'assuré. Par écrit, avec un délai raisonnable.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-scelles","type":"fond","niveau":null,"question":"« Les scellés ? »","teste":null,"reponse":"Photos, étiquetage, numérotation, stockage sécurisé, procès-verbal contradictoire ; aucune ouverture hors présence des parties.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-fond-aggravation","type":"fond","niveau":null,"question":"« Aggravation du risque ? »","teste":null,"reponse":"Comparer les déclarations à la réalité (L.113-8/9), sans confondre avec une exclusion.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"q-tech-deb-dab-rc","type":"technique","niveau":"debutant","question":"DAB vs RC : quelle différence et pourquoi est-ce structurant ?","teste":null,"reponse":"Dommages aux biens = contrat d'indemnité sur les biens de l'assuré ; RC = dette de responsabilité envers un tiers. Garanties, plafonds et gestion distincts. La confusion est éliminatoire.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Questions techniques — débutant"},{"id":"q-tech-deb-franchise","type":"technique","niveau":"debutant","question":"Franchise vs plafond ?","teste":null,"reponse":"La franchise reste à charge de l'assuré en bas de l'indemnité ; le plafond (ou LCI) borne l'indemnité en haut. EN : deductible / limit.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-deb-subrogation","type":"technique","niveau":"debutant","question":"La subrogation ?","teste":null,"reponse":"L'assureur qui a payé est subrogé dans les droits de l'assuré contre le tiers responsable (L.121-12), à concurrence de l'indemnité. D'où l'importance de préserver recours et preuves.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-int-rp","type":"technique","niveau":"intermediaire","question":"La règle proportionnelle ?","teste":null,"reponse":"Capitaux (L.121-5) : indemnité = dommage × déclaré/réel, sauf convention contraire. Prime (L.113-9) : réduction au prorata des taux de prime en cas de déclaration inexacte non intentionnelle.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-int-marge","type":"technique","niveau":"intermediaire","question":"La marge brute assurée ?","teste":null,"reponse":"CA − charges variables (≠ marge comptable). Perte = taux de marge × baisse de CA + frais supplémentaires − économies.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-int-fca","type":"technique","niveau":"intermediaire","question":"FCA (Incoterm) ?","teste":null,"reponse":"Free Carrier : le vendeur livre au transporteur désigné par l'acheteur ; le transfert de risque a lieu à la remise. Structure qui supporte le risque pendant le transport.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-int-adr14","type":"technique","niveau":"intermediaire","question":"ADR 1.4 ?","teste":null,"reponse":"Obligations de sécurité de chaque intervenant : expéditeur, transporteur, destinataire, chargeur, emballeur, remplisseur, exploitant de citerne, déchargeur. Grille de répartition des responsabilités dans un sinistre TMD.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-faute","type":"technique","niveau":"confirme","question":"Faute intentionnelle vs défaut d'entretien ?","teste":null,"reponse":"La faute intentionnelle ou dolosive (L.113-1) exclut la garantie : volonté de créer le dommage. Le défaut d'entretien reste couvert sauf exclusion formelle et limitée — il peut en revanche fonder un recours ou une règle proportionnelle si déclaré inexactement.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-carence","type":"technique","niveau":"confirme","question":"La carence ?","teste":null,"reponse":"PE subie sans dommage direct chez l'assuré : défaillance d'un fournisseur ou client sinistré (contingent BI). Garantie spécifique, souvent sous-limitée.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-clause","type":"technique","niveau":"confirme","question":"Clause limitative de responsabilité : opposable ?","teste":null,"reponse":"En transport intérieur, les clauses contraires à L.133-1 sont nulles ; les plafonds du contrat type s'appliquent à défaut de convention. Le dol et la faute inexcusable font sauter les limitations (CMR art. 29).","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-cmr29","type":"technique","niveau":"confirme","question":"CMR art. 29 ?","teste":null,"reponse":"Le transporteur perd le bénéfice des limitations (8,33 DTS/kg) en cas de dol ou de faute considérée comme équivalente au dol par la loi du for.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-tech-conf-eml","type":"technique","niveau":"confirme","question":"EML avec un mur percé ?","teste":null,"reponse":"L'EML raisonne sur le plus grand compartiment : un mur coupe-feu percé (porte calée, trémie non recoupée) fusionne les compartiments et fait exploser l'EML. « The loss estimate assumes the sprinkler system is impaired and the fire wall holds. »","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"q-recruteur","type":"a_poser","niveau":null,"question":"Questions à poser au recruteur","teste":null,"reponse":"1. Délégation de règlement et tutorat d'un junior ? 2. Parcours TEA/EEA ? 3. Véhicule, secteur, nuits dehors, astreintes catastrophes naturelles ? 4. Outils ? 5. En Suisse : langue des rapports ?","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Partie 4.3"},{"id":"qf-01","type":"flash","niveau":null,"question":"Prescription biennale ?","reponse":"L.114-1","statut":"V","source_url":null,"date_verification":null,"note":"Auto-évaluation n°1"},{"id":"qf-02","type "V","source_url":null,"date_verification":null,"note":"n°34"},{"id":"qf-35","type":"flash","niveau":null,"question":"PPI 2026 ?","reponse":"Automne 2027","statut":"V","source_url":null,"date_verification":null,"note":"n°35"},{"id":"qf-36","type":"flash","niveau":null,"question":"Fusion Helvetia Baloise ?","reponse":"5 décembre 2025","statut":"V","source_url":null,"date_verification":null,"note":"n°36"},{"id":"qf-37","type":"flash","niveau":null,"question":"Seuil fiscal du télétravail (frontalier) ?","reponse":"40 %","statut":"V","source_url":null,"date_verification":null,"note":"n°37"},{"id":"qf-38","type":"flash","niveau":null,"question":"Seuil social du télétravail ?","reponse":"49,9 % (attestation A1)","statut":"V","source_url":null,"date_verification":null,"note":"n°38"},{"id":"qf-39","type":"flash","niveau":null,"question":"Risque n°1 Allianz 2026 ?","reponse":"Cyber (42 %)","statut":"V","source_url":null,"date_verification":null,"note":"n°39"},{"id":"qf-40","type":"flash","niveau":null,"question":"Certification CNPP des experts ?","reponse":"EEA (ISO 17024, 6 ans)","statut":"V","source_url":null,"date_verification":null,"note":"n°40"},{"id":"q-loi-2026","type":"technique","niveau":"intermediaire","question":"« La loi du 26 mai 2026 ? »","teste":"Actualité","reponse":"Loi n° 2026-403 : L.113-5-1 (information de l'assuré sur son droit à contre-expertise à ses frais, en vigueur sans décret) et L.121-18 (6 mois avec expert / 2 mois sans, acomptes motivés, 21 jours pour payer après accord, rapport définitif transmis à l'assuré, contrôle ACPR — décret d'application attendu). Conséquence : rapports lisibles par l'assuré, solides face à un contre-expert, délais tenus.","a_eviter":"Ignorer le décret attendu","statut":"V","source_url":null,"date_verification":null,"note":"Grille 3.3 du rapport — LE différenciateur en entretien"},{"id":"q-stock-brule","type":"technique","niveau":"debutant","question":"« Un stock de produits finis brûlé, vous l'indemnisez comment ? »","teste":"Chiffrage","reponse":"Au prix de revient : la marge relève de la perte d'exploitation, pas des dommages directs.","a_eviter":"Le prix de vente","statut":"V","source_url":null,"date_verification":null,"note":"Grille 3.3 / bloc 1.3"},{"id":"q-palette-cassee","type":"technique","niveau":"intermediaire","question":"« Une palette cassée à la livraison ? »","teste":"Transport","reponse":"Réserves précises et motivées à la livraison ; protestation sous 3 jours (L.133-3, jours fériés non compris) en national ; CMR art. 30 à l'international (7 jours si le dommage n'est pas apparent). Sans réserve dans les délais, l'action est éteinte.","a_eviter":"« Je signe le bon et on verra »","statut":"V","source_url":null,"date_verification":null,"note":"Grille 3.3"},{"id":"q-deblayer","type":"fond","niveau":null,"question":"« L'assuré veut déblayer avant votre arrivée »","teste":"Mise en situation","reponse":"Mesures conservatoires et préservation des preuves, avec pédagogie : expliquer que le déblaiement avant constat contradictoire ruine le recours (donc une partie de son indemnisation via la subrogation) ; sécuriser, bâcher, photographier, isoler la zone d'origine ; proposer un calendrier rapide de réunion contradictoire.","a_eviter":"L'interdiction sèche sans explication","statut":"V","source_url":null,"date_verification":null,"note":"Grille 3.3"},{"id":"q-mandant-minimise","type":"fond","niveau":null,"question":"« Le mandant veut minimiser le chiffrage »","teste":"Éthique","reponse":"Indépendance : l'expert constate et évalue, il ne décide pas de la garantie. Le rapport est motivé techniquement — et désormais transmis à l'assuré (L.121-18) et exposé à une contre-expertise (L.113-5-1) : un chiffrage biaisé ne tient pas.","a_eviter":"« Je suis l'avis du client »","statut":"V","source_url":null,"date_verification":null,"note":"Grille 3.3"},{"id":"q-l121-18-agence","type":"a_poser","niveau":null,"question":"Question à poser : « Comment l'agence s'organise-t-elle pour L.121-18 ? »","teste":null,"reponse":"Montre la maîtrise de l'actualité : délais 6 mois / 2 mois, acomptes motivés, transmission du rapport à l'assuré, contrôle ACPR — et la question du décret d'application.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Grille 3.3"},{"id":"q-rcci","type":"technique","niveau":"intermediaire","question":"« Votre méthode RCCI ? »","teste":"Causes","reponse":"NFPA 921 (édition 2024) : méthode scientifique, zone d'origine par les figures de feu, arc mapping, hypothèses multiples testées par déduction ; refus de la « negative corpus » (conclure par simple élimination). Prélèvements sous protocole contradictoire.","a_eviter":"Affirmer une cause sans analyse","statut":"V","source_url":null,"date_verification":null,"note":"Grille 3.3 / bloc 1.8"},{"id":"q-en-cope","type":"technique","niveau":"intermediaire","question":"« Walk me through COPE. »","teste":"Risk engineering (EN)","reponse":"Construction (structure, compartimentage), Occupancy (activité, charges calorifiques, commodities), Protection (sprinklers, détection, impairments), Exposure (voisinage, nat-cat). Each drives the loss estimate and the recommendations.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Grille 3.4"},{"id":"q-en-pml-mfl","type":"technique","niveau":"confirme","question":"« PML vs MFL? »","teste":"Risk engineering (EN)","reponse":"PML : active protections in service ; MFL : active protections impaired. Definitions vary by insurer — always ask which in-house definition applies. Li-ion storage : DS 8-1 §2.4.2 and DS 7-112 ; impairments : DS 10-7 with the Red Tag system (DS 2-81) ; hot work : DS 10-3.","a_eviter":null,"statut":"V","source_url":null,"date_verification":null,"note":"Grilles 3.4 / bloc 1.10"},{"id":"q-dd-phase1","type":"technique","niveau":"intermediaire","question":"« Structure d'une Phase I ? Différence avec A100/A110 ? »","teste":"Due diligence","reponse":"Phase I (ASTM E1527-21) : revue documentaire et historique, visite, entretiens, identification des Recognized Environmental Conditions — sans prélèvements. NF X31-620 : codes de mission français (A100 visite, A110 étude historique et documentaire…) [NV]. Red flags type sur traitement de surface : chrome VI, solvants chlorés, cuves enterrées, mises en demeure.","a_eviter":null,"statut":"NV","source_url":null,"date_verification":null,"note":"Grille 3.5 / bloc 1.11 — codes de mission [NV]"}]},"accidents":{"_table":"accidents","_source":"rapport_recherche — bloc 4 (accidents types), statuts [V]/[NV] du rapport repris tels quels. Gabarit : date / lieu / exploitant / référence / déroulé / cause / facteurs aggravants / enseignements / lecture assurantielle.","items":[{"id":"acc-lubrizol","titre":"Lubrizol / NL Logistique, Rouen (76), 26/09/2019","base":"ARIA","numero_base":"54441","resume":"Feu découvert à 2 h 39 ; plus de 3 ha touchés ; plan POLMAR ; 225 écoles fermées ; pas de victime grave. Chez NL Logistique, 4 252 t brûlées sur 9 050 t stockées ; total sur les deux sites : 9 505 t. CAUSE NON ÉTABLIE dans les sources consultées — ne pas en affirmer une.","lecture_assurantielle":"Sinistre multi-sites ; recours des voisins et des tiers ; RC environnementale ; PE de tiers.","statut":"V","source_url":"https://www.aria.developpement-durable.gouv.fr/fiche_detaillee/54441_en/?lang=en","date_verification":null,"note":"Fiche de révision ARIA + rapport IGEDD n° 013014-01. Statut V attribué par le rapport de recherche (nov. 2026)."},{"id":"acc-grand-couronne","titre":"Bolloré Logistics, Grand-Couronne (76), 16/01/2023","base":"ARIA","numero_base":"60243","resume":"Feu dans une cellule de 6 000 m² stockant 12 250 batteries LMP usagées (propriété de Blue Solutions) en attente de diagnostic ; propagation à 3 cellules dont 70 000 pneus ; REPRISE DU FEU vers 3 h ; 892 t de batteries détruites. Site non autorisé à recevoir ces déchets dangereux : les deux sociétés mises en demeure et tenues « responsables solidairement ». Lithium à 200 000 µg/l dans la nappe ; batteries calcinées retirées en juillet 2025 ; enquête BEA-RI.","lecture_assurantielle":"Exclusions pour non-conformité réglementaire (formelles et limitées ?) ; frais de dépollution sur plusieurs années ; recours entre dépositaire et propriétaire des marchandises.","statut":"V","source_url":"https://www.aria.developpement-durable.gouv.fr/fiche_detaillee/60243_en/?lang=en","date_verification":null,"note":"Divergences relevées par le rapport : 12 000 / 12 250 / 12 300 batteries ; départ à 16 h 20 (ARIA) ou 16 h 30-16 h 50 (presse). Cas central pour le scénario (c) et le lithium."},{"id":"acc-viviez","titre":"SNAM, Viviez (12), 17/02/2024","base":"ARIA","numero_base":"61711","resume":"Départ sur 3 palettes de batteries de téléphones ; bâtiment de 3 000 m² contenant environ 1 076 t ; l'alarme sonne à 13 h 59 mais LE GARDIENNAGE NE RÉPOND PAS ; confinement dans un rayon de 500 m ; feu maîtrisé à 20 h 10.","lecture_assurantielle":"Recours contre le prestataire de télésurveillance (référentiel APSAD R31).","statut":"V","source_url":"https://www.aria.developpement-durable.gouv.fr/fiche_detaillee/61711_en/?lang=en","date_verification":null,"note":"Divergences relevées : 17/02 (ARIA) ou 14/02 (brochure IMPEL) ; 1 076 t (ARIA) ou 900 t (presse)."},{"id":"acc-fillinges","titre":"Citerne de propane, Fillinges (74), 20/01/2023","base":"BEA-TT","numero_base":"2023-03","resume":"Départ de feu dans le compartiment moteur « dont l'origine n'a pas pu être déterminée » selon le rapport final de septembre 2025 (le rapport annuel 2023, antérieur, parlait d'une origine « très vraisemblablement électrique ») → réservoir de gazole → gazole enflammé sous la citerne → rupture (BLEVE). Une personne blessée (ITT d'un mois) ; débris retrouvés jusqu'à environ un kilomètre ; trois recommandations et une invitation.","lecture_assurantielle":"RC automobile ; recours contre le constructeur ou le mainteneur. LE CAS LOCAL IDÉAL pour un entretien à Annecy.","statut":"V","source_url":"https://www.bea-tt.developpement-durable.gouv.fr/IMG/pdf/beatt_2023-03__fillinges_rapport_final.pdf","date_verification":null,"note":"Exemple de prudence sur la cause : la formulation a été AFFAIBLIE entre le rapport annuel et le rapport final."},{"id":"acc-a55","titre":"Citerne essence/gazole, A55, Châteauneuf-les-Martigues (13), 07/08/2006","base":"BEA-TT","numero_base":"2006-010","resume":"Citerne renversée après un dépassement, puis éventrée et incendiée. Cause : dynamique du véhicule et excès de vitesse ; le chargement n'est pas en cause.","lecture_assurantielle":"Responsabilité du transporteur (conduite) ; pas de recours chargement.","statut":"V","source_url":"https://www.bea-tt.developpement-durable.gouv.fr/IMG/pdf/Rapport_BEATT_2006_010_cle73791f.pdf","date_verification":null,"note":null},{"id":"acc-rn12","titre":"Citerne de carburant, RN 12, Plounévez-Moëdec (22), 24/04/2012","base":"BEA-TT","numero_base":"2012-008","resume":"Citerne de 32 m³ contre un camion de chantier ; incendie. Cause : absence de réaction du conducteur à l'approche du chantier balisé.","lecture_assurantielle":"RC du transporteur ; infrastructure hors de cause.","statut":"V","source_url":"https://www.bea-tt.developpement-durable.gouv.fr/IMG/pdf/Rapport_BEATT_2012_008.pdf","date_verification":null,"note":null},{"id":"acc-aria-50520","titre":"Renversement d'une citerne de gazole (36 000 l, ~2 600 l répandus)","base":"ARIA","numero_base":"50520","resume":"Vitesse et trajectoire inadaptées, mouvement du liquide (ballant). Comparable direct du scénario (b).","lecture_assurantielle":"Dynamique du véhicule + taux de remplissage : répartition transporteur/remplisseur.","statut":"V","source_url":"https://www.aria.developpement-durable.gouv.fr/","date_verification":null,"note":"Date exacte [NV] selon le rapport."},{"id":"acc-aria-37008","titre":"Renversement de citerne — ballant dans une courbe","base":"ARIA","numero_base":"37008","resume":"Ballant du liquide dans une courbe. Comparable du scénario (b).","lecture_assurantielle":"Même grille d'analyse que ARIA 50520.","statut":"V","source_url":"https://www.aria.developpement-durable.gouv.fr/","date_verification":null,"note":"Date exacte [NV] selon le rapport."},{"id":"acc-stats-barpi","titre":"Statistiques BARPI — inventaire 2024 (publié le 29/07/2025)","base":"autre","numero_base":"Inventaire 2024","resume":"400 accidents et 829 incidents en installations classées ; aucun accident majeur Seveso ; 2 accidents mortels, tous deux liés à des travaux par point chaud ; environ 70 % des accidents avec pertes financières, 27 % avec conséquences humaines, 57 % environnementales ; Seveso : 57 accidents et 180 incidents ; secteur le plus accidentogène : l'agroalimentaire (record de feux de séchoirs à grains au T4). 2023 : incendie dans 45 % des accidents, défaillance matérielle dans 60 %. 126 accidents touchant le milieu aquatique en 2024 (140 en 2023, OIEau d'après ARIA).","lecture_assurantielle":"Chiffres à citer en entretien ; les points chauds tuent (permis de feu, FM DS 10-3).","statut":"V","source_url":"https://www.aria.developpement-durable.gouv.fr/","date_verification":null,"note":"Inventaire des événements 2025 non consulté [NV] ; causes profondes identifiées dans ~40 % des cas en Seveso (source secondaire)."},{"id":"acc-pistes-nv","titre":"Fiches à compléter (références non vérifiées)","base":"autre","numero_base":"—","resume":"Pistes du rapport, numéros ARIA à retrouver : inondation de tannerie (lettre BARPI n° 86, nov. 2025) ; synthèse silos/ATEX 2015-2024 ; les 2 accidents mortels de 2024 (points chauds) ; lithium Sainte-Consorce (69, 15/04/2024, QE AN n° 18210) et Hwaseong (Corée, 24/06/2024) ; décolletage, traitement de surface, plasturgie, bris de machine, déchargement TMD (recherche ARIA par activité) ; navires X-Press Pearl (2021) et Maersk Honam (2018) ; carence de fournisseur Renesas Naka (2021).","lecture_assurantielle":"Compléter via la recherche ARIA par activité avant un ent
