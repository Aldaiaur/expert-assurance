/* Expert assurance — feuille de style (mobile d'abord, sombre, impression A4) */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5b6676;
  --line: #dde2ea; --accent: #1f5fbf; --accent-ink: #ffffff;
  --v: #15803d; --v-bg: #dcfce7; --nv: #b45309; --nv-bg: #fef3c7;

}
html[data-theme="dark"] {
  --bg: #11151c; --panel: #1a202b; --ink: #e7ebf2; --muted: #9aa5b5;
  --line: #2a3342; --accent: #6ea8ff; --accent-ink: #0d1117;
  --v: #4ade80; --v-bg: #14321f; --nv: #fbbf24; --nv-bg: #3a2b0a;

}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.35rem; margin: .2rem 0 .6rem; }
h2 { font-size: 1.12rem; margin: 1.1rem 0 .4rem; }
h3 { font-size: 1rem; margin: .9rem 0 .3rem; }
p { margin: .4rem 0; }
small, .muted { color: var(--muted); }

header.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; gap: .5rem; align-items: center;
  background: var(--panel); border-bottom: 1px solid var(--line); padding: .55rem .8rem;
}
header.topbar .brand { font-weight: 700; white-space: nowrap; }
header.topbar input[type="search"] {
  flex: 1; min-width: 0; padding: .45rem .6rem; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--bg); color: var(--ink); font-size: .95rem;
}
button, .btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: var(--radius); padding: .45rem .7rem; font-size: .92rem; cursor: pointer;
}
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button:active { transform: translateY(1px); }

nav.tabs {
  display: flex; gap: .3rem; overflow-x: auto; padding: .45rem .6rem; scrollbar-width: none;

nav.tabs::-webkit-scrollbar { display: none; }

}
nav.tabs a.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
nav.tabs a:hover { text-decoration: none; border-color: var(--line); }

main { padding: .8rem; max-width: 980px; margin: 0 auto; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .8rem .9rem; margin: .6rem 0;
}
.card h3 { margin-top: 0; }
.grid { display: grid; gap: .6rem; }
@media (min-width: 720px) { .grid.cols2 { grid-template-columns: 1fr 1fr; } }

.badge {
  display: inline-block; font-size: .72rem; font-weight: 700; padding: .08rem .45rem;
  border-radius: 999px; vertical-align: middle; letter-spacing: .02em;
}
.badge.V { color: var(--v); background: var(--v-bg); }
.badge.NV { color: var(--nv); background: var(--nv-bg); }
.badge.ordre_de_grandeur { color: var(--odg); background: var(--odg-bg); }
.badge.fictif { color: var(--fictif); background: var(--fictif-bg); }
.badge.theme { color: var(--muted); background: var(--bg); border: 1px solid var(--line); font-weight: 500; }

.bandeau-fictif {

  border-radius: var(--radius); padding: .4rem .7rem; font-weight: 700; margin: .5rem 0;

.filters { display: flex; flex-wrap: wrap; gap: .35rem; margin: .5rem 0; }
.filters .chip {

}
.filters .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

ul.clean { list-style: none; padding: 0; margin: .3rem 0; }
ul.clean li { padding: .3rem 0; border-bottom: 1px solid var(--line); }
ul.clean li:last-child { border-bottom: none; }

table.flat { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.flat th, table.flat td { text-align: left; padding: .35rem .45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
table.flat th { color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }

form.calc label { display: block; margin: .5rem 0 .15rem; font-size: .9rem; color: var(--muted); }

  width: 100%; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--ink); font-size: 1rem;
}
.resultat {
  margin-top: .7rem; padding: .7rem; border-radius: var(--radius);
  background: var(--bg); border: 1px solid var(--line); font-size: 1.02rem;
}
.resultat strong.total { font-size: 1.25rem; }
.formule { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .6rem; overflow-x: auto; }

.checklist .etape { border-left: 3px solid var(--line); padding-left: .7rem; margin: .7rem 0; }
.checklist .etape.done { border-left-color: var(--v); opacity: .75; }
.checklist .etape h3 { display: flex; align-items: center; gap: .5rem; }
.checklist input[type="checkbox"] { width: 1.15rem; height: 1.15rem; }

.timer { font-size: 2.4rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.timer.warn { color: var(--nv); }
.timer.over { color: var(--fictif); }
.notation { display: flex; gap: .4rem; justify-content: center; margin: .6rem 0; }
.notation button { min-width: 2.6rem; }

.srs-answer { display: none; }
.srs-card.revealed .srs-answer { display: block; }
.srs-actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }

.kpi { display: flex; gap: .8rem; flex-wrap: wrap; }
.kpi .stat { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .8rem; min-width: 7rem; }
.kpi .stat b { font-size: 1.3rem; display: block; }

.toolbar { display: flex; gap: .4rem; flex-wrap: wrap; margin: .5rem 0; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); max-width: 95vw; }
.searchhit mark { background: var(--nv-bg); color: inherit; border-radius: 3px; }

footer.app { text-align: center; color: var(--muted); font-size: .8rem; padding: 1rem; }

@media print {
  @page { size: A4 portrait; margin: 14mm; }
  header.topbar, nav.tabs, .toolbar, .filters, button, .no-print, footer.app { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  main { max-width: none; padding: 0; }

  a { color: #000; }
  .bandeau-fictif { border: 2px dashed #be123c; color: #be123c; background: #fff; }
  .print-only { display: block !important; }
}
.print-only { display: none; }

2026). Risk engineer : données Glassdoor contradictoires (148 k contre 90 k chez Helvetia).","Un salaire « doublé » devient plausible en brut nominal à 3-5 ans d'expérience, pas à l'entrée. Gain net frontalier à l'entrée : +40 à +70 % (estimation), pas un doublement.","Estimation illustrative : France 42 k€ brut (net ≈ 32-33 k€) + véhicule ; Vaud 80 k CHF brut 13e inclus (net ≈ 66-68 k CHF), impôt payé en France, 1 h à 1 h 30 de trajet en pointe.","Prétentions à annoncer : France 40-45 k€ fixe selon véhicule et variable ; Suisse : grilles du marché. À éviter : 55-70 k€ sans expérience.","Caveat : les chiffres jobs.ch, Glassdoor et Indeed sont auto-déclarés et reposent sur de petits échantillons."],"liens":{"referenceIds":[],"questionIds":["q-rh-pretentions"],"calculIds":[],"scenarioIds":[]},"statut":"ordre_de_grandeur","source_url":null,"date_verification":null,"note":"Fact-check n°14/15 + Partie 6.2 ; échantillons faibles"},{"id":"fiche-certifications","numero":"D-10","titre":"Certifications et formation continue","theme":"marche","points":["Le « CEA – Certificat d'Expertise en Assurance » n'existe pas. Les vrais repères : le TEA (CEA Développement) ; l'EEA du CNPP (ISO 17024, valable 6 ans, spécialité « Transport de marchandises » incluse) ; en transport, la recommandation CESAM, qui suppose l'EEA Transport.","La CEA est une chambre métier (Compagnie des experts, adossée à la FEDEA). Exemple de module FEDEA : « Expertise généraliste IARD », 5 jours, 570 € HT/jour, 2 ans de pratique « souhaitable ».","Profession non réglementée, mais certains assureurs ou conventions exigent le TEA ou l'EEA (L'Argus).","Prioritaires : module FEDEA (après l'embauche) ; module CNPP sprinklers ; formation courte sites et sols pollués ; allemand ; NEBOSH IGC (coût à vérifier).","Non prioritaires : PCR niveau 2, habilitation BE Vérification.","Sprint de 6 semaines : 1. Code des assurances et perte d'exploitation (Légifrance, FEDEA) · 2. Incendie (NFPA 921, CNPP, INRS) · 3. Sprinklers et lithium (FM Data Sheets) · 4. Sites et sols pollués, ICPE, Phase I · 5. Droit suisse (Fedlex, OFEV, bsvonline, Suva) · 6. Simulations d'entretien."],"liens":{"referenceIds":["ref-iso-17024","ref-nfpa-921","ref-fm-datasheets"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Fact-check n°6/7 + Partie 6.4 ; coût NEBOSH non vérifié"},{"id":"fiche-marche","numero":"D-11","titre":"Le marché bouge — actualités structurantes","theme":"marche","points":["Fusion Helvetia Baloise finalisée depuis le 5 décembre 2025 : moins d'embauches externes à court terme.","SGS a transféré son siège social de Genève à Baar (Zoug), voté à 88,99 % le 26 mars 2025, effectif au 1er novembre 2025 ; au moins 50 % des emplois genevois annoncés comme maintenus.","La CSRD a été réduite par l'Omnibus I : directive (UE) 2026/470, adoptée le 24 février 2026, publiée au JOUE le 26 février, en vigueur depuis le 18 mars 2026 ; transposition du volet CSRD au plus tard le 19 mars 2027 ; seuils cumulatifs : plus de 1 000 salariés ET plus de 450 M€ de CA.","Expertise : consolidation (Polyexpert–AM Group, Stelliant–HDE). L'IA automatise les petits sinistres et valorise les experts des dossiers complexes.","Allianz Risk Barometer 2026 : cyber n°1 (5e année, 42 %), IA n°2 (32 %, contre n°10 en 2025), interruption d'activité n°3 (première sortie du top 2), incendie n°9.","AEAI : PPI 2015 en vigueur, partiellement révisées au 1er avril 2026 ; les « PPI 2026 » entreront en vigueur à l'automne 2027 (AEAI/AIET), après plus de 11 000 commentaires et l'incendie de Crans-Montana."],"liens":{"referenceIds":["ref-csrd-omnibus","ref-aeai"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 0 (point 7), fact-check n°12/18/21/28, Partie 6.4"},{"id":"fiche-priorisation","numero":"D-12","titre":"Priorisation des pistes (plan d'attaque)","theme":"positionnement","points":["1. Expert IARD junior entreprises/transport (Lyon, Annecy, Chambéry) — formation interne, terrain, contradictoire, TMD valorisable — dès novembre 2026.","2. Risk engineer (assureurs, courtiers, FM) — technique, rapports en anglais, tremplin vers la Suisse — en parallèle.","3. Consultant DD EHS / sites et sols pollués — projets courts, prépare un futur conseil indépendant — en parallèle.","4. Suisse : bureaux d'ingénieurs, conseiller sécurité TMD — accessible sans expérience des sinistres — veille active.","5. Suisse : inspecteur de sinistres — exige de l'expérience — 2028-2029.","B. Organismes de contrôle, HSE Seveso, CERN — plan B rapide ; cycle CERN non vérifié — si aucune offre fin mars 2027.","Matrice de l'auteur (notes 1-5, total) : Expert FR 39 · Risk eng. 34 · Inspecteur CH 33 · Bureau CH 32 · Contrôle 31 · DD EHS 28 · CERN 27.","Le risque d'ennui existe partout : expertise junior = beaucoup de rédaction au départ ; DD = surtout du bureau ; risk engineering = du terrain, mais normé. Meilleur ratio action/enjeu à 3-5 ans : l'expertise « entreprises / grands risques »."],"liens":{"referenceIds":[],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 0 (priorisation) + Partie 6.1 ; matrice = jugement de l'auteur"},{"id":"fiche-france-suisse","numero":"D-13","titre":"France ou Suisse — règles frontalières","theme":"suisse","points":["Télétravail : seuil fiscal de 40 % (avenant du 27 juin 2023, accord amiable de 2026) ; seuil social de 49,9 % avec attestation A1 (25 % sans demande).","Imposition : à la source à Genève ; en France pour VD, VS, NE, JU, BE, SO, BS et BL (accord de 1983).","Non vérifié : le statut de quasi-résident, le régime LAMal/CMU et la LPP.","Période d'essai : France 4 mois pour un cadre, renouvelable si la branche le prévoit ; Suisse 1 mois par défaut, 3 mois au maximum (CO 335b).","Non-concurrence : France, clause limitée avec contrepartie financière ; Suisse, 3 ans au maximum (CO 340 et suivants).","Négociation : France — fixe, véhicule, intéressement, télétravail, certification ; Suisse — brut annuel 13e mois inclus, LPP, frais.","Règles de décision : offre FR ≥ 40 k€ avec tutorat : go. Bureau d'ingénieurs CH ≥ 78 k CHF (13e inclus) : go si trajet acceptable. CERN : go si l'offre arrive avant un autre engagement. Aucune offre fin mars 2027 : plan B, puis bascule vers l'expertise à 18 mois.","Préavis fonction publique : décret 86-83, art. 48 (à vérifier) : 1 mois entre 6 mois et 2 ans d'ancienneté."],"liens":{"referenceIds":[],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 6.2 + 7.4 ; items marqués non vérifiés dans a_verifier"},{"id":"fiche-positionnement","numero":"D-14","titre":"Positionnement et récit","theme":"positionnement","points":["Le profil combine réglementaire, audit, flux dangereux et leadership militaire : il se vend en expertise transport/TMD, pollution et risques d'entreprise ; il ne se vend pas en expertise construction pure.","Étiquettes par piste : expertise « risques & transport, investigation » ; risk engineering « hazardous materials & fire » ; due diligence « EHS compliance & audit ».","Contre le stigmate « conformité documentaire » : des verbes de terrain, des chiffres, un portfolio anonymisé.","Le récit gagnant : terrain, décision, enquête technique (motivation pull), pas l'ennui (push). « Assumer l'ennui » est risqué : le recruteur entend « il s'ennuiera ici aussi ».","Récit de transition (FR) : « Mon poste actuel m'a donné une maîtrise fine de l'audit réglementaire. Je veux maintenant que mon analyse technique débouche sur une décision : déterminer une cause, chiffrer un dommage, défendre une position en réunion contradictoire. »","Récit (EN) : « My current role gave me rigorous audit skills. Now I want my technical analysis to drive decisions with real financial stakes. »","Mention de la réserve : « Réserviste opérationnel spécialiste – conseiller TMD, grade de capitaine (depuis 09/2026) » ; ce grade est lié à l'expertise civile, ce n'est pas une carrière d'officier. Perception : défense et secteur public très positif ; Suisse neutre à positif ; anglo-saxons positif à condition d'éviter le jargon.","L'allemand est l'angle mort : seulement un « atout » pour l'inspecteur de terrain, mais exigé pour les spécialistes centralisés (C1 dans l'offre CFF) et de nombreux postes de risk engineer."],"liens":{"referenceIds":[],"questionIds":["q-rh-pourquoi-expertise","q-rh-militaire"],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Parties 0, 4.1, 4.2, 6.3"},{"id":"fiche-cv-corrections","numero":"D-15","titre":"CV — corrections obligatoires avant candidature","theme":"positionnement","points":["ENSOA : traduire « French Army NCO Academy » (l'ENSOA forme les sous-officiers), jamais « officer training ».","Un seul intitulé au Ministère des Armées (le CV porte deux intitulés selon les versions : « conseiller adjoint à la sécurité TMD » et « ingénieur environnement »).","Âge et ville cohérents : 30 ans, Annecy (des versions du CV portent Paris et 28/29 ans).","Ajouter la douane et la réserve : « coordination d'une équipe chargée des formalités douanières des chercheurs (Incoterms, import/export) » [à compléter] — atout cargo majeur.","Eiffage : présenter « Ingénieur RSE (alternance), Bureau performance RSE – solution de traçabilité des déchets en agences, déchets inertes, CSRD ; transfert vers l'Espagne » — une fonction RSE/déchets au siège, sans conduite de chantier. À la question « Avez-vous dirigé un chantier ? » : « Non : bureau performance RSE. Je connais les flux de déchets, pas la conduite de travaux ; d'où mon ciblage entreprise/transport. »","« 1 an d'alternance TMD + 1 an de CSTMD » est faux : en réalité 2 ans aux Armées, 2 ans chez Eiffage, environ 13 mois dans l'organisme actuel.","Décliner 3 CV ciblés avec mots-clés ATS : expertise « expertise IARD, sinistres entreprises, RC, DAB, PE, transport de marchandises, ADR, investigation » ; risk engineering « risk survey, loss prevention, sprinkler, ATEX, ICPE, Seveso, EML, BI, lithium » ; due diligence « Phase I, data room, red flag, sites et sols pollués, CAPEX, ISO 14001/45001 ».","Titres : « Ingénieur risques – sinistres d'entreprise, transport & TMD » / « Risk engineer – property & hazardous materials » / « EHS due diligence & compliance engineer ».","Accroche LinkedIn : « Ingénieur gestion des risques (ESAIP, CTI/EUR-ACE) | Conseiller sécurité TMD | Audit & investigation terrain | Ancien chef de groupe d'infanterie | Réserviste spécialiste (capitaine) ».","Diplôme ESAIP « Gestion des risques et environnement » : habilitation CTI et label EUR-ACE niveau master pour 2021-2025/26 (décision CTI 2020/12-03) ; le refus CTI de 2025 porte sur l'ouverture de l'apprentissage à Aix, pas sur l'habilitation existante ; renouvellement à contrôler."],"liens":{"referenceIds":[],"questionIds":["q-rh-cv-officer"],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"TL;DR, Top 10 des actions, fact-check n°24/25/29, Partie 4.5, et comparaison avec cv.pdf"},{"id":"fiche-feuille-route","numero":"D-16","titre":"Feuille de route 2026-2029","theme":"positionnement","points":["Mi-nov.-déc. 2026 : CV/LinkedIn, 10 entretiens informatifs, 15 candidatures — KPI : 5 contacts et 4 candidatures par semaine.","Janv.-mars 2027 : 2-3 processus avancés — KPI : 2 entretiens par semaine.","Avr.-juin 2027 : contrat signé, préavis.","S2 2027 : premiers dossiers, allemand A2, plan EEA.","2028-2029 : bascule suisse éventuelle.","Top 10 des 30 prochains jours : corriger le CV FR/EN ; décliner 3 CV ciblés ATS ; obtenir 10 entretiens informatifs ; postuler à toutes les offres « expert entreprises / RC / transport » en AURA (Saretec/Exetech, Stelliant, Polyexpert, Sedgwick, Crawford, McLarens, Cabinet Roux) ; apprendre L.113-2, L.113-8, L.113-9, L.114-1, L.121-1, L.121-12 et le calcul de la PE ; lire des résumés de la NFPA 921 et les guides CNPP/INRS ; préparer 8 récits STAR ; une simulation d'entretien en anglais + un risk survey report d'une page ; vérifier le préavis (décret 86-83) ; créer les alertes APEC, Welcome to the Jungle, jobup.ch et jobs.ch.","Événements : AMRAE, Préventica, Pollutec (Lyon), Expoprotection, Suissepro — les dates 2027 ne sont pas vérifiées."],"liens":{"referenceIds":[],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.1 + Top 10 ; dates de salons 2027 non vérifiées"}]},"references":{"_table":"references","_source":"dossier_reconversion.pdf (Partie 3 et passim) ; vérifications du 2026-11-10 sur l'édition DILA des codes (codes.droit.org, édition 2026-10-14, dernière modification 2026-08-20) et sources officielles citées en note. Les textes de normes privées (NFPA, APSAD, FM, ASTM, SIA) ne sont jamais reproduits : référence, résumé reformulé, lien.","items":[{"id":"ref-l113-1","type":"article_loi","code":"Code des assurances","numero":"L.113-1","intitule":"Charge des pertes et dommages — exclusions","resume":"L'assureur couvre les cas fortuits et les fautes de l'assuré, sauf exclusion formelle et limitée contenue dans la police. Il ne répond jamais de la faute intentionnelle ou dolosive de l'assuré.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim sur l'édition DILA 2026-10-14. Légifrance : rechercher « L113-1 code des assurances »."},{"id":"ref-l113-2","type":"article_loi","code":"Code des assurances","numero":"L.113-2","intitule":"Obligations de l'assuré — délais de déclaration","resume":"Obligations de l'assuré : payer la prime ; répondre exactement au questionnaire de risque ; déclarer les circonstances nouvelles aggravantes sous 15 jours (lettre recommandée) ; déclarer tout sinistre au plus tard dans le délai fixé par le contrat, qui ne peut être inférieur à 5 jours ouvrés — ramené à 2 jours ouvrés en cas de vol et 24 heures en cas de mortalité du bétail. La déchéance pour déclaration tardive exige que l'assureur prouve un préjudice.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14). Le dossier signalait ces délais « à vérifier » : c'est fait."},{"id":"ref-l113-4","type":"article_loi","code":"Code des assurances","numero":"L.113-4","intitule":"Aggravation et diminution du risque","resume":"En cas d'aggravation du risque en cours de contrat, l'assureur peut dénoncer le contrat (effet 10 jours après notification) ou proposer une nouvelle prime (résiliation possible à défaut de réponse sous 30 jours). Il ne peut plus s'en prévaloir s'il a maintenu l'assurance en connaissance de cause. Diminution du risque : droit à baisse de prime, sinon résiliation par l'assuré.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Le dossier marquait L.113-4 d'un (?) : référence confirmée, texte contrôlé verbatim. Ne pas confondre aggravation (L.113-8/9 pour la déclaration) et exclusion."},{"id":"ref-l113-8","type":"article_loi","code":"Code des assurances","numero":"L.113-8","intitule":"Fausse déclaration intentionnelle — nullité","resume":"Le contrat est nul en cas de réticence ou fausse déclaration intentionnelle qui change l'objet du risque ou en diminue l'opinion pour l'assureur, même sans influence sur le sinistre. Les primes restent acquises à l'assureur.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14)."},{"id":"ref-l113-9","type":"article_loi","code":"Code des assurances","numero":"L.113-9","intitule":"Fausse déclaration non intentionnelle — règle proportionnelle de prime","resume":"L'omission ou la déclaration inexacte sans mauvaise foi établie n'entraîne pas la nullité. Constatée après sinistre, l'indemnité est réduite « en proportion du taux des primes payées par rapport au taux des primes qui auraient été dues, si les risques avaient été complètement et exactement déclarés ». Avant sinistre : maintien avec surprime acceptée, ou résiliation à 10 jours.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim. Base du calculateur « règle proportionnelle de prime »."},{"id":"ref-l114-1","type":"article_loi","code":"Code des assurances","numero":"L.114-1","intitule":"Prescription biennale","resume":"Toutes actions dérivant d'un contrat d'assurance se prescrivent par 2 ans à compter de l'événement. Exception : 5 ans pour les dommages de mouvements de terrain liés à la sécheresse-réhydratation reconnus CatNat. Points de départ reportés en cas d'ignorance du sinistre ou de recours d'un tiers ; 10 ans dans certaines assurances de personnes.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim. L'exception sécheresse (5 ans) est récente et peu connue : à citer en entretien."},{"id":"ref-l121-1","type":"article_loi","code":"Code des assurances","numero":"L.121-1","intitule":"Principe indemnitaire","resume":"L'assurance de biens est un contrat d'indemnité : l'indemnité ne peut dépasser la valeur de la chose assurée au moment du sinistre. Franchise et découvert obligatoire peuvent être stipulés.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14)."},{"id":"ref-l121-5","type":"article_loi","code":"Code des assurances","numero":"L.121-5","intitule":"Règle proportionnelle de capitaux","resume":"« S'il résulte des estimations que la valeur de la chose assurée excède au jour du sinistre la somme garantie, l'assuré est considéré comme restant son propre assureur pour l'excédent, et supporte, en conséquence, une part proportionnelle du dommage, sauf convention contraire. » D'où : indemnité = dommage × (capitaux déclarés / valeur réelle). Dérogations possibles : premier risque, clause de tolérance.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim. Base du calculateur « règle proportionnelle de capitaux »."},{"id":"ref-l121-12","type":"article_loi","code":"Code des assurances","numero":"L.121-12","intitule":"Subrogation de l'assureur","resume":"L'assureur qui a payé est subrogé, à concurrence de l'indemnité, dans les droits de l'assuré contre les tiers responsables. Il est déchargé si la subrogation devient impossible du fait de l'assuré (d'où l'importance de préserver les recours). Pas de recours contre les proches et préposés, sauf malveillance.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14)."},{"id":"ref-l121-17","type":"article_loi","code":"Code des assurances","numero":"L.121-17","intitule":"Affectation des indemnités — remise en état","resume":"Les indemnités versées pour un dommage à un immeuble bâti doivent être utilisées pour sa remise en état effective (ou celle de son terrain d'assiette) ; clause contraire nulle d'ordre public ; arrêté du maire sous 2 mois.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim."},{"id":"ref-l121-18","type":"article_loi","code":"Code des assurances","numero":"L.121-18","intitule":"Délais de règlement des sinistres (loi n° 2026-403 du 26 mai 2026)","resume":"Créé par la loi n° 2026-403 du 26 mai 2026 (en vigueur depuis le 28 mai 2026). Avec expert désigné : proposition d'indemnisation (ou réparation en nature, ou refus motivé) sous 6 mois à compter de la déclaration ; à défaut d'établissement des causes/évaluation, proposition d'acompte motivée ou refus motivé d'acompte. Sans expert : 2 mois. Après accord de l'assuré : 1 mois pour missionner l'entreprise de réparation ou 21 jours pour verser — sinon intérêt légal. L'expert transmet son rapport définitif à l'assureur ET à l'assuré. Contrôle ACPR. Un décret en Conseil d'État liste les contrats exclus.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14). Légifrance : LEGIARTI000054136978. Décret d'application (liste d'exclusions) à surveiller — voir a_verifier. Article clé en entretien : très récent."},{"id":"ref-l125-1","type":"article_loi","code":"Code des assurances","numero":"L.125-1","intitule":"Catastrophes naturelles — garantie","resume":"Garantie CatNat obligatoire dans les contrats dommages aux biens situés en France (et PE si couverte). Effets CatNat = dommages matériels directs non assurables dont la cause déterminante est l'intensité anormale d'un agent naturel (régime particulier pour la sécheresse-réhydratation). État constaté par arrêté interministériel. Frais de relogement d'urgence pris en charge.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim."},{"id":"ref-l125-2","type":"article_loi","code":"Code des assurances","numero":"L.125-2","intitule":"Catastrophes naturelles — délais d'indemnisation","resume":"À compter de la déclaration (ou de la publication de l'arrêté si postérieure) : 1 mois pour informer l'assuré des modalités et ordonner une expertise ; 1 mois après réception de l'état estimatif ou du rapport d'expertise définitif pour faire une proposition ; après accord de l'assuré, 1 mois pour missionner l'entreprise ou 21 jours pour verser — sinon intérêt légal. Franchise définie par décret.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14)."},{"id":"ref-l242-1","type":"article_loi","code":"Code des assurances","numero":"L.242-1","intitule":"Assurance dommages-ouvrage","resume":"Assurance obligatoire du maître d'ouvrage préfinançant les réparations de nature décennale, avec délais de réponse encadrés de l'assureur (non détaillés ici).","source_url":null,"statut":"NV","date_verification":null,"note":"Cité par le lexique du dossier. Délais précis non repris : à contrôler sur Légifrance avant usage."},{"id":"ref-l133-1-ccom","type":"article_loi","code":"Code de commerce","numero":"L.133-1","intitule":"Responsabilité du voiturier","resume":"Le voiturier est garant de la perte des objets à transporter (hors force majeure) et des avaries (hors vice propre et force majeure). Toute clause contraire dans la lettre de voiture est nulle.","source_url":"https://codes.droit.org/PDF/Code%20de%20commerce.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA)."},{"id":"ref-l133-3-ccom","type":"article_loi","code":"Code de commerce","numero":"L.133-3","intitule":"Fin de non-recevoir — protestation motivée","resume":"La réception des objets transportés éteint toute action contre le voiturier pour avarie ou perte partielle si, dans les 3 jours (jours fériés non compris) suivant la réception, le destinataire n'a pas notifié sa protestation motivée par acte extrajudiciaire ou lettre recommandée. Une demande d'expertise (L.133-4) dans le délai vaut protestation. Stipulations contraires nulles — règle non applicable aux transports internationaux.","source_url":"https://codes.droit.org/PDF/Code%20de%20commerce.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim. Base de l'échéancier des délais (transport intérieur)."},{"id":"ref-l133-6-ccom","type":"article_loi","code":"Code de commerce","numero":"L.133-6","intitule":"Prescription annale (transport)","resume":"Les actions pour avaries, pertes ou retards contre le voiturier sont prescrites par 1 an (sauf fraude ou infidélité), comptée de la livraison (ou du jour où elle aurait dû avoir lieu en cas de perte totale). Action récursoire : 1 mois à compter de l'action contre le garanti.","source_url":"https://codes.droit.org/PDF/Code%20de%20commerce.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim."},{"id":"ref-contrat-type-general","type":"article_loi","code":"Code des transports","numero":"Annexe II (art. D.3222-1), art. 21-22","intitule":"Contrat type général — plafonds d'indemnisation","resume":"Contrat type applicable à défaut de contrat type spécifique ou de convention écrite. Art. 22 : hors dol et faute inexcusable, indemnité plafonnée à : envois < 3 t → 33 €/kg de poids brut manquant ou avarié, sans dépasser 1 000 € par colis ; envois ≥ 3 t → 20 €/kg, sans dépasser 3 200 € × tonnage de l'envoi. La déclaration de valeur substitue son montant au plafond. Art. 21 : présomption de perte 30 jours après l'expiration du délai de livraison.","source_url":"https://codes.droit.org/PDF/Code%20des%20transports.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (annexe II, édition DILA). Légifrance : LEGIARTI000043864485. Base du calculateur plafonds transport (national)."},{"id":"ref-cmr","type":"convention","code":"CMR (Genève, 1956 + protocole DTS 1978)","numero":"art. 23, 29, 30, 32","intitule":"Transport international routier — limitation et délais","resume":"Art. 23 : indemnité pour perte limitée à 8,33 unités de compte (DTS) par kg de poids brut manquant. Art. 29 : la limitation saute en cas de dol ou faute équivalente. Art. 30 : réserves à la livraison (avaries apparentes), sous 7 jours pour les avaries non apparentes, et réserve écrite sous 21 jours pour le retard. Art. 32 : prescription 1 an, 3 ans en cas de dol.","source_url":null,"statut":"NV","date_verification":null,"note":"Le taux de 8,33 DTS/kg (art. 23) est vérifié par le dossier et des sources concordantes — c'est le détail des délais des art. 30 et 32 qui reste à contrôler sur le texte officiel (unece.org ou fedlex.admin.ch RS 0.741.611), inaccessibles depuis cet environnement (accès automatisés bloqués)."},{"id":"ref-montreal","type":"convention","code":"Convention de Montréal (1999)","numero":"art. 22(3)","intitule":"Transport aérien — limite fret","resume":"Limite de responsabilité fret : 26 DTS par kg depuis le 28 décembre 2024 (révision quinquennale OACI de 2024, facteur d'inflation 17,9 % ; 22 DTS/kg de 2019 à 2024). La limite applicable est celle en vigueur à la date de l'événement.","source_url":"https://www.icao.int/news/international-air-travel-liability-limits-set-increase-enhancing-customer-compensation-0","statut":"V","date_verification":"2026-11-10","note":"Concordant : OACI, Office des transports du Canada, gazette de Hong Kong, memo IATA PSC/2024-10/112. Bagages : 1 519 DTS/passager."},{"id":"ref-hague-visby","type":"convention","code":"Règles de La Haye-Visby (Bruxelles 1924, prot. 1968 et 1979)","numero":"art. IV(5)(a)","intitule":"Transport maritime — limitation","resume":"Limitation : 666,67 unités de compte (DTS) par colis ou unité, ou 2 DTS par kg de poids brut des marchandises perdues ou endommagées, la plus élevée des deux étant applicable. L'énumération des colis au connaissement (art. IV(5)(c)) peut fixer le décompte pour les conteneurs.","source_url":"https://admiraltylawguide.com/conven/sdrprotocol1979.html","statut":"V","date_verification":"2026-11-10","note":"Texte du protocole DTS de 1979 + jurisprudence anglaise concordante (Kyokuyo v Maersk)."},{"id":"ref-york-anvers","type":"convention","code":"Règles d'York et d'Anvers","numero":null,"intitule":"Avarie commune","resume":"Règles contractuelles types régissant la contribution d'avarie commune en transport maritime (sacrifices et dépenses faits pour le salut commun répartis entre navire, fret et cargaison).","source_url":null,"statut":"V","date_verification":null,"note":"Citées par le lexique du dossier."},{"id":"ref-cpc-145","type":"article_loi","code":"Code de procédure civile","numero":"art. 145","intitule":"Référé probatoire (référé-expertise)","resume":"S'il existe un motif légitime de conserver ou d'établir avant tout procès la preuve de faits dont pourrait dépendre la solution d'un litige, des mesures d'instruction (expertise judiciaire) peuvent être ordonnées à la demande de tout intéressé.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le lexique du dossier (expertise contradictoire / référé-expertise). Résumé reformulé."},{"id":"ref-cciv-1245","type":"article_loi","code":"Code civil","numero":"art. 1245 et s.","intitule":"Responsabilité du fait des produits défectueux","resume":"Le producteur est responsable du dommage causé par un défaut de son produit. Fondement de recours typique contre le fabricant d'un équipement à l'origine d'un sinistre.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le dossier (cas 1, recours)."},{"id":"ref-cciv-1246","type":"article_loi","code":"Code civil","numero":"art. 1246 et s.","intitule":"Préjudice écologique","resume":"Toute personne responsable d'un préjudice écologique est tenue de le réparer ; réparation par priorité en nature.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le lexique du dossier (LRE / préjudice écologique)."},{"id":"ref-cciv-1792","type":"article_loi","code":"Code civil","numero":"art. 1792","intitule":"Responsabilité décennale","resume":"Responsabilité de plein droit du constructeur, pendant 10 ans, pour les dommages compromettant la solidité de l'ouvrage ou le rendant impropre à sa destination.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le lexique du dossier."},{"id":"ref-cenv-l160-1","type":"article_loi","code":"Code de l'environnement","numero":"L.160-1 et s.","intitule":"Responsabilité environnementale (LRE)","resume":"Régime de prévention et de réparation des dommages causés à l'environnement (transposition de la directive 2004/35/CE) : réparation primaire, complémentaire et compensatoire.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le dossier (cas 2 : LRE — réparation primaire, complémentaire, compensatoire)."},{"id":"ref-badinter","type":"article_loi","code":"Loi n° 85-677 du 5 juillet 1985 (Badinter)","numero":null,"intitule":"Indemnisation des victimes d'accidents de la circulation","resume":"Régime spécial d'indemnisation des victimes d'accidents de la circulation impliquant un véhicule terrestre à moteur ; articulation avec les dommages causés par la marchandise transportée à vérifier au cas par cas.","source_url":null,"statut":"NV","date_verification":null,"note":"Le dossier (cas 2) note : « RC automobile (loi de 1985 ; articulation avec la marchandise à vérifier) »."},{"id":"ref-adr-1-4","type":"convention","code":"ADR","numero":"chap. 1.4","intitule":"Obligations de sécurité des intervenants","resume":"Répartition des obligations entre expéditeur, transporteur, destinataire, chargeur, emballeur, remplisseur, exploitant de citerne, déchargeur. Grille d'analyse des responsabilités dans un sinistre TMD.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le dossier (lexique, cas 2, auto-évaluation Q13)."},{"id":"ref-adr-1-8-3","type":"convention","code":"ADR","numero":"chap. 1.8.3","intitule":"Conseiller à la sécurité — rapport d'accident","resume":"Obligation de désigner un conseiller à la sécurité ; rédaction d'un rapport d'accident après tout événement grave (1.8.3.6).","source_url":null,"statut":"NV","date_verification":null,"note":"Le dossier marque la référence 1.8.3 d'un (?) : numéro de sous-section à confirmer sur l'ADR en vigueur (unece.org)."},{"id":"ref-nfpa-921","type":"norme","code":"NFPA 921","numero":null,"intitule":"Guide for Fire and Explosion Investigations","resume":"Guide méthodologique de l'investigation incendie/explosion : méthode scientifique, zone d'origine, figures de feu, arc mapping, hypothèses de cause, traçabilité des preuves (chain of custody). Texte non reproduit (droit d'auteur) : lire des résumés et se référer à l'éditeur.","source_url":"https://www.nfpa.org/","statut":"V","date_verification":null,"note":"Référence citée par le dossier (sprint semaine 2, questions de fond)."},{"id":"ref-nfpa13-25","type":"norme","code":"NFPA 13 / NFPA 25","numero":null,"intitule":"Sprinklers — installation / inspection, test et maintenance","resume":"NFPA 13 : conception et installation des systèmes sprinklers. NFPA 25 : inspection, essais et maintenance (dont gestion des mises hors service). Texte non reproduit : référence et lien éditeur.","source_url":"https://www.nfpa.org/","statut":"V","date_verification":null,"note":"Citées par le lexique du dossier."},{"id":"ref-apsad-r1","type":"referentiel","code":"APSAD R1","numero":null,"intitule":"Règle d'installation — extinction automatique à eau (sprinklers)","resume":"Référentiel CNPP/assureurs français pour la conception, l'installation et la maintenance des installations sprinklers certifiées. Texte non reproduit : référence et lien CNPP.","source_url":"https://www.cnpp.com/","statut":"V","date_verification":null,"note":"Citée par le lexique du dossier."},{"id":"ref-fm-datasheets","type":"referentiel","code":"FM Global Property Loss Prevention Data Sheets","numero":null,"intitule":"Référentiel d'ingénierie prévention FM","resume":"Fiches techniques d'ingénierie de prévention incendie et dommages (stockages, sprinklers, lithium-ion, ATEX…) publiées par FM ; consultables gratuitement sur inscription. Texte non reproduit.","source_url":"https://www.fmglobal.com/research-and-resources/fm-global-data-sheets","statut":"V","date_verification":null,"note":"Citées par le dossier (sprint semaine 3, parade risk engineering)."},{"id":"ref-nfx31-620","type":"norme","code":"NF X31-620","numero":null,"intitule":"Sites et sols pollués — prestations de services","resume":"Norme française encadrant les prestations dans le domaine des sites et sols pollués (études, ingénierie, travaux), associée à la méthodologie nationale. Texte non reproduit.","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le dossier (fact-check n°26, parade DD EHS)."},{"id":"ref-astm-e1527","type":"norme","code":"ASTM E1527-21","numero":null,"intitule":"Phase I Environmental Site Assessment","resume":"Standard américain de l'audit environnemental de site Phase I (REC/CREC/HREC). Version E1527-21 : la version en vigueur reste à vérifier auprès de l'éditeur. Texte non reproduit.","source_url":"https://www.astm.org/","statut":"NV","date_verification":null,"note":"Le dossier (fact-check n°26) note « E1527-21 (à vérifier) »."},{"id":"ref-iso-17024","type":"norme","code":"ISO/IEC 17024","numero":null,"intitule":"Certification de personnes","resume":"Norme d'accréditation des organismes certifiant des personnes — cadre de l'EEA du CNPP (certification d'expert, valable 6 ans, spécialité Transport de marchandises incluse).","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le dossier (fact-check n°6)."},{"id":"ref-atex-2014-34","type":"directive","code":"Directive 2014/34/UE","numero":null,"intitule":"ATEX — matériels","resume":"Exigences applicables aux appareils et systèmes de protection destinés aux atmosphères explosibles.","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le lexique du dossier et l'auto-évaluation (Q20)."},{"id":"ref-atex-1999-92","type":"directive","code":"Directive 1999/92/CE","numero":null,"intitule":"ATEX — travailleurs","resume":"Prescriptions minimales de protection des travailleurs exposés aux atmosphères explosibles (zonage, DRPCE).","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le lexique du dossier (Q21)."},{"id":"ref-seveso","type":"directive","code":"Directive 2012/18/UE (Seveso III)","numero":null,"intitule":"Maîtrise des dangers liés aux accidents majeurs","resume":"Régime des établissements à risques d'accidents majeurs impliquant des substances dangereuses (seuil bas / seuil haut).","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le lexique du dossier (Q23)."},{"id":"ref-csrd-omnibus","type":"directive","code":"Directive (UE) 2026/470 « Omnibus I »","numero":null,"intitule":"Réduction du périmètre CSRD","resume":"Adoptée le 24 février 2026, publiée au JOUE le 26 février 2026, en vigueur depuis le 18 mars 2026. Transposition du volet CSRD au plus tard le 19 mars 2027. Seuils cumulatifs : plus de 1 000 salariés ET plus de 450 M€ de CA. Recentre l'ESG sur les risques matériels.","source_url":null,"statut":"V","date_verification":null,"note":"Fact-check n°28 du dossier (sources bematerial/leto citées)."},{"id":"ref-icpe-1510","type":"rubrique_icpe","code":"Nomenclature ICPE","numero":"1510","intitule":"Entrepôts couverts","resume":"Rubrique des entrepôts couverts stockant des matières combustibles (régimes A/E/D selon volume et quantités).","source_url":"https://aida.ineris.fr/","statut":"V","date_verification":null,"note":"Citée par le dossier (lexique, auto-évaluation Q22, cas 4)."},{"id":"ref-icpe-2921","type":"rubrique_icpe","code":"Nomenclature ICPE","numero":"2921","intitule":"Tours aéroréfrigérantes","resume":"Rubrique des installations de refroidissement évaporatif par dispersion d'eau dans un flux d'air (risque légionelles).","source_url":"https://aida.ineris.fr/","statut":"V","date_verification":null,"note":"Citée par le lexique du dossier."},{"id":"ref-icpe-47xx","type":"rubrique_icpe","code":"Nomenclature ICPE","numero":"47xx","intitule":"Rubriques 4xxx — substances dangereuses","resume":"Famille de rubriques « substances » (séries 4000) issues de la transposition Seveso III ; le dossier cite la série 47xx (ex. produits pétroliers et assimilés).","source_url":"https://aida.ineris.fr/","statut":"NV","date_verification":null,"note":"Notation « 47xx » reprise telle quelle du dossier : préciser la rubrique exacte selon le produit."},{"id":"ref-opam","type":"texte_suisse","code":"OPAM","numero":null,"intitule":"Ordonnance sur la protection contre les accidents majeurs (CH)","resume":"Couvre entreprises, voies de communication et conduites. Démarche graduée : rapport succinct, puis étude de risque (courbe F-N) si nécessaire.","source_url":"https://www.fedlex.admin.ch/","statut":"V","date_verification":null,"note":"Fact-check n°19 et Partie 2/3 du dossier. Numéro RS à relever sur Fedlex (accès au texte bloqué pour les robots depuis cet environnement)."},{"id":"ref-osites","type":"texte_suisse","code":"OSites","numero":null,"intitule":"Ordonnance sur l'assainissement des sites pollués (CH)","resume":"Régit le cadastre des sites pollués et la démarche : investigation historique, puis technique, puis surveillance ou assainissement.","source_url":"https://www.fedlex.admin.ch/","statut":"V","date_verification":null,"note":"Citée par le dossier (Partie 2.5, cas 7)."},{"id":"ref-sdr-ocs","type":"texte_suisse","code":"SDR / OCS","numero":null,"intitule":"Transport de marchandises dangereuses par route (CH) / conseillers à la sécurité","resume":"La SDR rend l'ADR applicable au trafic national suisse ; l'OFROU délivre les autorisations pour les tunnels. L'OCS impose un conseiller à la sécurité pour le transport, l'emballage, le remplissage, l'expédition, le chargement et le déchargement.","source_url":"https://www.fedlex.admin.ch/","statut":"V","date_verification":null,"note":"Fact-check n°19 + Partie 2.5 (auto-évaluation Q33)."},{"id":"ref-lca","type":"texte_suisse","code":"LCA","numero":null,"intitule":"Loi sur le contrat d'assurance (CH), révisée au 1er janvier 2022","resume":"Révision en vigueur depuis le 1er janvier 2022 : notamment prescription de 5 ans et action directe en RC. Articles précis à vérifier.","source_url":"https://www.fedlex.admin.ch/","statut":"NV","date_verification":null,"note":"Le dossier note « articles à vérifier ». RS 221.229.1 à confirmer sur Fedlex."},{"id":"ref-co-ch","type":"texte_suisse","code":"Code des obligations (CH)","numero":"art. 41/55/58/97 ; 335b ; 340 et s.","intitule":"Responsabilité civile, période d'essai, non-concurrence","resume":"Art. 41 (acte illicite), 55 (employeur), 58 (propriétaire d'ouvrage), 97 (inexécution). Art. 335b : période d'essai 1 mois par défaut, 3 mois au maximum. Art. 340 et s. : clause de non-concurrence, 3 ans au maximum.","source_url":"https://www.fedlex.admin.ch/","statut":"V","date_verification":null,"note":"Cités par le dossier (Partie 3 et 7.4). CC 679/684 (immissions) : à vérifier (dossier cas 6)."},{"id":"ref-sia-118","type":"norme","code":"SIA 118","numero":null,"intitule":"Conditions générales pour l'exécution des travaux de construction (CH)","resume":"Norme contractuelle suisse de référence dans la construction (garanties, réception, avis des défauts). Texte non reproduit.","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le dossier (lexique, cas 6)."},{"id":"ref-aeai","type":"referentiel","code":"Prescriptions AEAI (PPI)","numero":null,"intitule":"Prescriptions de protection incendie (CH)","resume":"PPI 2015 en vigueur, partiellement révisées au 1er avril 2026 ; les « PPI 2026 » entreront en vigueur à l'automne 2027 (AEAI/AIET) après plus de 11 000 commentaires et l'incendie de Crans-Montana. Texte non reproduit.","source_url":"https://www.bsvonline.ch/","statut":"V","date_verification":null,"note":"Fact-check n°21 et auto-évaluation Q35 du dossier."},{"id":"ref-cfst-6508","type":"referentiel","code":"Directive CFST 6508","numero":null,"intitule":"Appel aux médecins du travail et spécialistes MSST (CH)","resume":"Directive suisse sur le recours aux spécialistes de la sécurité au travail (MSST), cadre de la prévention en entreprise avec la LAA/OPA et la Suva.","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le lexique du dossier."},{"id":"ref-decret-86-83","type":"article_loi","code":"Décret n° 86-83 du 17 janvier 1986","numero":"art. 48","intitule":"Préavis de démission des agents contractuels de l'État","resume":"Préavis de démission selon l'ancienneté — 1 mois entre 6 mois et 2 ans d'ancienneté (à confirmer sur le texte).","source_url":null,"statut":"NV","date_verification":null,"note":"Le dossier (7.4) note « à vérifier ». Contrôler sur Légifrance avant de poser sa démission."}]},"calculs":{"_table":"calculs","_source":"Formules : Code des assurances / contrat type / conventions (voir references) + dossier_reconversion.pdf (fiches réflexes, cas pratiques). Les vecteurs de test sont la source unique de vérité partagée par l'app, le classeur Excel et tests/.","items":[{"id":"calc-rp-capitaux","titre":"Règle proportionnelle de capitaux (L.121-5)","formule":"Indemnité = Dommage × (Capitaux déclarés / Valeur réelle au jour du sinistre), plafonnée au dommage","hypotheses":["Applicable sauf convention contraire (clause premier risque, clause de tolérance).","La valeur réelle s'apprécie au jour du sinistre.","Si capitaux déclarés ≥ valeur réelle : pas de réduction (coefficient plafonné à 1)."],"base_juridique":["ref-l121-5","ref-l121-1"],"parametres":[{"nom":"dommage","label":"Montant du dommage (€)","type":"montant"},{"nom":"declare","label":"Capitaux déclarés (€)","type":"montant"},{"nom":"reel","label":"Valeur réelle au jour du sinistre (€)","type":"montant"}],"vecteurs_test":[{"nom":"acceptation-mission","entrees":{"dommage":200000,"declare":800000,"reel":1000000},"attendu":{"indemnite":160000}},{"nom":"cas1-dossier-materiel","entrees":{"dommage":1000000,"declare":2000000,"reel":2500000},"attendu":{"indemnite":800000},"note":"Cas 1 du dossier : RP de 80 % → 800 k€ sur le matériel, avant franchise et vétusté"},{"nom":"sur-assurance","entrees":{"dommage":100000,"declare":1200000,"reel":1000000},"attendu":{"indemnite":100000},"note":"Coefficient plafonné à 1 (principe indemnitaire L.121-1)"}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Texte de L.121-5 contrôlé verbatim le 2026-11-10 (édition DILA)."},{"id":"calc-rp-prime","titre":"Règle proportionnelle de prime (L.113-9)","formule":"Indemnité = Dommage × (Taux de prime payé / Taux de prime dû si le risque avait été exactement déclaré)","hypotheses":["Suppose une omission ou déclaration inexacte SANS mauvaise foi établie (sinon : nullité, L.113-8).","Constatée après sinistre. Avant sinistre : maintien avec surprime ou résiliation à 10 jours.","Le rapport s'applique aux taux de prime ; à assiette constante, le rapport des primes donne le même résultat.","La réduction ne peut pas réduire l'indemnité à néant (jurisprudence)."],"base_juridique":["ref-l113-9","ref-l113-8"],"parametres":[{"nom":"dommage","label":"Montant du dommage (€)","type":"montant"},{"nom":"prime_payee","label":"Prime (ou taux) payée","type":"montant"},{"nom":"prime_due","label":"Prime (ou taux) qui aurait été due","type":"montant"}],"vecteurs_test":[{"nom":"exemple-2-tiers","entrees":{"dommage":300000,"prime_payee":10000,"prime_due":15000},"attendu":{"indemnite":200000},"note":"Exemple pédagogique : prime payée = 2/3 de la prime due → indemnité réduite d'1/3"}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Texte de L.113-9 contrôlé verbatim le 2026-11-10 (édition DILA)."},{"id":"calc-chaine-indemnite","titre":"Chaîne d'indemnisation : valeur à neuf → vétusté → règle proportionnelle → franchise → plafond → indemnité différée","formule":"Vétusté = Dommage(VàN) × taux de vétusté ; Dommage(VD) = Dommage(VàN) − Vétusté ; coeff RP = min(1, déclaré/réel) ; Immédiat = min(Dommage(VD) × coeff RP − franchise ; plafond éventuel) ; Différé (rachat de vétusté) = min(Vétusté ; taux max de rachat × Dommage(VD)) × coeff RP","hypotheses":["Hypothèse d'ordre : la franchise est déduite après la règle proportionnelle, sur l'indemnité immédiate. L'ORDRE RÉEL DÉPEND DE LA POLICE — le dossier note explicitement : « À vérifier : l'ordre d'application de la franchise prévu par la police ».","Le rachat de vétusté (indemnité différée) est versé sur justification de la reconstruction/remplacement, dans la limite d'un pourcentage de la valeur vétusté déduite (ici 25 % par défaut, clause type « valeur à neuf dans la limite de 125 % de la VD »).","La règle proportionnelle s'applique aussi à la part différée.","La franchise ne s'applique qu'une fois, sur la part immédiate."],"base_juridique":["ref-l121-5","ref-l121-1","ref-l121-17"],"parametres":[{"nom":"dommage_van","label":"Dommage en valeur à neuf (€)","type":"montant"},{"nom":"taux_vetuste","label":"Taux de vétusté","type":"taux"},{"nom":"declare","label":"Capitaux déclarés (€)","type":"montant"},{"nom":"reel","label":"Valeur à neuf réelle (€)","type":"montant"},{"nom":"franchise","label":"Franchise (€)","type":"montant"},{"nom":"plafond","label":"Plafond / LCI (€, optionnel)","type":"montant","optionnel":true},{"nom":"taux_rachat_max","label":"Rachat de vétusté plafonné à (en % de la VD)","type":"taux","defaut":0.25}],"vecteurs_test":[{"nom":"acceptation-mission-batiment","entrees":{"dommage_van":900000,"taux_vetuste":0.2,"declare":3000000,"reel":3600000,"franchise":10000,"plafond":null,"taux_rachat_max":0.25},"attendu":{"immediat":590000,"differe":150000},"note":"Exercice de chiffrage du dossier (Partie 5) : RP 3/3,6 = 83,33 % ; 720 k€ × 83,33 % − 10 k€ = 590 k€ ; différé : vétusté 180 k€ (= plafond 25 % × 720 k€) × 83,33 % = 150 k€"}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Bases L.121-5/L.121-1 vérifiées. Le plafonnement du rachat de vétusté à 25 % est une clause de marché (fictif/contractuel, pas une règle légale)."},{"id":"calc-pe","titre":"Perte d'exploitation","formule":"Marge brute assurée = CA − charges variables ; Taux de marge brute = marge brute / CA ; Perte = Taux de marge brute × Baisse de CA + Frais supplémentaires retenus − Économies de charges","hypotheses":["La marge brute ASSURÉE (CA − charges variables) diffère de la marge comptable — confusion éliminatoire en entretien.","Les frais supplémentaires ne sont indemnisables que s'ils ont évité une perte de marge au moins équivalente (sinon écrêtés).","Période d'indemnisation et franchise-carence selon la police (non modélisées ici).","La baisse de CA s'apprécie par rapport au CA de référence attendu sans sinistre."],"base_juridique":["ref-l121-1"],"parametres":[{"nom":"baisse_ca","label":"Baisse de chiffre d'affaires (€)","type":"montant"},{"nom":"taux_marge","label":"Taux de marge brute assurée","type":"taux"},{"nom":"frais_supp","label":"Frais supplémentaires engagés (€)","type":"montant","defaut":0},{"nom":"perte_evitee","label":"Perte de marge évitée par ces frais (€)","type":"montant","defaut":0},{"nom":"economies","label":"Économies de charges (€)","type":"montant","defaut":0}],"vecteurs_test":[{"nom":"cas1-dossier-sans-frais","entrees":{"baisse_ca":1200000,"taux_marge":0.6,"frais_supp":0,"perte_evitee":0,"economies":30000},"attendu":{"perte":690000},"note":"Cas 1 : 60 % × 1,2 M€ − 30 k€ = 690 k€"},{"nom":"cas1-dossier-avec-frais","entrees":{"baisse_ca":1200000,"taux_marge":0.6,"frais_supp":90000,"perte_evitee":90000,"economies":30000},"attendu":{"perte":780000},"note":"Les 90 k€ de sous-traitance d'urgence sont indemnisables s'ils ont évité une perte au moins équivalente"},{"nom":"frais-ecretes","entrees":{"baisse_ca":1000000,"taux_marge":0.5,"frais_supp":120000,"perte_evitee":80000,"economies":0},"attendu":{"perte":580000},"note":"Frais supplémentaires écrêtés à la perte évitée (80 k€)"}],"statut":"V","source_url":null,"date_verification":null,"note":"Formule du dossier (fiche réflexe expert + Partie 3). Le scénario (a) du rapport_recherche.md (PE attendue 1 379 927 €) n'est pas reproductible : fichier non fourni — voir a_verifier."},{"id":"calc-plafonds-transport","titre":"Plafonds d'indemnisation transport (contrat type général, CMR, Montréal, La Haye-Visby)","formule":"Contrat type général : envois < 3 t → min(33 € × kg ; 1 000 € × colis) ; envois ≥ 3 t → min(20 € × kg ; 3 200 € × tonnage). CMR : 8,33 DTS × kg. Montréal : 26 DTS × kg (22 DTS avant le 28/12/2024). La Haye-Visby : max(666,67 DTS × colis ; 2 DTS × kg). Conversion : montant DTS × cours du DTS saisi à la main","hypotheses":["Le cours du DTS (droit de tirage spécial, FMI) est SAISI MANUELLEMENT — aucune récupération réseau. Source : FMI ou Banque de France du jour.","Plafonds hors dol / faute inexcusable (CMR art. 29 ; contrat type art. 22.1) et hors déclaration de valeur ou intérêt spécial à la livraison.","Montréal : la limite applicable est celle en vigueur à la date de l'événement (26 DTS/kg depuis le 28/12/2024).","La Haye-Visby : le décompte des colis d'un conteneur suit l'énumération au connaissement (art. IV(5)(c))."],"base_juridique":["ref-contrat-type-general","ref-cmr","ref-montreal","ref-hague-visby"],"parametres":[{"nom":"regime","label":"Régime","type":"choix","options":["ctg_moins_3t","ctg_3t_et_plus","cmr","montreal","hague_visby"]},{"nom":"poids_kg","label":"Poids brut concerné (kg)","type":"montant"},{"nom":"nb_colis","label":"Nombre de colis","type":"entier","defaut":1},{"nom":"taux_montreal","label":"Taux Montréal (DTS/kg)","type":"montant","defaut":26},{"nom":"cours_dts","label":"Cours du DTS (€/DTS, saisi à la main)","type":"montant","optionnel":true}],"vecteurs_test":[{"nom":"acceptation-mission-cmr","entrees":{"regime":"cmr","poids_kg":8000,"nb_colis":1},"attendu":{"plafond_dts":66640},"note":"8 000 kg × 8,33 = 66 640 DTS"},{"nom":"ctg-petit-envoi","entrees":{"regime":"ctg_moins_3t","poids_kg":400,"nb_colis":10},"attendu":{"plafond_eur":10000},"note":"min(33 × 400 = 13 200 ; 1 000 × 10 = 10 000) = 10 000 €"},{"nom":"ctg-gros-envoi","entrees":{"regime":"ctg_3t_et_plus","poids_kg":8000,"nb_colis":1},"attendu":{"plafond_eur":25600},"note":"min(20 × 8 000 = 160 000 ; 3 200 × 8 = 25 600) = 25 600 €"},{"nom":"hague-visby-max","entrees":{"regime":"hague_visby","poids_kg":5000,"nb_colis":4},"attendu":{"plafond_dts":10000},"note":"max(666,67 × 4 = 2 666,68 ; 2 × 5 000 = 10 000) = 10 000 DTS"},{"nom":"montreal-actuel","entrees":{"regime":"montreal","poids_kg":1000,"nb_colis":1,"taux_montreal":26},"attendu":{"plafond_dts":26000}}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Contrat type et limites Montréal/La Haye-Visby vérifiés le 2026-11-10 (voir references). CMR 8,33 : dossier + sources concordantes."},{"id":"calc-echeancier","titre":"Échéancier des délais (assurance et transport)","formule":"À partir des dates saisies (sinistre, déclaration, livraison, accord d'indemnisation), calcule les échéances : déclaration (L.113-2), réponse assureur (L.121-18), CatNat (L.125-2), protestation (L.133-3), réserves CMR (art. 30), prescriptions (L.114-1, L.133-6, CMR art. 32), présomption de perte (contrat type art. 21)","hypotheses":["« Jours ouvrés » (L.113-2) : lundi-vendredi hors jours fériés français saisis à la main (aucune table de fériés embarquée ne fait foi).","L.133-3 : 3 jours NON COMPRIS les jours fériés, à compter du lendemain de la réception.","L.121-18 : délais applicables sauf contrats exclus par décret en Conseil d'État (décret à surveiller).","CMR art. 30/32 : délais usuels affichés mais base NV (texte à contrôler) — badge affiché.","Les délais conventionnels plus favorables priment (L.125-2 in fine)."],"base_juridique":["ref-l113-2","ref-l121-18","ref-l125-2","ref-l133-3-ccom","ref-l133-6-ccom","ref-l114-1","ref-cmr","ref-contrat-type-general"],"parametres":[{"nom":"date_sinistre","label":"Date du sinistre / de sa connaissance","type":"date"},{"nom":"date_declaration","label":"Date de déclaration à l'assureur","type":"date","optionnel":true},{"nom":"date_livraison","label":"Date de livraison (transport)","type":"date","optionnel":true},{"nom":"date_accord","label":"Date d'accord sur la proposition","type":"date","optionnel":true},{"nom":"contexte","label":"Contexte","type":"choix_multiple","options":["assurance_dommages","vol","catnat","transport_interieur","transport_cmr","expert_designe"]}],"delais":[{"id":"d-declaration","label":"Déclaration du sinistre","base":"ref-l113-2","regle":"5 jours ouvrés (2 jours ouvrés en cas de vol, 24 h mortalité bétail) — minimum légal, le contrat peut prévoir plus","depuis":"date_sinistre"},{"id":"d-aggravation","label":"Déclaration de circonstances nouvelles","base":"ref-l113-2","regle":"15 jours à partir de la connaissance","depuis":"date_sinistre"},{"id":"d-reponse-sans-expert","label":"Proposition ou refus motivé de l'assureur (sans expert)","base":"ref-l121-18","regle":"2 mois depuis la déclaration","depuis":"date_declaration"},{"id":"d-reponse-avec-expert","label":"Proposition, refus motivé ou acompte (expert désigné)","base":"ref-l121-18","regle":"6 mois depuis la déclaration","depuis":"date_declaration"},{"id":"d-paiement","label":"Versement (ou missionnement de l'entreprise) après accord","base":"ref-l121-18","regle":"21 jours pour verser / 1 mois pour missionner, sinon intérêt légal","depuis":"date_accord"},{"id":"d-catnat-info","label":"CatNat : information de l'assuré et expertise","base":"ref-l125-2","regle":"1 mois depuis déclaration ou publication de l'arrêté","depuis":"date_declaration"},{"id":"d-protestation","label":"Protestation motivée au voiturier (France)","base":"ref-l133-3-ccom","regle":"3 jours, jours fériés non compris, après la réception","depuis":"date_livraison"},{"id":"d-cmr-apparent","label":"CMR : réserves avaries apparentes","base":"ref-cmr","regle":"au plus tard à la livraison","depuis":"date_livraison"},{"id":"d-cmr-non-apparent","label":"CMR : réserves avaries non apparentes","base":"ref-cmr","regle":"7 jours (dimanches et fériés non compris)","depuis":"date_livraison"},{"id":"d-cmr-retard","label":"CMR : réserve écrite pour retard","base":"ref-cmr","regle":"21 jours après la mise à disposition","depuis":"date_livraison"},{"id":"d-presomption-perte","label":"Présomption de perte (contrat type)","base":"ref-contrat-type-general","regle":"30 jours après l'expiration du délai de livraison","depuis":"date_livraison"},{"id":"d-prescription-transport","label":"Prescription des actions transport (France)","base":"ref-l133-6-ccom","regle":"1 an depuis la livraison (ou la date prévue en cas de perte totale)","depuis":"date_livraison"},{"id":"d-cmr-prescription","label":"CMR : prescription","base":"ref-cmr","regle":"1 an (3 ans en cas de dol)","depuis":"date_livraison"},{"id":"d-prescription-assurance","label":"Prescription biennale assurance","base":"ref-l114-1","regle":"2 ans depuis l'événement (5 ans sécheresse-réhydratation CatNat)","depuis":"date_sinistre"}],"parametres_vides":true,"vecteurs_test":[{"nom":"delais-statiques","entrees":{"date_sinistre":"2027-01-04","date_declaration":"2027-01-05","date_livraison":"2027-01-04","date_accord":"2027-06-01","contexte":["assurance_dommages","transport_interieur"]},"attendu":{"d-prescription-assurance":"2029-01-04","d-prescription-transport":"2028-01-04","d-reponse-sans-expert":"2027-03-05","d-paiement":"2027-06-22"},"note":"Contrôles simples : +2 ans, +1 an, +2 mois, +21 jours"}],"statut":"V","source_url":null,"date_verification":"2026-11-10","note":"Bases françaises vérifiées verbatim le 2026-11-10. Lignes CMR : NV (voir ref-cmr)."}]},"etapes_methode":{"_table":"etapes_methode","_source":"Structure : trame du classeur méthode (mission) + démarche des cas pratiques et fiches réflexes du dossier (Partie 2.2, Partie 5). Le rapport_recherche.md (bloc « portfolio et méthode ») n'ayant pas été fourni, cette liste de 12 étapes est une synthèse dossier + mission, à rapprocher de l'original quand il sera disponible.","items":[{"id":"et-01","ordre":1,"titre":"Prise de mission","objectif":"Cadrer le mandat avant tout acte","actions":["Lire la lettre de mission : qui mandate, pour quoi, quel périmètre","Vérifier l'absence de conflit d'intérêts","Identifier la police concernée et les intervenants connus","Noter les délais qui courent déjà (déclaration, protestation, prescription)"],"pieges":["Commencer les constatations sans mandat clair"],"pieceIds":["pc-police","pc-lettre-mission"],"referenceIds":["ref-l113-2"],"calculIds":["calc-echeancier"],"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"et-02","ordre":2,"titre":"Mesures conservatoires","objectif":"Limiter l'aggravation du dommage et préserver la preuve","actions":["Faire bâcher, mettre hors d'eau / hors d'air","Rétention des eaux d'extinction, traitement anticorrosion des machines","Sécuriser la zone (risque de ré-inflammation pour le lithium)","Poser les scellés : photos, étiquetage, numérotation, stockage sécurisé, procès-verbal contradictoire"],"pieges":["Laisser démonter ou déblayer avant convocation des parties","Ouvrir un scellé hors présence des parties"],"pieceIds":["pc-photos","pc-pv-scelles"],"referenceIds":["ref-nfpa-921"],"calculIds":[],"statut":"V","source_url":null,"date_verification":null,"note":"Cas 1 et 3 du dossier ; questions de fond n°3 et 4"},{"id":"et-03","ordre":3,"titre":"Convocations contradictoires","objectif":"Rendre les constatations opposables","actions":["Convoquer PAR ÉCRIT, avec un délai raisonnable : l'assuré, le fabricant, le mainteneur ou l'installateur, et leurs assureurs RC","Inviter l'expert d'assuré s'il est mandaté","Consigner présences et absences","En cas de litige : proposer un sapiteur commun, ou passer par le référé-expertise (CPC art. 145)"],"pieges":["Tout démontage avant convocation ruine le recours (et la subrogation L.121-12)"],"pieceIds":["pc-convocations"],"referenceIds":["ref-cpc-145","ref-l121-12"],"calculIds":[],"statut":"V","source_url":null,"date_verification":null,"note":"Question de fond n°3 du dossier"},{"id":"et-04","ordre":4,"titre":"Chronologie des faits","objectif":"Établir le film de l'événement","actions":["Recueillir témoignages à chaud (sans induire les réponses)","Collecter journaux d'alarme, vidéosurveillance, BMS, relevés de télésurveillance","Reconstituer la chronologie : dernière ronde, détection, intervention SDIS, extinction","Noter les conditions (nuit/jour, météo, activité en cours)"],"pieges":["Confondre heure de détection et heure de départ de feu"],"pieceIds":["pc-journal-alarme","pc-rapport-sdis","pc-videosurveillance"],"referenceIds":["ref-nfpa-921"],"calculIds":[],"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"et-05","ordre":5,"titre":"Collecte des pièces","objectif":"Rassembler les justificatifs police, techniques et comptables","actions":["Demander la liste de pièces adaptée au sinistre (voir table Pièces)","Tracer chaque demande : date, relance, réception","Vérifier la cohérence des pièces entre elles (inventaire ↔ comptabilité)"],"pieges":["Accepter des pièces non datées ou invérifiables sans le noter"],"pieceIds":["pc-police","pc-comptabilite","pc-inventaire","pc-contrats-maintenance","pc-verifications-reglementaires"],"referenceIds":[],"calculIds":[],"statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"et-06","ordre":6,"titre":"Constatations et origine-cause","objectif":"Déterminer la zone d'origine puis la cause, méthodiquement","actions":["Délimiter la zone d'origine par les figures de feu et les témoignages","Arc mapping ; prélever les perles de fusion pour analyse en laboratoire","Formuler PLUSIEURS hypothèses de cause et les confronter aux faits (méthode NFPA 921)","Rechercher les indices d'acte volontaire : foyers multiples, accélérants (prélèvements, labo), effraction, contexte financier — documenter et proposer un sapiteur","Vérifier maintenance et permis de feu"],"pieges":["Affirmer une cause non démontrée (« la cause est électrique » reste une hypothèse tant que l'analyse n'est pas faite)","Employer des adjectifs émotionnels dans les notes"],"pieceIds":["pc-pv-scell
