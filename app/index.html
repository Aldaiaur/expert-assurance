<style>
/* Expert assurance — feuille de style (mobile d'abord, sombre, impression A4) */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5b6676;
  --line: #dde2ea; --accent: #1f5fbf; --accent-ink: #ffffff;
  --v: #15803d; --v-bg: #dcfce7; --nv: #b45309; --nv-bg: #fef3c7;
  --odg: #6d28d9; --odg-bg: #ede9fe; --fictif: #be123c; --fictif-bg: #ffe4e6;
  --radius: 10px;
}
html[data-theme="dark"] {
  --bg: #11151c; --panel: #1a202b; --ink: #e7ebf2; --muted: #9aa5b5;
  --line: #2a3342; --accent: #6ea8ff; --accent-ink: #0d1117;
  --v: #4ade80; --v-bg: #14321f; --nv: #fbbf24; --nv-bg: #3a2b0a;
  --odg: #c4b5fd; --odg-bg: #272040; --fictif: #fb7185; --fictif-bg: #3f1420;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.35rem; margin: .2rem 0 .6rem; }
h2 { font-size: 1.12rem; margin: 1.1rem 0 .4rem; }
h3 { font-size: 1rem; margin: .9rem 0 .3rem; }
p { margin: .4rem 0; }
small, .muted { color: var(--muted); }

header.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; gap: .5rem; align-items: center;
  background: var(--panel); border-bottom: 1px solid var(--line); padding: .55rem .8rem;
}
header.topbar .brand { font-weight: 700; white-space: nowrap; }
header.topbar input[type="search"] {
  flex: 1; min-width: 0; padding: .45rem .6rem; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--bg); color: var(--ink); font-size: .95rem;
}
button, .btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: var(--radius); padding: .45rem .7rem; font-size: .92rem; cursor: pointer;
}
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button:active { transform: translateY(1px); }

nav.tabs {
  display: flex; gap: .3rem; overflow-x: auto; padding: .45rem .6rem; scrollbar-width: none;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 3.1rem; z-index: 25;
}
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a {
  white-space: nowrap; padding: .35rem .7rem; border-radius: 999px; color: var(--ink);
  border: 1px solid transparent; font-size: .9rem;
}
nav.tabs a.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
nav.tabs a:hover { text-decoration: none; border-color: var(--line); }

main { padding: .8rem; max-width: 980px; margin: 0 auto; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .8rem .9rem; margin: .6rem 0;
}
.card h3 { margin-top: 0; }
.grid { display: grid; gap: .6rem; }
@media (min-width: 720px) { .grid.cols2 { grid-template-columns: 1fr 1fr; } }

.badge {
  display: inline-block; font-size: .72rem; font-weight: 700; padding: .08rem .45rem;
  border-radius: 999px; vertical-align: middle; letter-spacing: .02em;
}
.badge.V { color: var(--v); background: var(--v-bg); }
.badge.NV { color: var(--nv); background: var(--nv-bg); }
.badge.ordre_de_grandeur { color: var(--odg); background: var(--odg-bg); }
.badge.fictif { color: var(--fictif); background: var(--fictif-bg); }
.badge.theme { color: var(--muted); background: var(--bg); border: 1px solid var(--line); font-weight: 500; }

.bandeau-fictif {
  background: var(--fictif-bg); color: var(--fictif); border: 1px dashed var(--fictif);
  border-radius: var(--radius); padding: .4rem .7rem; font-weight: 700; margin: .5rem 0;
}

.filters { display: flex; flex-wrap: wrap; gap: .35rem; margin: .5rem 0; }
.filters .chip {
  border: 1px solid var(--line); border-radius: 999px; padding: .2rem .65rem;
  font-size: .85rem; cursor: pointer; background: var(--panel); color: var(--ink);
}
.filters .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

ul.clean { list-style: none; padding: 0; margin: .3rem 0; }
ul.clean li { padding: .3rem 0; border-bottom: 1px solid var(--line); }
ul.clean li:last-child { border-bottom: none; }

table.flat { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.flat th, table.flat td { text-align: left; padding: .35rem .45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
table.flat th { color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }

form.calc label { display: block; margin: .5rem 0 .15rem; font-size: .9rem; color: var(--muted); }
form.calc input, form.calc select {
  width: 100%; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--ink); font-size: 1rem;
}
.resultat {
  margin-top: .7rem; padding: .7rem; border-radius: var(--radius);
  background: var(--bg); border: 1px solid var(--line); font-size: 1.02rem;
}
.resultat strong.total { font-size: 1.25rem; }
.formule { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .6rem; overflow-x: auto; }

.checklist .etape { border-left: 3px solid var(--line); padding-left: .7rem; margin: .7rem 0; }
.checklist .etape.done { border-left-color: var(--v); opacity: .75; }
.checklist .etape h3 { display: flex; align-items: center; gap: .5rem; }
.checklist input[type="checkbox"] { width: 1.15rem; height: 1.15rem; }

.timer { font-size: 2.4rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.timer.warn { color: var(--nv); }
.timer.over { color: var(--fictif); }
.notation { display: flex; gap: .4rem; justify-content: center; margin: .6rem 0; }
.notation button { min-width: 2.6rem; }

.srs-answer { display: none; }
.srs-card.revealed .srs-answer { display: block; }
.srs-actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }

.kpi { display: flex; gap: .8rem; flex-wrap: wrap; }
.kpi .stat { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .8rem; min-width: 7rem; }
.kpi .stat b { font-size: 1.3rem; display: block; }

.toolbar { display: flex; gap: .4rem; flex-wrap: wrap; margin: .5rem 0; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); max-width: 95vw; }
.searchhit mark { background: var(--nv-bg); color: inherit; border-radius: 3px; }

footer.app { text-align: center; color: var(--muted); font-size: .8rem; padding: 1rem; }

.diagramme { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; padding: .4rem; margin: .5rem 0; }
.diagramme svg { display: block; min-width: 820px; height: auto; }
table.acteurs td { min-width: 9rem; font-size: .85rem; }
.boucle { border-left: 3px solid var(--line); padding-left: .7rem; margin: .8rem 0; }
details > summary { cursor: pointer; color: var(--muted); }

@media print {
  .diagramme { overflow: visible; border: none; }
  .diagramme svg { min-width: 0; width: 100%; }
  @page { size: A4 portrait; margin: 14mm; }
  header.topbar, nav.tabs, .toolbar, .filters, button, .no-print, footer.app { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  main { max-width: none; padding: 0; }
  .card { border: none; padding: 0; margin: 0 0 8mm; break-inside: avoid; }
  a { color: #000; }
  .bandeau-fictif { border: 2px dashed #be123c; color: #be123c; background: #fff; }
  .print-only { display: block !important; }
}
.print-only { display: none; }

</style>
</head>

<script type="application/json" id="data-ref">{"fiches":{"_table":"fiches","_source":"dossier_reconversion.pdf — Parties 0, 2, 4, 6 et 7. La numérotation « noyau dur 1.0 à 1.11 » appartient au rapport_recherche.md, non fourni : les fiches ci-dessous sont numérotées D-1 à D-16 (D = dossier).","_anonymisation":"L'employeur actuel est désigné « organisme public de recherche » (règle du dépôt : aucune mention de l'organisme d'origine).","items":[{"id":"fiche-ecosysteme","numero":"D-1","titre":"Écosystème de l'assurance dommages","theme":"ecosysteme","points":["L'assuré passe par un courtier (son mandataire) ou par un agent général (mandataire de l'assureur).","L'assureur, ou l'apériteur en coassurance, se réassure.","Le souscripteur tarife avec l'aide du risk engineer.","Le gestionnaire sinistres mandate l'expert d'assurance ; l'assuré peut mandater son propre expert d'assuré (Cabinet Roux, Galtier).","En cas de litige : référé-expertise, puis expert judiciaire.","M&A : l'acquéreur s'entoure de banques, d'avocats (SPA, GAP), des Big 4 (DD financière) et de consultants EHS ; l'assureur W&I lit le rapport.","Suisse : assureurs privés ; ECA (établissements cantonaux) en monopole dans 19 cantons dont Vaud, Fribourg, Neuchâtel, Jura ; Suva, services cantonaux, OFEV, OFROU, bureaux d'ingénieurs."],"liens":{"referenceIds":[],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 2.1"},{"id":"fiche-metier-expert","numero":"D-2","titre":"Métier A — Expert d'assurance côté assureur (France)","theme":"metier","points":["Quotidien (ordres de grandeur de terrain, non sourcés) : 30-50 % de terrain, le reste en chiffrage et rédaction ; un junior « entreprises » traite des dossiers modestes, sous tutelle ; mobilisation lors des catastrophes naturelles. Le chiffre de 40-80 dossiers avancé par l'annexe B n'est pas sourcé.","Livrables : rapport préliminaire ; procès-verbal contradictoire ; état de pertes ; rapport définitif (cause, chiffrage, franchises, règle proportionnelle, recours).","KPI : délais, écart entre réserve et règlement, recours exercés.","Compétences attendues : lecture de police, technique, chiffrage, perte d'exploitation, fermeté calme, empathie.","Ce qui fait recaler : discours de contrôleur, gêne à parler d'argent, rigidité, confusion DAB / RC.","Parcours : junior → confirmé (EEA) → « majeurs / entreprises » → directeur d'agence, expert d'assuré (au pourcentage) ou expert judiciaire (liste de cour d'appel).","Adéquation profil : forte en transport de marchandises, pollution et risques d'entreprise ; faible en construction pure."],"liens":{"referenceIds":["ref-l113-2","ref-l113-8","ref-l113-9","ref-l114-1","ref-l121-1","ref-l121-12"],"questionIds":[],"calculIds":["calc-rp-capitaux","calc-pe"],"scenarioIds":["scn-a"]},"statut":"ordre_de_grandeur","source_url":null,"date_verification":null,"note":"Partie 2.2 ; les pourcentages de terrain sont des estimations non sourcées"},{"id":"fiche-reflexe-expert","numero":"D-3","titre":"Fiche réflexe — Expert IARD entreprises","theme":"fiche_reflexe","points":["Mission : constater, établir la cause, chiffrer, appliquer la police, préserver les recours, toujours de façon contradictoire.","Réflexes : mesures conservatoires ; convoquer avant tout démontage ; scellés ; garanties et capitaux ; recours.","Articles : L.113-2, L.113-8, L.113-9, L.121-12, L.114-1.","Perte d'exploitation : marge brute assurée = CA − charges variables ; perte = taux de marge brute × baisse de CA + frais supplémentaires − économies.","Question à poser : « Quelle délégation et quel tutorat pour un junior ? »"],"liens":{"referenceIds":["ref-l113-2","ref-l113-8","ref-l113-9","ref-l121-12","ref-l114-1"],"questionIds":[],"calculIds":["calc-pe","calc-rp-capitaux","calc-rp-prime"],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 2.2 (encadré)"},{"id":"fiche-metier-riskeng","numero":"D-4","titre":"Métier B — Risk Engineer","theme":"metier","points":["Visites de 1 à 2 jours ; rapports en anglais chez les assureurs internationaux.","Estimations SMP/EML/PML/MFL selon les définitions propres à chaque assureur.","Recommandations hiérarchisées et suivi des mises hors service des protections (impairments).","Exigences observées : Zurich USA, au moins 3 ans d'expérience pour un consultant (CFPS en atout) ; offre suisse « Risk Engineer Sachversicherung » : formation incendie, explosion ou continuité d'activité (BCM) + expérience industrielle ; FM forme ses recrues en interne.","Adéquation profil : forte sur les stockages de matières dangereuses, l'ATEX et le lithium ; faible sur l'hydraulique des sprinklers. Parade : un module CNPP/APSAD et les FM Data Sheets.","Part de terrain : environ 40-60 % (estimation)."],"liens":{"referenceIds":["ref-nfpa13-25","ref-apsad-r1","ref-fm-datasheets","ref-atex-2014-34","ref-atex-1999-92"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 2.3 ; part de terrain = estimation"},{"id":"fiche-reflexe-riskeng","numero":"D-5","titre":"Fiche réflexe — Risk Engineer","theme":"fiche_reflexe","points":["Grille COPE : construction, occupation, protection, exposition.","EML : raisonner sur le plus grand compartiment.","Recommandations physiques, humaines ou organisationnelles, classées par réduction de l'EML et par coût.","Phrase type : « The loss estimate assumes the sprinkler system is impaired and the fire wall holds. »"],"liens":{"referenceIds":["ref-nfpa13-25","ref-fm-datasheets"],"questionIds":[],"calculIds":[],"scenarioIds":["scn-c"]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 2.3 (encadré)"},{"id":"fiche-metier-dd","numero":"D-6","titre":"Métier C — Due Diligence EHS / ESG","theme":"metier","points":["Mission type (2 à 4 semaines) : revue de la data room ; visite de site d'une demi-journée à une journée avec entretiens de la direction ; rapport « red flags » assorti de fourchettes de CAPEX/OPEX ; traduction contractuelle (indemnité spécifique, séquestre, ajustement de prix).","Réalité : 70 à 85 % de travail de bureau (estimation), en anglais. Le métier le plus proche d'un futur conseil indépendant.","Marché : Ginger Burgeap a intégré 50 ingénieurs de HPC le 1er juillet 2026 ; l'Omnibus I recentre l'ESG sur les risques matériels.","Adéquation : bonne sur la conformité ICPE, TMD et déchets ; faible sur les sols et les nappes. Parade : une formation sites et sols pollués (NF X31-620)."],"liens":{"referenceIds":["ref-astm-e1527","ref-nfx31-620","ref-csrd-omnibus"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 2.4 ; parts de bureau = estimation"},{"id":"fiche-reflexe-dd","numero":"D-7","titre":"Fiche réflexe — DD EHS","theme":"fiche_reflexe","points":["Ordre de lecture : permis → inspections et mises en demeure → sols et eaux → amiante/PFAS → santé-sécurité → litiges.","Un red flag est matériel, probable, chiffrable et traitable contractuellement.","L'indépendance ne se négocie pas."],"liens":{"referenceIds":["ref-astm-e1527","ref-nfx31-620"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 2.4 (encadré)"},{"id":"fiche-suisse","numero":"D-8","titre":"Déclinaisons suisses","theme":"suisse","points":["Inspecteur de sinistres / Schadeninspektor (Zurich, Helvetia Baloise, Mobilière, AXA, Vaudoise) : Zurich Valais exige au moins 5 ans, allemand en atout ; accessibilité faible maintenant, forte après 2-3 ans en France.","Spécialiste sinistres / Schadenspezialist (CFF, sièges d'assureurs) : allemand C1 ; accessibilité faible.","Risk Engineer Sachversicherung (assureurs, courtiers) : ingénieur, incendie/explosion/BCM ; accessibilité moyenne à faible.","Ingénieur environnement OPAM / OSites / SER (bureaux d'ingénieurs) : droit suisse ; MEILLEURE PORTE IMMÉDIATE.","Expert prévention ECA (ECA Vaud) : au moins 5 ans ; accessibilité faible.","Conseiller à la sécurité (OCS) / Gefahrgutbeauftragter (chimie, logistique, prestataires ex. Ecoservices) : l'OCS impose un conseiller pour le transport, l'emballage, le remplissage, l'expédition, le chargement et le déchargement ; accessibilité FORTE.","Dossier de candidature : CV avec photo ; certificats de travail (à défaut, lettres de recommandation) ; diplômes ; niveau de langue au format CECR.","Bon à savoir : le permis G est demandé par l'employeur après l'embauche ; le salaire se discute en brut annuel, en précisant 12 ou 13 mois ; la reconnaissance OQual/MSST d'un diplôme français n'est pas vérifiée.","Textes à connaître : OPAM, OSites, OLED, LPE, LEaux, SDR/OCS, LCA, CO, SIA, AEAI.","Monopole ECA (Vaud, Fribourg, Neuchâtel, Jura) contre marché libre (Genève, Valais).","Présentation : « Frontalier, français natif, anglais C1, allemand : plan [à compléter] »."],"liens":{"referenceIds":["ref-opam","ref-osites","ref-sdr-ocs","ref-lca","ref-aeai"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 2.5 ; reconnaissance OQual/MSST non vérifiée"},{"id":"fiche-remuneration","numero":"D-9","titre":"Rémunération — repères fact-checkés","theme":"marche","points":["France, expert junior : selon la fiche APEC « Expert d'assurances », 80 % des offres entre 33 et 50 k€ brut annuel (moyenne 40 k€) — et non 50-70 k€. Cabinet Roux Lyon : « à partir de 40 k€ ». Expert construction Lyon 7e : 48-52 k€. Exetech Montpellier : 50-55 k€ pour plus de 5 ans d'expérience. S'y ajoutent véhicule ou indemnités kilométriques, intéressement, parfois actionnariat.","Suisse, inspecteur : jobs.ch (brut, 13e inclus) : moyenne tous niveaux 93 333 CHF (secteur Assurances : 93 391 CHF) ; débutant 0-2 ans ≈ 58 500 CHF (petit échantillon, non reconfirmé) à 71 500 CHF (intitulé « inspecteur ») — loin des 105-135 k CHF annoncés. Ingénieur environnement débutant : 75-85 k CHF (FED Engineering 2026). Risk engineer : données Glassdoor contradictoires (148 k contre 90 k chez Helvetia).","Un salaire « doublé » devient plausible en brut nominal à 3-5 ans d'expérience, pas à l'entrée. Gain net frontalier à l'entrée : +40 à +70 % (estimation), pas un doublement.","Estimation illustrative : France 42 k€ brut (net ≈ 32-33 k€) + véhicule ; Vaud 80 k CHF brut 13e inclus (net ≈ 66-68 k CHF), impôt payé en France, 1 h à 1 h 30 de trajet en pointe.","Prétentions à annoncer : France 40-45 k€ fixe selon véhicule et variable ; Suisse : grilles du marché. À éviter : 55-70 k€ sans expérience.","Caveat : les chiffres jobs.ch, Glassdoor et Indeed sont auto-déclarés et reposent sur de petits échantillons."],"liens":{"referenceIds":[],"questionIds":["q-rh-pretentions"],"calculIds":[],"scenarioIds":[]},"statut":"ordre_de_grandeur","source_url":null,"date_verification":null,"note":"Fact-check n°14/15 + Partie 6.2 ; échantillons faibles"},{"id":"fiche-certifications","numero":"D-10","titre":"Certifications et formation continue","theme":"marche","points":["Le « CEA – Certificat d'Expertise en Assurance » n'existe pas. Les vrais repères : le TEA (CEA Développement) ; l'EEA du CNPP (ISO 17024, valable 6 ans, spécialité « Transport de marchandises » incluse) ; en transport, la recommandation CESAM, qui suppose l'EEA Transport.","La CEA est une chambre métier (Compagnie des experts, adossée à la FEDEA). Exemple de module FEDEA : « Expertise généraliste IARD », 5 jours, 570 € HT/jour, 2 ans de pratique « souhaitable ».","Profession non réglementée, mais certains assureurs ou conventions exigent le TEA ou l'EEA (L'Argus).","Prioritaires : module FEDEA (après l'embauche) ; module CNPP sprinklers ; formation courte sites et sols pollués ; allemand ; NEBOSH IGC (coût à vérifier).","Non prioritaires : PCR niveau 2, habilitation BE Vérification.","Sprint de 6 semaines : 1. Code des assurances et perte d'exploitation (Légifrance, FEDEA) · 2. Incendie (NFPA 921, CNPP, INRS) · 3. Sprinklers et lithium (FM Data Sheets) · 4. Sites et sols pollués, ICPE, Phase I · 5. Droit suisse (Fedlex, OFEV, bsvonline, Suva) · 6. Simulations d'entretien."],"liens":{"referenceIds":["ref-iso-17024","ref-nfpa-921","ref-fm-datasheets"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Fact-check n°6/7 + Partie 6.4 ; coût NEBOSH non vérifié"},{"id":"fiche-marche","numero":"D-11","titre":"Le marché bouge — actualités structurantes","theme":"marche","points":["Fusion Helvetia Baloise finalisée depuis le 5 décembre 2025 : moins d'embauches externes à court terme.","SGS a transféré son siège social de Genève à Baar (Zoug), voté à 88,99 % le 26 mars 2025, effectif au 1er novembre 2025 ; au moins 50 % des emplois genevois annoncés comme maintenus.","La CSRD a été réduite par l'Omnibus I : directive (UE) 2026/470, adoptée le 24 février 2026, publiée au JOUE le 26 février, en vigueur depuis le 18 mars 2026 ; transposition du volet CSRD au plus tard le 19 mars 2027 ; seuils cumulatifs : plus de 1 000 salariés ET plus de 450 M€ de CA.","Expertise : consolidation (Polyexpert–AM Group, Stelliant–HDE). L'IA automatise les petits sinistres et valorise les experts des dossiers complexes.","Allianz Risk Barometer 2026 : cyber n°1 (5e année, 42 %), IA n°2 (32 %, contre n°10 en 2025), interruption d'activité n°3 (première sortie du top 2), incendie n°9.","AEAI : PPI 2015 en vigueur, partiellement révisées au 1er avril 2026 ; les « PPI 2026 » entreront en vigueur à l'automne 2027 (AEAI/AIET), après plus de 11 000 commentaires et l'incendie de Crans-Montana."],"liens":{"referenceIds":["ref-csrd-omnibus","ref-aeai"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 0 (point 7), fact-check n°12/18/21/28, Partie 6.4"},{"id":"fiche-priorisation","numero":"D-12","titre":"Priorisation des pistes (plan d'attaque)","theme":"positionnement","points":["1. Expert IARD junior entreprises/transport (Lyon, Annecy, Chambéry) — formation interne, terrain, contradictoire, TMD valorisable — dès novembre 2026.","2. Risk engineer (assureurs, courtiers, FM) — technique, rapports en anglais, tremplin vers la Suisse — en parallèle.","3. Consultant DD EHS / sites et sols pollués — projets courts, prépare un futur conseil indépendant — en parallèle.","4. Suisse : bureaux d'ingénieurs, conseiller sécurité TMD — accessible sans expérience des sinistres — veille active.","5. Suisse : inspecteur de sinistres — exige de l'expérience — 2028-2029.","B. Organismes de contrôle, HSE Seveso, CERN — plan B rapide ; cycle CERN non vérifié — si aucune offre fin mars 2027.","Matrice de l'auteur (notes 1-5, total) : Expert FR 39 · Risk eng. 34 · Inspecteur CH 33 · Bureau CH 32 · Contrôle 31 · DD EHS 28 · CERN 27.","Le risque d'ennui existe partout : expertise junior = beaucoup de rédaction au départ ; DD = surtout du bureau ; risk engineering = du terrain, mais normé. Meilleur ratio action/enjeu à 3-5 ans : l'expertise « entreprises / grands risques »."],"liens":{"referenceIds":[],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 0 (priorisation) + Partie 6.1 ; matrice = jugement de l'auteur"},{"id":"fiche-france-suisse","numero":"D-13","titre":"France ou Suisse — règles frontalières","theme":"suisse","points":["Télétravail : seuil fiscal de 40 % (avenant du 27 juin 2023, accord amiable de 2026) ; seuil social de 49,9 % avec attestation A1 (25 % sans demande).","Imposition : à la source à Genève ; en France pour VD, VS, NE, JU, BE, SO, BS et BL (accord de 1983).","Non vérifié : le statut de quasi-résident, le régime LAMal/CMU et la LPP.","Période d'essai : France 4 mois pour un cadre, renouvelable si la branche le prévoit ; Suisse 1 mois par défaut, 3 mois au maximum (CO 335b).","Non-concurrence : France, clause limitée avec contrepartie financière ; Suisse, 3 ans au maximum (CO 340 et suivants).","Négociation : France — fixe, véhicule, intéressement, télétravail, certification ; Suisse — brut annuel 13e mois inclus, LPP, frais.","Règles de décision : offre FR ≥ 40 k€ avec tutorat : go. Bureau d'ingénieurs CH ≥ 78 k CHF (13e inclus) : go si trajet acceptable. CERN : go si l'offre arrive avant un autre engagement. Aucune offre fin mars 2027 : plan B, puis bascule vers l'expertise à 18 mois.","Préavis fonction publique : décret 86-83, art. 48 (à vérifier) : 1 mois entre 6 mois et 2 ans d'ancienneté."],"liens":{"referenceIds":[],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 6.2 + 7.4 ; items marqués non vérifiés dans a_verifier"},{"id":"fiche-positionnement","numero":"D-14","titre":"Positionnement et récit","theme":"positionnement","points":["Le profil combine réglementaire, audit, flux dangereux et leadership militaire : il se vend en expertise transport/TMD, pollution et risques d'entreprise ; il ne se vend pas en expertise construction pure.","Étiquettes par piste : expertise « risques & transport, investigation » ; risk engineering « hazardous materials & fire » ; due diligence « EHS compliance & audit ».","Contre le stigmate « conformité documentaire » : des verbes de terrain, des chiffres, un portfolio anonymisé.","Le récit gagnant : terrain, décision, enquête technique (motivation pull), pas l'ennui (push). « Assumer l'ennui » est risqué : le recruteur entend « il s'ennuiera ici aussi ».","Récit de transition (FR) : « Mon poste actuel m'a donné une maîtrise fine de l'audit réglementaire. Je veux maintenant que mon analyse technique débouche sur une décision : déterminer une cause, chiffrer un dommage, défendre une position en réunion contradictoire. »","Récit (EN) : « My current role gave me rigorous audit skills. Now I want my technical analysis to drive decisions with real financial stakes. »","Mention de la réserve : « Réserviste opérationnel spécialiste – conseiller TMD, grade de capitaine (depuis 09/2026) » ; ce grade est lié à l'expertise civile, ce n'est pas une carrière d'officier. Perception : défense et secteur public très positif ; Suisse neutre à positif ; anglo-saxons positif à condition d'éviter le jargon.","L'allemand est l'angle mort : seulement un « atout » pour l'inspecteur de terrain, mais exigé pour les spécialistes centralisés (C1 dans l'offre CFF) et de nombreux postes de risk engineer."],"liens":{"referenceIds":[],"questionIds":["q-rh-pourquoi-expertise","q-rh-militaire"],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Parties 0, 4.1, 4.2, 6.3"},{"id":"fiche-cv-corrections","numero":"D-15","titre":"CV — corrections obligatoires avant candidature","theme":"positionnement","points":["ENSOA : traduire « French Army NCO Academy » (l'ENSOA forme les sous-officiers), jamais « officer training ».","Un seul intitulé au Ministère des Armées (le CV porte deux intitulés selon les versions : « conseiller adjoint à la sécurité TMD » et « ingénieur environnement »).","Âge et ville cohérents : 30 ans, Annecy (des versions du CV portent Paris et 28/29 ans).","Ajouter la douane et la réserve : « coordination d'une équipe chargée des formalités douanières des chercheurs (Incoterms, import/export) » [à compléter] — atout cargo majeur.","Eiffage : présenter « Ingénieur RSE (alternance), Bureau performance RSE – solution de traçabilité des déchets en agences, déchets inertes, CSRD ; transfert vers l'Espagne » — une fonction RSE/déchets au siège, sans conduite de chantier. À la question « Avez-vous dirigé un chantier ? » : « Non : bureau performance RSE. Je connais les flux de déchets, pas la conduite de travaux ; d'où mon ciblage entreprise/transport. »","« 1 an d'alternance TMD + 1 an de CSTMD » est faux : en réalité 2 ans aux Armées, 2 ans chez Eiffage, environ 13 mois dans l'organisme actuel.","Décliner 3 CV ciblés avec mots-clés ATS : expertise « expertise IARD, sinistres entreprises, RC, DAB, PE, transport de marchandises, ADR, investigation » ; risk engineering « risk survey, loss prevention, sprinkler, ATEX, ICPE, Seveso, EML, BI, lithium » ; due diligence « Phase I, data room, red flag, sites et sols pollués, CAPEX, ISO 14001/45001 ».","Titres : « Ingénieur risques – sinistres d'entreprise, transport & TMD » / « Risk engineer – property & hazardous materials » / « EHS due diligence & compliance engineer ».","Accroche LinkedIn : « Ingénieur gestion des risques (ESAIP, CTI/EUR-ACE) | Conseiller sécurité TMD | Audit & investigation terrain | Ancien chef de groupe d'infanterie | Réserviste spécialiste (capitaine) ».","Diplôme ESAIP « Gestion des risques et environnement » : habilitation CTI et label EUR-ACE niveau master pour 2021-2025/26 (décision CTI 2020/12-03) ; le refus CTI de 2025 porte sur l'ouverture de l'apprentissage à Aix, pas sur l'habilitation existante ; renouvellement à contrôler."],"liens":{"referenceIds":[],"questionIds":["q-rh-cv-officer"],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"TL;DR, Top 10 des actions, fact-check n°24/25/29, Partie 4.5, et comparaison avec cv.pdf"},{"id":"fiche-feuille-route","numero":"D-16","titre":"Feuille de route 2026-2029","theme":"positionnement","points":["Mi-nov.-déc. 2026 : CV/LinkedIn, 10 entretiens informatifs, 15 candidatures — KPI : 5 contacts et 4 candidatures par semaine.","Janv.-mars 2027 : 2-3 processus avancés — KPI : 2 entretiens par semaine.","Avr.-juin 2027 : contrat signé, préavis.","S2 2027 : premiers dossiers, allemand A2, plan EEA.","2028-2029 : bascule suisse éventuelle.","Top 10 des 30 prochains jours : corriger le CV FR/EN ; décliner 3 CV ciblés ATS ; obtenir 10 entretiens informatifs ; postuler à toutes les offres « expert entreprises / RC / transport » en AURA (Saretec/Exetech, Stelliant, Polyexpert, Sedgwick, Crawford, McLarens, Cabinet Roux) ; apprendre L.113-2, L.113-8, L.113-9, L.114-1, L.121-1, L.121-12 et le calcul de la PE ; lire des résumés de la NFPA 921 et les guides CNPP/INRS ; préparer 8 récits STAR ; une simulation d'entretien en anglais + un risk survey report d'une page ; vérifier le préavis (décret 86-83) ; créer les alertes APEC, Welcome to the Jungle, jobup.ch et jobs.ch.","Événements : AMRAE, Préventica, Pollutec (Lyon), Expoprotection, Suissepro — les dates 2027 ne sont pas vérifiées."],"liens":{"referenceIds":[],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"Partie 7.1 + Top 10 ; dates de salons 2027 non vérifiées"},{"id":"nd-1-0","numero":"1.0","titre":"Noyau dur — Réformes 2024-2026 à citer","theme":"noyau_dur","points":["Loi n° 2026-403 du 26/05/2026 (simplification de la vie économique), JO du 27/05/2026, art. 30 à 34 : modifications du Code des assurances, en vigueur au 28/05/2026 pour les dispositions non différées [V].","L.113-5-1 (art. 31) : information de l'assuré sur son droit à une contre-expertise à ses frais — en vigueur, sans décret [V].","L.121-18 (art. 30) : délais 6 mois / 2 mois / 1 mois / 21 jours, acomptes motivés, rapport transmis à l'assuré, contrôle ACPR — texte en vigueur, application suspendue à un décret selon les commentateurs ; publication du décret [NV].","L.113-15-2-1 : résiliation infra-annuelle de certains contrats dommages professionnels TPE/PME — « pas encore mobilisable » [V secondaire].","Décret 2024-1101 du 03/12/2024 : expertises CatNat sécheresse (indépendance, contenu du rapport, délais) [V].","ADR 2027 (en vigueur 01/01/2027, ADR 2025 utilisable jusqu'au 30/06/2027) : ONU 3563/3564, DS 410, formation partiellement à distance, nouvelles consignes écrites, eFTI au 09/07/2027 [V].","Convention de Montréal : fret de 22 à 26 DTS/kg au 28/12/2024 [V]. NFPA 921 : édition 2024 [V].","Phrase d'entretien : « L.113-5-1 et L.121-18 imposent un rapport lisible par l'assuré et solide face à un contre-expert, et obligent les cabinets à tenir les délais. »"],"liens":{"referenceIds":["ref-l113-5-1","ref-l121-18","ref-decret-2024-1101","ref-adr-2027","ref-montreal","ref-nfpa-921"],"questionIds":["q-loi-2026"],"calculIds":["calc-echeancier"],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.0"},{"id":"nd-1-1","numero":"1.1","titre":"Noyau dur — Lire une police d'entreprise","theme":"noyau_dur","points":["Structure : conditions générales (cadre du produit) ; conditions particulières (risque, capitaux, franchises, LCI) — les CP priment sur les CG [NV] ; conventions spéciales (bris de machine, PE, facultés).","Ordre de lecture : assuré/activité/adresse → période et prime → définitions → événements garantis → exclusions (générales puis par garantie) → capitaux, LCI, sous-limites → franchises → modalités d'indemnisation (VN, vétusté) → règle proportionnelle et dérogations → obligations après sinistre, déchéances → prescription, expertise, tierce expertise.","Forme : exclusions, nullités et déchéances en caractères très apparents (L.112-4 [NV]) ; exclusions « formelles et limitées » (L.113-1) — une exclusion qui exige une interprétation est réputée non écrite (jurisprudence constante, arrêts à identifier sur Judilibre [NV]).","Preuve : l'assuré prouve que les conditions de la garantie sont réunies ; l'assureur prouve l'exclusion (art. 1353 C. civ. [NV]). Déchéance = manquement postérieur au sinistre ; retard de déclaration : préjudice à prouver (L.113-2).","Produits : multirisque entreprise (périls énumérés, TPE/PME) ; multirisque industrielle (périls nommés, PE, clauses APSAD, ETI) ; tous risques sauf (l'assureur prouve l'exclusion, grands comptes).","Garanties annexes usuelles [NV] : honoraires d'expert d'assuré ; démolition et déblais ; décontamination ; pertes indirectes ; recours des voisins et des tiers ; valeur à neuf.","Dérogations à la règle proportionnelle [NV] : tolérance (souvent 10 %), premier risque, abandon de RP (souvent après estimation par expert), indexation, déclaration révisable.","Question probable : « Une exclusion en petits caractères ? » → vérifier formelle, limitée, très apparente ; position technique — la décision de garantie appartient à l'assureur."],"liens":{"referenceIds":["ref-l113-1","ref-l113-2","ref-l121-5"],"questionIds":[],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.1"},{"id":"nd-1-2","numero":"1.2","titre":"Noyau dur — Code des assurances","theme":"noyau_dur","points":["L.113-1 exclusions ; L.113-2 déclarations et délais ; L.113-4 aggravation ; L.113-5-1 contre-expertise [V] ; L.113-8 nullité ; L.113-9 RP de prime ; L.114-1/L.114-2 prescription 2 ans, interrompue notamment par la désignation d'expert ou une LR ; L.121-1 principe indemnitaire ; L.121-5 RP de capitaux ; L.121-12 subrogation ; L.121-18 délais et transmission du rapport [V] ; L.122-1 et s. incendie ; L.124-3 action directe ; L.125-1 et s. CatNat.","NE PAS CONFONDRE : L.121-5 (capitaux) : indemnité = dommage × capital déclaré / valeur réelle ; L.113-9 (prime) : indemnité = dommage × prime payée / prime due.","Exemple : dommage 200 k€, capital déclaré 800 k€ / réel 1 000 k€ → 160 k€. Si prime 8 k€ au lieu de 10 k€ → 128 k€. Le cumul des deux règles est à vérifier en doctrine [NV].","Jurisprudence : chercher sur Judilibre (2e chambre civile) [NV]."],"liens":{"referenceIds":["ref-l113-1","ref-l113-2","ref-l113-4","ref-l113-5-1","ref-l113-8","ref-l113-9","ref-l114-1","ref-l121-1","ref-l121-5","ref-l121-12","ref-l121-18","ref-l124-3","ref-l125-1"],"questionIds":[],"calculIds":["calc-rp-capitaux","calc-rp-prime"],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.2 ; les articles français clés ont été contrôlés verbatim le 2026-11-10 (voir references)"},{"id":"nd-1-3","numero":"1.3","titre":"Noyau dur — Chiffrage des dommages directs","theme":"noyau_dur","points":["Définitions : valeur à neuf (coût de remplacement au jour du sinistre) ; vétusté ; valeur d'usage = VN − vétusté ; valeur vénale (hors terrain) ; indemnité immédiate = valeur d'usage ; indemnité différée (vétusté récupérable) si reconstruction dans le délai (souvent 2 ans), plafonnée souvent à 25 % ou 33 % de la VN [NV].","Ordre usuel (lire toujours la police) : dommage en VN → − vétusté → × coefficient de RP → − franchise → écrêtement au plafond → différé avec le même coefficient.","TVA : hors taxes si récupérable [NV] ; sauvetage en déduction ; découvert obligatoire éventuel.","Vétusté : PAS DE GRILLE LÉGALE — bâtiment 1-2 %/an, matériel industriel 5-10 %/an, informatique 15-33 %/an = ordres de grandeur NON SOURCÉS.","Erreurs de débutant : franchise avant la RP ; TVA récupérable indemnisée ; stock de produits finis au prix de vente (la marge relève de la PE).","EN : replacement cost, depreciation, actual cash value, salvage, underinsurance."],"liens":{"referenceIds":["ref-l121-5","ref-l121-1"],"questionIds":["q-stock-brule"],"calculIds":["calc-chaine-indemnite"],"scenarioIds":["scn-a"]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.3"},{"id":"nd-1-4","numero":"1.4","titre":"Noyau dur — Perte d'exploitation","theme":"noyau_dur","points":["MB assurée, méthode soustractive : CA + variation des stocks − charges variables ; méthode additive : résultat + frais généraux permanents [NV]. Taux de MB = MB / CA.","Période d'indemnisation 12-24 mois ; franchise en jours ouvrés ou en montant ; tendance (ajustement du CA de référence).","FSE admis dans la limite de la MB qu'ils sauvent ; économies de charges déduites ; RP en PE : MB déclarée / MB réelle ; extensions : carence fournisseurs/clients, impossibilité d'accès.","Formule : Indemnité = [(CA de référence ajusté − CA réalisé) × taux de MB + FSE − économies] × coeff RP − franchise, dans la limite du plafond. Exemple complet : scénario (a) → 1 379 927 €.","Ouvrage : Riley on Business Interruption Insurance (édition et prix [NV]).","EN : business interruption, gross profit, indemnity period, increased cost of working, contingent BI, denial of access."],"liens":{"referenceIds":["ref-l121-1"],"questionIds":["q-tech-int-marge"],"calculIds":["calc-pe"],"scenarioIds":["scn-a"]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.4"},{"id":"nd-1-5","numero":"1.5","titre":"Noyau dur — Procédure d'expertise","theme":"noyau_dur","points":["Séquence : mandat → contact 24-72 h (usage [NV]) → mesures conservatoires et conservation des preuves → convocation contradictoire de toutes les parties et de leurs assureurs (sans contradictoire, constatations non opposables et recours fragilisé) → PV de constatations, scellés → sapiteur/laboratoire sous protocole accepté avant toute analyse destructive → rapport préliminaire avec provision → état de pertes → PV de chiffrage / lettre d'acceptation → rapport définitif → quittance → recours.","Cadres : amiable contradictoire (mandat) ; tierce expertise (clause de la police, un 3e expert départage) ; référé-expertise (art. 145 CPC, « motif légitime ») ; expertise judiciaire (expert inscrit, rapport au juge).","Expert d'assuré : rémunéré par l'assuré, souvent via la garantie « honoraires ». Convention IRSI : dégâts des eaux/incendie en immeuble sous seuils (a remplacé la CIDE-COP en 2018 [NV]) ; au-delà : droit commun et recours.","Statut : profession non réglementée hors automobile [NV] ; représentée par la FEDEA. L'expert reste indépendant de son mandant : IL CONSTATE ET ÉVALUE, IL NE DÉCIDE PAS.","Certifications : TEA (FEDEA — 3 ans d'expérience ; déc. 2024 : 59 candidats, 28 reçus ; préparation ≈ 5 700 € HT ; enregistrement RS 6657 expirait le 27/06/2026, renouvellement [NV]) ; EEA (CNPP Cert., ISO 17024 — 40 dossiers/an minimum, valable 6 ans, promotion 2025 : 45 certifiés) ; CESAM (40 missions/an pendant 3 ans).","À dire en entretien : « Objectif TEA à 3 ans, puis une spécialité EEA ou CESAM transport. »","EN : loss adjuster, public adjuster, joint survey, chain of custody, interim/final report, proof of loss, recovery."],"liens":{"referenceIds":["ref-cpc-145","ref-l121-18","ref-l113-5-1","ref-iso-17024"],"questionIds":["q-fond-convocation","q-fond-scelles"],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.5"},{"id":"nd-1-6","numero":"1.6","titre":"Noyau dur — Responsabilité civile","theme":"noyau_dur","points":["DAB indemnise l'assuré pour ses biens ; la RC indemnise le tiers, qui dispose d'une action directe (L.124-3 [NV]).","Branches : RC exploitation, RC produits, RC professionnelle, RC atteinte à l'environnement.","Déclencheurs : base réclamation ou fait dommageable (L.124-5) ; garantie subséquente d'au moins 5 ans en base réclamation [NV].","Produits défectueux (C. civ. 1245 et s.) : responsabilité sans faute du producteur, prescription 3 ans, forclusion 10 ans [NV] ; directive (UE) 2024/2853 à transposer d'ici décembre 2026, statut en France [NV].","Mainteneur : responsabilité contractuelle (1231-1 C. civ.) ; obligation de moyens vs de résultat [NV].","Recours subrogatoire : toujours vérifier les clauses de renonciation à recours (baux, contrats de prestation).","EN : general/products liability, PI/E&O, EIL, claims-made vs occurrence, waiver of subrogation."],"liens":{"referenceIds":["ref-l124-3","ref-cciv-1245","ref-l121-12"],"questionIds":[],"calculIds":[],"scenarioIds":["scn-a"]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.6"},{"id":"nd-1-7","numero":"1.7","titre":"Noyau dur — Transport (la niche)","theme":"noyau_dur","points":["Contrat type général (décret 2017-461, art. 22) [V] : <3 t → 33 €/kg, 1 000 €/colis ; ≥3 t → 20 €/kg, 3 200 €/t ; supplétif ; déclaration de valeur écrite moyennant prix ; UTI 2 875 € (source secondaire) ; 9 contrats types routiers, plafonds propres [NV].","Code de commerce [NV] : L.132-5/6 commissionnaire garant ; L.133-1 responsabilité du voiturier ; L.133-3 protestation 3 jours ; L.133-6 prescription 1 an ; L.133-8 seule la faute inexcusable fait sauter les plafonds.","International : CMR art. 23 (8,33 DTS/kg), 17 (exonérations), 29 (dol), 30 (réserves 7 jours non apparent), 32 (1 an) ; La Haye-Visby 666,67 DTS/colis ou 2 DTS/kg ; Montréal 26 DTS/kg [V].","Incoterms 2020 [NV] : CPT/CIP risque au premier transporteur ; FOB/CFR/CIF à bord ; D-terms à destination ; CIP impose ICC (A), CIF seulement ICC (C).","Facultés : police française « tous risques / FAP sauf » ; ICC A/B/C ; exclusions ICC (A) : emballage 4.3, vice propre 4.4, retard 4.5 [NV] ; avarie commune (York-Anvers) ; commissaire d'avaries ; typologie : casse, mouille, vol, chaîne du froid, désarrimage, marchandises dangereuses non déclarées.","ADR (numéros [NV]) : 1.4 obligations des intervenants ; 1.8.3.6 rapport d'accident du conseiller ; 1.8.5 déclaration d'événement.","DIFFÉRENCIATEUR : croiser la chaîne ADR (qui a rempli, chargé, arrimé ?) avec la chaîne contractuelle."],"liens":{"referenceIds":["ref-contrat-type-general","ref-cmr","ref-hague-visby","ref-montreal","ref-l133-3-ccom","ref-l133-6-ccom","ref-l133-8-ccom","ref-l132-5-6-ccom","ref-adr-1-4","ref-adr-1-8-3","ref-york-anvers"],"questionIds":["q-palette-cassee","qf-12"],"calculIds":["calc-plafonds-transport","calc-echeancier"],"scenarioIds":["scn-b","scn-c"]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.7"},{"id":"nd-1-8","numero":"1.8","titre":"Noyau dur — Incendie : recherche des causes","theme":"noyau_dur","points":["NFPA 921 éd. 2024 [V], méthode scientifique : définir le problème → collecter puis analyser les données → hypothèses testées par déduction → hypothèse finale. Outils : figures de feu, zone d'origine, arc mapping. La « negative corpus » est désapprouvée [NV formulation].","Accès : lecture gratuite sur nfpa.org (compte requis) ; PDF payant inutile.","RCCI en France : formation CNPP (attestation CFPA Europe possible au module 2) [V].","Statistiques : 2024, les 2 accidents mortels en ICPE liés à des travaux par point chaud [V secondaire] ; 2023 : incendie dans 45 % des accidents, défaillance matérielle dans 60 % [V].","Permis de feu : analyse préalable, éloignement des combustibles, extinction, surveillance après travaux (souvent 1-2 h [NV]) ; FM DS 10-3 [V].","Lithium : emballement thermique → gaz inflammables/toxiques → propagation → RÉ-INFLAMMATION (Grand-Couronne : reprise vers 3 h [V]) ; FM DS 7-112 (oct. 2024), 8-1 §2.4.2, 5-33 ; état de charge 30-60 %, sprinkleurs en rack pour batteries usagées (sources secondaires).","EN : origin and cause, fire patterns, arc mapping, hot work permit, fire watch, thermal runaway."],"liens":{"referenceIds":["ref-nfpa-921","ref-fm-datasheets"],"questionIds":["q-fond-cause-electrique","q-rcci"],"calculIds":[],"scenarioIds":["scn-a","scn-c"]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.8"},{"id":"nd-1-9","numero":"1.9","titre":"Noyau dur — Environnement","theme":"noyau_dur","points":["Assurpol : statut actuel non vérifié [NV] — ne citer aucun chiffre.","LRE (C. env. L.160-1 et s. [NV]) : régime administratif mis en œuvre par le préfet ; réparation primaire, complémentaire, compensatoire.","Préjudice écologique (C. civ. 1246 à 1252 [NV]) : réparation en nature d'abord.","Eaux d'extinction : rétention dimensionnée selon le document APSAD D9A [NV] ; coûts de pompage et de traitement.","Acteurs : SDIS, préfet, DREAL (ICPE), DDT(M)/police de l'eau, OFB, ARS, maire."],"liens":{"referenceIds":["ref-cenv-l160-1","ref-cciv-1246"],"questionIds":[],"calculIds":[],"scenarioIds":["scn-b"]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.9"},{"id":"nd-1-10","numero":"1.10","titre":"Noyau dur — Risk engineering","theme":"noyau_dur","points":["COPE : Construction, Occupancy, Protection, Exposure.","Scénarios de sinistre maximal (définitions variables selon les assureurs [NV]) : SMP/EML (protections passives) ; PML (protections actives en service) ; MFL (protections actives en défaut) ; NLE (fonctionnement normal). TOUJOURS demander « selon quelle définition maison ? ».","APSAD : R1 (07/10/2025), R2, R4-R8, R11, R12, R15-R17, R31, D19/D20/D32 ; système R/N/Q (Q18 électricité, Q19 thermographie).","FM Data Sheets : 8-1, 8-9, 7-112, 5-33, 10-3, 10-7, 2-81 (Red Tag), 3-26, 10-1.","ICPE 1510 : arrêté du 11/04/2017 modifié [NV]. Leçon de Grand-Couronne : site non autorisé à recevoir des batteries usagées classées déchets dangereux [V presse].","Plan d'un risk survey report : executive summary → COPE → fire protection → special hazards → management programs → natural hazards → PML/MFL et PE → recommendations → appendices."],"liens":{"referenceIds":["ref-apsad-r1","ref-fm-datasheets","ref-icpe-1510"],"questionIds":["q-tech-conf-eml","q-en-cope"],"calculIds":[],"scenarioIds":["scn-c"]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.10"},{"id":"nd-1-11","numero":"1.11","titre":"Noyau dur — Due diligence EHS","theme":"noyau_dur","points":["ASTM E1527-21 : Phase I, identification des Recognized Environmental Conditions [NV].","NF X31-620 : codes de mission A100, A110, A200… [NV].","Red flags : titre ICPE inadéquat, cuves enterrées, traitement de surface (chrome VI, solvants chlorés), PFAS, amiante, mises en demeure.","Traduction contractuelle : garantie de passif, séquestre, indemnité spécifique, assurance pollution legal liability."],"liens":{"referenceIds":["ref-astm-e1527","ref-nfx31-620"],"questionIds":["q-dd-phase1"],"calculIds":[],"scenarioIds":[]},"statut":"V","source_url":null,"date_verification":null,"note":"rapport_recherche bloc 1.11"}]},"references":{"_table":"references","_source":"dossier_reconversion.pdf (Partie 3 et passim) ; vérifications du 2026-11-10 sur l'édition DILA des codes (codes.droit.org, édition 2026-10-14, dernière modification 2026-08-20) et sources officielles citées en note. Les textes de normes privées (NFPA, APSAD, FM, ASTM, SIA) ne sont jamais reproduits : référence, résumé reformulé, lien.","items":[{"id":"ref-l113-1","type":"article_loi","code":"Code des assurances","numero":"L.113-1","intitule":"Charge des pertes et dommages — exclusions","resume":"L'assureur couvre les cas fortuits et les fautes de l'assuré, sauf exclusion formelle et limitée contenue dans la police. Il ne répond jamais de la faute intentionnelle ou dolosive de l'assuré.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim sur l'édition DILA 2026-10-14. Légifrance : rechercher « L113-1 code des assurances »."},{"id":"ref-l113-2","type":"article_loi","code":"Code des assurances","numero":"L.113-2","intitule":"Obligations de l'assuré — délais de déclaration","resume":"Obligations de l'assuré : payer la prime ; répondre exactement au questionnaire de risque ; déclarer les circonstances nouvelles aggravantes sous 15 jours (lettre recommandée) ; déclarer tout sinistre au plus tard dans le délai fixé par le contrat, qui ne peut être inférieur à 5 jours ouvrés — ramené à 2 jours ouvrés en cas de vol et 24 heures en cas de mortalité du bétail. La déchéance pour déclaration tardive exige que l'assureur prouve un préjudice.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14). Le dossier signalait ces délais « à vérifier » : c'est fait."},{"id":"ref-l113-4","type":"article_loi","code":"Code des assurances","numero":"L.113-4","intitule":"Aggravation et diminution du risque","resume":"En cas d'aggravation du risque en cours de contrat, l'assureur peut dénoncer le contrat (effet 10 jours après notification) ou proposer une nouvelle prime (résiliation possible à défaut de réponse sous 30 jours). Il ne peut plus s'en prévaloir s'il a maintenu l'assurance en connaissance de cause. Diminution du risque : droit à baisse de prime, sinon résiliation par l'assuré.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Le dossier marquait L.113-4 d'un (?) : référence confirmée, texte contrôlé verbatim. Ne pas confondre aggravation (L.113-8/9 pour la déclaration) et exclusion."},{"id":"ref-l113-8","type":"article_loi","code":"Code des assurances","numero":"L.113-8","intitule":"Fausse déclaration intentionnelle — nullité","resume":"Le contrat est nul en cas de réticence ou fausse déclaration intentionnelle qui change l'objet du risque ou en diminue l'opinion pour l'assureur, même sans influence sur le sinistre. Les primes restent acquises à l'assureur.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14)."},{"id":"ref-l113-9","type":"article_loi","code":"Code des assurances","numero":"L.113-9","intitule":"Fausse déclaration non intentionnelle — règle proportionnelle de prime","resume":"L'omission ou la déclaration inexacte sans mauvaise foi établie n'entraîne pas la nullité. Constatée après sinistre, l'indemnité est réduite « en proportion du taux des primes payées par rapport au taux des primes qui auraient été dues, si les risques avaient été complètement et exactement déclarés ». Avant sinistre : maintien avec surprime acceptée, ou résiliation à 10 jours.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim. Base du calculateur « règle proportionnelle de prime »."},{"id":"ref-l114-1","type":"article_loi","code":"Code des assurances","numero":"L.114-1","intitule":"Prescription biennale","resume":"Toutes actions dérivant d'un contrat d'assurance se prescrivent par 2 ans à compter de l'événement. Exception : 5 ans pour les dommages de mouvements de terrain liés à la sécheresse-réhydratation reconnus CatNat. Points de départ reportés en cas d'ignorance du sinistre ou de recours d'un tiers ; 10 ans dans certaines assurances de personnes. L.114-2 : interruption notamment par la DÉSIGNATION D'EXPERT ou par lettre recommandée [NV].","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte de L.114-1 contrôlé verbatim (dernière modification : loi 2021-1837). L'exception sécheresse (5 ans) et l'interruption par désignation d'expert sont à citer en entretien."},{"id":"ref-l121-1","type":"article_loi","code":"Code des assurances","numero":"L.121-1","intitule":"Principe indemnitaire","resume":"L'assurance de biens est un contrat d'indemnité : l'indemnité ne peut dépasser la valeur de la chose assurée au moment du sinistre. Franchise et découvert obligatoire peuvent être stipulés.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14)."},{"id":"ref-l121-5","type":"article_loi","code":"Code des assurances","numero":"L.121-5","intitule":"Règle proportionnelle de capitaux","resume":"« S'il résulte des estimations que la valeur de la chose assurée excède au jour du sinistre la somme garantie, l'assuré est considéré comme restant son propre assureur pour l'excédent, et supporte, en conséquence, une part proportionnelle du dommage, sauf convention contraire. » D'où : indemnité = dommage × (capitaux déclarés / valeur réelle). Dérogations possibles : premier risque, clause de tolérance.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim. Base du calculateur « règle proportionnelle de capitaux »."},{"id":"ref-l121-12","type":"article_loi","code":"Code des assurances","numero":"L.121-12","intitule":"Subrogation de l'assureur","resume":"L'assureur qui a payé est subrogé, à concurrence de l'indemnité, dans les droits de l'assuré contre les tiers responsables. Il est déchargé si la subrogation devient impossible du fait de l'assuré (d'où l'importance de préserver les recours). Pas de recours contre les proches et préposés, sauf malveillance.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14)."},{"id":"ref-l121-17","type":"article_loi","code":"Code des assurances","numero":"L.121-17","intitule":"Affectation des indemnités — remise en état","resume":"Les indemnités versées pour un dommage à un immeuble bâti doivent être utilisées pour sa remise en état effective (ou celle de son terrain d'assiette) ; clause contraire nulle d'ordre public ; arrêté du maire sous 2 mois.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim."},{"id":"ref-l121-18","type":"article_loi","code":"Code des assurances","numero":"L.121-18","intitule":"Délais de règlement des sinistres (loi n° 2026-403 du 26 mai 2026)","resume":"Créé par la loi n° 2026-403 du 26 mai 2026 (art. 30, « simplification de la vie économique », JO du 27/05/2026). Avec expert désigné : proposition d'indemnisation (ou réparation en nature, ou refus motivé) sous 6 mois à compter de la déclaration ; à défaut d'établissement des causes/évaluation, proposition d'acompte motivée ou refus motivé d'acompte. Sans expert : 2 mois. Après accord de l'assuré : 1 mois pour missionner l'entreprise de réparation ou 21 jours pour verser — sinon intérêt légal. L'expert transmet son rapport définitif à l'assureur ET à l'assuré. Contrôle ACPR. Un décret en Conseil d'État liste les contrats exclus.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14). Légifrance : LEGIARTI000054136978. ATTENTION : texte en vigueur mais, selon les commentateurs cités par le rapport, application pratique suspendue au décret (contrats conclus ou reconduits après sa publication) — publication du décret NV, voir a_verifier. Article clé en entretien : très récent."},{"id":"ref-l113-5-1","type":"article_loi","code":"Code des assurances","numero":"L.113-5-1","intitule":"Droit à l'information sur la contre-expertise (loi n° 2026-403, art. 31)","resume":"« Lors de la réalisation du risque, l'assureur informe l'assuré de son droit de solliciter, aux frais de ce dernier, une contre-expertise effectuée par un expert de son choix. » En vigueur, sans décret d'application nécessaire.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-12","note":"Texte contrôlé verbatim le 2026-11-12 sur l'édition DILA du 2026-10-14 (LOI n° 2026-403 du 26 mai 2026, art. 31). Légifrance : LEGIARTI000054135495. Avec L.121-18 : impose un rapport lisible par l'assuré et solide face à un contre-expert."},{"id":"ref-l125-1","type":"article_loi","code":"Code des assurances","numero":"L.125-1","intitule":"Catastrophes naturelles — garantie","resume":"Garantie CatNat obligatoire dans les contrats dommages aux biens situés en France (et PE si couverte). Effets CatNat = dommages matériels directs non assurables dont la cause déterminante est l'intensité anormale d'un agent naturel (régime particulier pour la sécheresse-réhydratation). État constaté par arrêté interministériel. Frais de relogement d'urgence pris en charge.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim."},{"id":"ref-l125-2","type":"article_loi","code":"Code des assurances","numero":"L.125-2","intitule":"Catastrophes naturelles — délais d'indemnisation","resume":"À compter de la déclaration (ou de la publication de l'arrêté si postérieure) : 1 mois pour informer l'assuré des modalités et ordonner une expertise ; 1 mois après réception de l'état estimatif ou du rapport d'expertise définitif pour faire une proposition ; après accord de l'assuré, 1 mois pour missionner l'entreprise ou 21 jours pour verser — sinon intérêt légal. Franchise définie par décret.","source_url":"https://codes.droit.org/PDF/Code%20des%20assurances.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA 2026-10-14)."},{"id":"ref-l242-1","type":"article_loi","code":"Code des assurances","numero":"L.242-1","intitule":"Assurance dommages-ouvrage","resume":"Assurance obligatoire du maître d'ouvrage préfinançant les réparations de nature décennale, avec délais de réponse encadrés de l'assureur (non détaillés ici).","source_url":null,"statut":"NV","date_verification":null,"note":"Cité par le lexique du dossier. Délais précis non repris : à contrôler sur Légifrance avant usage."},{"id":"ref-l133-1-ccom","type":"article_loi","code":"Code de commerce","numero":"L.133-1","intitule":"Responsabilité du voiturier","resume":"Le voiturier est garant de la perte des objets à transporter (hors force majeure) et des avaries (hors vice propre et force majeure). Toute clause contraire dans la lettre de voiture est nulle.","source_url":"https://codes.droit.org/PDF/Code%20de%20commerce.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (édition DILA)."},{"id":"ref-l133-3-ccom","type":"article_loi","code":"Code de commerce","numero":"L.133-3","intitule":"Fin de non-recevoir — protestation motivée","resume":"La réception des objets transportés éteint toute action contre le voiturier pour avarie ou perte partielle si, dans les 3 jours (jours fériés non compris) suivant la réception, le destinataire n'a pas notifié sa protestation motivée par acte extrajudiciaire ou lettre recommandée. Une demande d'expertise (L.133-4) dans le délai vaut protestation. Stipulations contraires nulles — règle non applicable aux transports internationaux.","source_url":"https://codes.droit.org/PDF/Code%20de%20commerce.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim. Base de l'échéancier des délais (transport intérieur)."},{"id":"ref-l133-8-ccom","type":"article_loi","code":"Code de commerce","numero":"L.133-8","intitule":"Faute inexcusable — déplafonnement","resume":"Seule la faute inexcusable du transporteur (ou du commissionnaire) prive du bénéfice des limitations de responsabilité : faute délibérée avec conscience de la probabilité du dommage et acceptation téméraire sans raison valable.","source_url":null,"statut":"NV","date_verification":null,"note":"Cité [NV] par le rapport (bloc 1.7) : à contrôler sur Légifrance."},{"id":"ref-l132-5-6-ccom","type":"article_loi","code":"Code de commerce","numero":"L.132-5 et L.132-6","intitule":"Garantie du commissionnaire de transport","resume":"Le commissionnaire est garant de l'arrivée des marchandises et des faits de ses substitués (transporteurs qu'il choisit). Fondement du recours contre le commissionnaire dans le scénario (c).","source_url":null,"statut":"NV","date_verification":null,"note":"Cité [NV] par le rapport : à contrôler sur Légifrance."},{"id":"ref-l124-3","type":"article_loi","code":"Code des assurances","numero":"L.124-3","intitule":"Action directe du tiers lésé","resume":"Le tiers lésé dispose d'une action directe contre l'assureur de responsabilité du responsable. Déclencheurs des polices RC : base réclamation ou fait dommageable (L.124-5), garantie subséquente d'au moins 5 ans en base réclamation.","source_url":null,"statut":"NV","date_verification":null,"note":"Cité [NV] par le rapport (bloc 1.6)."},{"id":"ref-decret-2024-1101","type":"article_loi","code":"Décret n° 2024-1101 du 3 décembre 2024","numero":null,"intitule":"Expertises CatNat sécheresse : indépendance, contenu du rapport, délais","resume":"Encadre les expertises des sinistres sécheresse-réhydratation reconnus CatNat : exigences d'indépendance de l'expert, contenu minimal du rapport et délais.","source_url":null,"statut":"V","date_verification":null,"note":"Vérifié par le rapport [V, Légifrance]. À citer avec l'exception de prescription de 5 ans (L.114-1)."},{"id":"ref-adr-2027","type":"convention","code":"ADR 2027","numero":null,"intitule":"ADR 2027 — nouveautés (en vigueur au 01/01/2027)","resume":"ADR 2025 utilisable jusqu'au 30/06/2027. Nouveaux numéros ONU 3563 (lithium métal) et 3564 (sodium-ion) pour les batteries installées dans des engins de transport ; disposition spéciale 410 (batteries hybrides) ; formation des conducteurs partiellement à distance (8.2.2) ; nouveau modèle de consignes écrites (ancien utilisable jusqu'au 31/12/2027) ; section 6.9.3 ; eFTI au 09/07/2027.","source_url":null,"statut":"V","date_verification":null,"note":"Vérifié par le rapport (notification du 01/07/2026, dont une note officielle de l'OFROU). Sujet d'entretien : lithium + ADR 2027."},{"id":"ref-l133-6-ccom","type":"article_loi","code":"Code de commerce","numero":"L.133-6","intitule":"Prescription annale (transport)","resume":"Les actions pour avaries, pertes ou retards contre le voiturier sont prescrites par 1 an (sauf fraude ou infidélité), comptée de la livraison (ou du jour où elle aurait dû avoir lieu en cas de perte totale). Action récursoire : 1 mois à compter de l'action contre le garanti.","source_url":"https://codes.droit.org/PDF/Code%20de%20commerce.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim."},{"id":"ref-contrat-type-general","type":"article_loi","code":"Code des transports","numero":"Annexe II (art. D.3222-1), art. 21-22","intitule":"Contrat type général — plafonds d'indemnisation","resume":"Contrat type SUPPLÉTIF (décret 2017-461, en vigueur au 01/05/2017), applicable à défaut de contrat type spécifique ou de convention écrite. Art. 22 : hors dol et faute inexcusable, indemnité plafonnée à : envois < 3 t → 33 €/kg de poids brut manquant ou avarié, sans dépasser 1 000 € par colis ; envois ≥ 3 t → 20 €/kg, sans dépasser 3 200 € × tonnage. Avant 2017 : 23 €/kg, 750 €/colis ; 14 €/kg, 2 300 €/t. Déclaration de valeur écrite au plus tard à la conclusion, moyennant un prix. UTI : 2 875 € (source secondaire). Art. 21 : présomption de perte 30 jours. Il existe 9 contrats types routiers (citerne, température dirigée…) aux plafonds propres [NV].","source_url":"https://codes.droit.org/PDF/Code%20des%20transports.pdf","statut":"V","date_verification":"2026-11-10","note":"Texte contrôlé verbatim (annexe II, édition DILA). Légifrance : LEGIARTI000043864485. Base du calculateur plafonds transport (national)."},{"id":"ref-cmr","type":"convention","code":"CMR (Genève, 1956 + protocole DTS 1978)","numero":"art. 23, 29, 30, 32","intitule":"Transport international routier — limitation et délais","resume":"Art. 23 : indemnité pour perte limitée à 8,33 unités de compte (DTS) par kg de poids brut manquant. Art. 17 : exonérations. Art. 29 : la limitation saute en cas de dol ou faute équivalente. Art. 30 : réserves à la livraison (avaries apparentes), sous 7 jours pour les avaries non apparentes, et réserve écrite sous 21 jours pour le retard. Art. 32 : prescription 1 an, 3 ans en cas de dol.","source_url":null,"statut":"NV","date_verification":null,"note":"Le taux de 8,33 DTS/kg (art. 23) est vérifié par le dossier et des sources concordantes — c'est le détail des délais des art. 30 et 32 qui reste à contrôler sur le texte officiel (unece.org ou fedlex.admin.ch RS 0.741.611), inaccessibles depuis cet environnement (accès automatisés bloqués)."},{"id":"ref-montreal","type":"convention","code":"Convention de Montréal (1999)","numero":"art. 22(3)","intitule":"Transport aérien — limite fret","resume":"Limite de responsabilité fret : 26 DTS par kg depuis le 28 décembre 2024 (révision quinquennale OACI de 2024, facteur d'inflation 17,9 % ; 22 DTS/kg de 2019 à 2024). La limite applicable est celle en vigueur à la date de l'événement.","source_url":"https://www.icao.int/news/international-air-travel-liability-limits-set-increase-enhancing-customer-compensation-0","statut":"V","date_verification":"2026-11-10","note":"Concordant : OACI, Office des transports du Canada, gazette de Hong Kong, memo IATA PSC/2024-10/112. Bagages : 1 519 DTS/passager."},{"id":"ref-hague-visby","type":"convention","code":"Règles de La Haye-Visby (Bruxelles 1924, prot. 1968 et 1979)","numero":"art. IV(5)(a)","intitule":"Transport maritime — limitation","resume":"Limitation : 666,67 unités de compte (DTS) par colis ou unité, ou 2 DTS par kg de poids brut des marchandises perdues ou endommagées, la plus élevée des deux étant applicable. L'énumération des colis au connaissement (art. IV(5)(c)) peut fixer le décompte pour les conteneurs.","source_url":"https://admiraltylawguide.com/conven/sdrprotocol1979.html","statut":"V","date_verification":"2026-11-10","note":"Texte du protocole DTS de 1979 + jurisprudence anglaise concordante (Kyokuyo v Maersk)."},{"id":"ref-york-anvers","type":"convention","code":"Règles d'York et d'Anvers","numero":null,"intitule":"Avarie commune","resume":"Règles contractuelles types régissant la contribution d'avarie commune en transport maritime (sacrifices et dépenses faits pour le salut commun répartis entre navire, fret et cargaison).","source_url":null,"statut":"V","date_verification":null,"note":"Citées par le lexique du dossier."},{"id":"ref-cpc-145","type":"article_loi","code":"Code de procédure civile","numero":"art. 145","intitule":"Référé probatoire (référé-expertise)","resume":"S'il existe un motif légitime de conserver ou d'établir avant tout procès la preuve de faits dont pourrait dépendre la solution d'un litige, des mesures d'instruction (expertise judiciaire) peuvent être ordonnées à la demande de tout intéressé.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le lexique du dossier (expertise contradictoire / référé-expertise). Résumé reformulé."},{"id":"ref-cciv-1245","type":"article_loi","code":"Code civil","numero":"art. 1245 et s.","intitule":"Responsabilité du fait des produits défectueux","resume":"Le producteur est responsable du dommage causé par un défaut de son produit. Fondement de recours typique contre le fabricant d'un équipement à l'origine d'un sinistre.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le dossier (cas 1, recours)."},{"id":"ref-cciv-1246","type":"article_loi","code":"Code civil","numero":"art. 1246 et s.","intitule":"Préjudice écologique","resume":"Toute personne responsable d'un préjudice écologique est tenue de le réparer ; réparation par priorité en nature.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le lexique du dossier (LRE / préjudice écologique)."},{"id":"ref-cciv-1792","type":"article_loi","code":"Code civil","numero":"art. 1792","intitule":"Responsabilité décennale","resume":"Responsabilité de plein droit du constructeur, pendant 10 ans, pour les dommages compromettant la solidité de l'ouvrage ou le rendant impropre à sa destination.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le lexique du dossier."},{"id":"ref-cenv-l160-1","type":"article_loi","code":"Code de l'environnement","numero":"L.160-1 et s.","intitule":"Responsabilité environnementale (LRE)","resume":"Régime de prévention et de réparation des dommages causés à l'environnement (transposition de la directive 2004/35/CE) : réparation primaire, complémentaire et compensatoire.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le dossier (cas 2 : LRE — réparation primaire, complémentaire, compensatoire)."},{"id":"ref-badinter","type":"article_loi","code":"Loi n° 85-677 du 5 juillet 1985 (Badinter)","numero":null,"intitule":"Indemnisation des victimes d'accidents de la circulation","resume":"Régime spécial d'indemnisation des victimes d'accidents de la circulation impliquant un véhicule terrestre à moteur ; articulation avec les dommages causés par la marchandise transportée à vérifier au cas par cas.","source_url":null,"statut":"NV","date_verification":null,"note":"Le dossier (cas 2) note : « RC automobile (loi de 1985 ; articulation avec la marchandise à vérifier) »."},{"id":"ref-adr-1-4","type":"convention","code":"ADR","numero":"chap. 1.4","intitule":"Obligations de sécurité des intervenants","resume":"Répartition des obligations entre expéditeur, transporteur, destinataire, chargeur, emballeur, remplisseur, exploitant de citerne, déchargeur. Grille d'analyse des responsabilités dans un sinistre TMD.","source_url":null,"statut":"V","date_verification":null,"note":"Cité par le dossier (lexique, cas 2, auto-évaluation Q13)."},{"id":"ref-adr-1-8-3","type":"convention","code":"ADR","numero":"chap. 1.8.3","intitule":"Conseiller à la sécurité — rapport d'accident","resume":"Obligation de désigner un conseiller à la sécurité ; rédaction d'un rapport d'accident après tout événement grave (1.8.3.6).","source_url":null,"statut":"NV","date_verification":null,"note":"Le dossier marque la référence 1.8.3 d'un (?) : numéro de sous-section à confirmer sur l'ADR en vigueur (unece.org)."},{"id":"ref-nfpa-921","type":"norme","code":"NFPA 921","numero":null,"intitule":"Guide for Fire and Explosion Investigations","resume":"Guide méthodologique de l'investigation incendie/explosion — ÉDITION 2024 en vigueur (remplace 2021, « custom cycle ») : méthode scientifique (définir le problème, collecter, analyser, hypothèses testées par déduction), zone d'origine, figures de feu, arc mapping, chain of custody. La « negative corpus » (cause par simple élimination) est désapprouvée [NV pour la formulation]. Texte non reproduit (droit d'auteur) : lecture gratuite sur nfpa.org (« View Free Access », compte requis, ni impression ni téléchargement).","source_url":"https://www.nfpa.org/","statut":"V","date_verification":null,"note":"Édition 2024 vérifiée par le rapport [V, ANSI]. PDF payant ~163 USD : inutile, l'accès gratuit suffit."},{"id":"ref-nfpa13-25","type":"norme","code":"NFPA 13 / NFPA 25","numero":null,"intitule":"Sprinklers — installation / inspection, test et maintenance","resume":"NFPA 13 : conception et installation des systèmes sprinklers. NFPA 25 : inspection, essais et maintenance (dont gestion des mises hors service). Texte non reproduit : référence et lien éditeur.","source_url":"https://www.nfpa.org/","statut":"V","date_verification":null,"note":"Citées par le lexique du dossier."},{"id":"ref-apsad-r1","type":"referentiel","code":"Référentiels APSAD (CNPP)","numero":"R1, R2, R4-R8, R11, R12, R15-R17, R31, D19, D20, D32","intitule":"Règles APSAD — prévention et protection incendie","resume":"R1 sprinkleurs (nouvelle parution le 07/10/2025) ; R2 brouillard d'eau ; R4 extincteurs ; R5 RIA (06/12/2024) ; R6 maîtrise du risque incendie ; R7 détection (éd. 2021) ; R8 surveillance ; R11 analyse de risque et de vulnérabilité ; R12 mousse haut foisonnement ; R15/R16 coupe-feu ; R17 désenfumage ; R31 télésurveillance (recours Viviez) ; D19 thermographie infrarouge (Q19) ; D20 photovoltaïque ; D32 cybersécurité. Système R (règle) / N (certificat d'installation) / Q (compte rendu de vérification) : Q18 électricité, Q19 thermographie (source secondaire). Textes non reproduits.","source_url":"https://www.cnpp.com/","statut":"V","date_verification":null,"note":"Intitulés vérifiés par le rapport sur le catalogue CNPP ; prix indicatifs R4 41 €, R5 45 €, R7 62 €. Le Q18 non levé est le pivot du recours du scénario (a)."},{"id":"ref-fm-datasheets","type":"referentiel","code":"FM Data Sheets","numero":"8-1, 8-9, 7-112, 5-33, 10-3, 10-7, 2-81, 3-26, 10-1","intitule":"Référentiel d'ingénierie prévention FM","resume":"8-1 Commodity Classification (lithium §2.4.2) ; 8-9 Storage of Class 1-4 and Plastic Commodities ; 7-112 Lithium-Ion Battery Manufacturing and Storage (octobre 2024) ; 5-33 stockage d'énergie (BESS) ; 10-3 Hot Work Management (permis de feu) ; 10-7 Fire Protection Impairment Management (Red Tag avec 2-81) ; 3-26 Nonstorage Occupancies ; 10-1 Emergency Response Planning. Gratuites sur inscription ; textes non reproduits. L'entreprise communique sous le nom « FM » depuis 2024.","source_url":"https://www.fmglobal.com/research-and-resources/fm-global-data-sheets","statut":"V","date_verification":null,"note":"Numéros vérifiés par le rapport. Repères lithium (sources secondaires) : état de charge 30-60 %, sprinkleurs en rack pour batteries usagées."},{"id":"ref-nfx31-620","type":"norme","code":"NF X31-620","numero":null,"intitule":"Sites et sols pollués — prestations de services","resume":"Norme française encadrant les prestations dans le domaine des sites et sols pollués (études, ingénierie, travaux), associée à la méthodologie nationale. Texte non reproduit.","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le dossier (fact-check n°26, parade DD EHS)."},{"id":"ref-astm-e1527","type":"norme","code":"ASTM E1527-21","numero":null,"intitule":"Phase I Environmental Site Assessment","resume":"Standard américain de l'audit environnemental de site Phase I (REC/CREC/HREC). Version E1527-21 : la version en vigueur reste à vérifier auprès de l'éditeur. Texte non reproduit.","source_url":"https://www.astm.org/","statut":"NV","date_verification":null,"note":"Le dossier (fact-check n°26) note « E1527-21 (à vérifier) »."},{"id":"ref-iso-17024","type":"norme","code":"ISO/IEC 17024","numero":null,"intitule":"Certification de personnes","resume":"Norme d'accréditation des organismes certifiant des personnes — cadre de l'EEA du CNPP (certification d'expert, valable 6 ans, spécialité Transport de marchandises incluse).","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le dossier (fact-check n°6)."},{"id":"ref-atex-2014-34","type":"directive","code":"Directive 2014/34/UE","numero":null,"intitule":"ATEX — matériels","resume":"Exigences applicables aux appareils et systèmes de protection destinés aux atmosphères explosibles.","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le lexique du dossier et l'auto-évaluation (Q20)."},{"id":"ref-atex-1999-92","type":"directive","code":"Directive 1999/92/CE","numero":null,"intitule":"ATEX — travailleurs","resume":"Prescriptions minimales de protection des travailleurs exposés aux atmosphères explosibles (zonage, DRPCE).","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le lexique du dossier (Q21)."},{"id":"ref-seveso","type":"directive","code":"Directive 2012/18/UE (Seveso III)","numero":null,"intitule":"Maîtrise des dangers liés aux accidents majeurs","resume":"Régime des établissements à risques d'accidents majeurs impliquant des substances dangereuses (seuil bas / seuil haut).","source_url":null,"statut":"V","date_verification":null,"note":"Citée par le lexique du dossier (Q23)."},{"id":"ref-csrd-omnibus","type":"directive","code":"Directive (UE) 2026/470 « Omnibus I »","numero":null,"intitule":"Réduction du périmètre CSRD","resume":"Adoptée le 24 février 2026, publiée au JOUE le 26 février 2026, en vigueur depuis le 18 mars 2026. Transposition du volet CSRD au plus tard le 19 mars 2027. Seuils cumulatifs : plus de 1 000 salariés ET plus de 450 M€ de CA. Recentre l'ESG sur les risques matériels.","source_url":null,"statut":"V","date_verification":null,"note":"Fact-check n°28 du dossier (sources bematerial/leto citées)."},{"id":"ref-icpe-1510","type":"rubrique_icpe","code":"Nomenclature ICPE","numero":"1510","intitule":"Entrepôts couverts","resume":"Rubrique des entrepôts couverts stockant des matières combustibles (régimes A/E/D selon volume et quantités).","source_url":"https://aida.ineris.fr/","statut":"V","date_verification":null,"note":"Citée par le dossier (lexique, auto-évaluation Q22, cas 4)."},{"id":"ref-icpe-2921","type":"rubrique_icpe","code":"Nomenclature ICPE","numero":"2921","intitule":"Tours aéroréfrigérantes","resume":"Rubrique des installations de refroidissement évaporatif par dispersion d'eau dans un flux d'air (risque légionelles).","source_url":"https://aida.ineris.fr/","statut":"V","date_verification":null,"note":"Citée par le lexique du dossier."},{"id":"ref-icpe-47xx","type":"rubrique_icpe","code":"Nomenclature ICPE","numero":"47xx","intitule":"Rubriques 4xxx — substances dangereuses","resume":"Famille de rubriques « substances » (séries 4000) issues de la transposition Seveso III ; le dossier cite la série 47xx (ex. produits pétroliers et assimilés).","source_url":"https://aida.ineris.fr/","statut":"NV","date_verification":null,"note":"Notation « 47xx » reprise telle quelle du dossier : préciser la rubrique exacte selon le produit."},{"id":"ref-opam","type":"texte_suisse","code":"OPAM","numero":null,"intitule":"Ordonnance sur la protection contre les accidents majeurs (CH)","resume":"Couvre entreprises, voies de communication et conduites. Démarche graduée : rapport succinct, puis étude de risque (courbe F-N) si nécessaire.","source_url":"https://www.fedlex.admin.ch/","statut":"V","date_verification":null,"note":"Fact-check n°19 et Partie 2/3 du dossier. Numéro RS à relever sur Fedlex (accès au texte bloqué pour les robots depuis cet environnement)."},{"id":"ref-osites","type":"texte_suisse","code":"OSites","numero":null,"intitule":"Ordonnance sur l'assainissement des sites pollués (CH)","resume":"Régit le cadastre des sites pollués et la démarche : investigation historique, puis technique, puis surveillance ou assainissement.","source_url":"https://www.fedlex.admin.ch/","statut":"V","date_verification":null,"note":"Citée par le dossier (Partie 2.5, cas 7)."},{"id":"ref-sdr-ocs","type":"texte_suisse","code":"SDR / OCS","numero":null,"intitule":"Transport de marchandises dangereuses par route (CH) / conseillers à la sécurité","resume":"La SDR rend l'ADR applicable au trafic national suisse ; l'OFROU délivre les autorisations pour les tunnels. L'OCS impose un conseiller à la sécurité pour le
