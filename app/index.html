érale à vérifier ; [H] hypothèse de modélisation. Aucun article, chiffre ou norme n'est ajouté hors sources.","_choix_par_defaut":"Point de vue : l'expert mandaté par l'assureur. Périmètre : France, IARD entreprises et transport. Modèle qualitatif (polarités, pas de magnitudes). Voir les 3 questions ouvertes (type « question »).","items":[{"id":"ms-synthese","type":"synthese","titre":"Le système en 10 phrases","marque":"mixte","contenu":["1. L'expert d'assurance est un capteur technique placé entre un assuré qui a perdu un bien ou un revenu et un assureur qui doit décider de payer ; il constate, établit la cause et chiffre, mais il ne décide pas de la garantie [S].","2. Son pouvoir vient du mandat de l'assureur, qui le paie ; sa valeur vient de l'opposabilité de ce qu'il établit, qui ne vaut que s'il a été contradictoire [S].","3. Quatre couches circulent en parallèle : le mandat (qui décide), la preuve (ce qui est établi), l'argent (prime, honoraires, indemnité, recours) et la responsabilité juridique (qui doit à qui) [H].","4. Trois horloges pèsent sur chaque dossier : la preuve qui se dégrade dès la première heure, la perte d'exploitation qui s'accumule tant que l'assuré est à l'arrêt, et les délais légaux — 3 jours, 1 an, 2 ans, et depuis 2026 les 6 mois de L.121-18 [S].","5. Le cœur du système est une boucle renforçante vertueuse : un contradictoire de qualité rend les preuves opposables, donc les recours réussissent, donc le coût net baisse et le mandant confie des dossiers plus complexes, ce qui forme l'expert [S pour le premier maillon, H pour la suite].","6. Sa jumelle vicieuse est la spirale du délai : plus le dossier traîne, plus l'arrêt dure, plus la perte d'exploitation et l'enjeu grossissent, plus le dossier devient conflictuel et lent [H].","7. La dépendance économique du cabinet à ses grands mandants crée une pression implicite sur les conclusions ; elle est désormais contrée par la transparence imposée par la loi du 26 mai 2026 : rapport définitif transmis à l'assuré et droit à contre-expertise [S pour la loi, H pour la dynamique].","8. Au-dessus des dossiers tourne une boucle lente de marché : sinistralité, ratio sinistres/primes, conditions d'assurance et exigences de prévention (APSAD, permis de feu, vérifications Q18), que les recours réussis et les règles proportionnelles alimentent [S partiel, C].","9. Les perturbations actuelles — consolidation des cabinets, automatisation des petits sinistres, sinistralité climatique, batteries lithium — augmentent l'enjeu moyen des dossiers humains et compriment le temps disponible pour établir la preuve [S pour les faits, H pour l'effet].","10. Un expert junior a le plus de prise là où le système est le plus sensible et le moins coûteux à protéger : les 72 premières heures (conservatoire, convocations exhaustives), la liste des mis en cause, l'horloge des délais et un rapport lisible par l'assuré [H, appuyé sur S]."],"statut":"NV","source_url":null,"date_verification":null,"note":"Modèle : synthèse, pas un fait."},{"id":"ms-frontiere","type":"frontiere","titre":"Frontière du système","marque":"H","dedans":["La vie d'un sinistre IARD d'entreprise ou de transport en France, de la survenance au dernier recours ou au jugement [H].","Tous les acteurs qui agissent SUR le dossier : assuré, courtier ou agent, assureur (souscription pour l'amont, gestion sinistres pour le dossier), cabinet et expert, expert d'assuré, sapiteurs et laboratoires, tiers responsables et leurs assureurs RC, entreprises de remise en état et de dépollution, autorités intervenant sur le sinistre, juge et expert judiciaire [H].","Les règles qui s'appliquent au dossier (Code des assurances, Code de commerce, contrat type, conventions, ADR, police) sont traitées comme des paramètres internes, car l'expert les mobilise à chaque étape [S]."],"bordure":["Réassureur : il agit sur les boucles lentes (capacité, prix, exigences) et sur les très gros dossiers, pas sur la conduite ordinaire d'un dossier [C].","ACPR : n'intervient pas dans un dossier, mais contrôle le respect des délais de L.121-18 par l'assureur, ce qui transmet une pression au cabinet [S]."],"dehors":["Le législateur et le juge en tant que producteurs de règles (la loi du 26 mai 2026 est une perturbation externe, pas une variable du modèle) [H].","Le marché du travail des experts, la technologie (IA, visio-expertise), le climat, la sinistralité sectorielle : environnement qui perturbe les boucles [H].","Assurance de personnes, automobile des particuliers, construction (dommages-ouvrage, décennale) et conventions inter-assureurs (IRSI) : logiques de règlement propres, hors du périmètre « risques d'entreprise et transport » visé [S pour IRSI, H pour l'exclusion]."],"pourquoi":"Critère retenu : un acteur est DEDANS s'il peut modifier le contenu, le délai ou l'issue d'un dossier donné ; il est EN BORDURE s'il agit seulement sur le flux de dossiers ou sur les règles d'exécution ; il est DEHORS s'il fixe les règles du jeu ou le volume de sinistres sans agir sur le dossier [H]. Ce critère correspond à l'horizon de décision de l'expert : le dossier.","statut":"NV","source_url":null,"date_verification":null,"note":"Hypothèse de modélisation."},{"id":"ms-act-assure","type":"acteur","titre":"Assuré (entreprise)","marque":"mixte","objectif":"Reprendre l'activité au plus vite et être indemnisé complètement, y compris de la perte d'exploitation [S].","crainte":"Refus de garantie, règle proportionnelle, franchise, délais ; perte de clients pendant l'arrêt [S pour les mécanismes, H pour la hiérarchie].","indicateur":"Délai de reprise, trésorerie, montant indemnisé [H].","lien_expert":"Source principale des pièces et des faits ; veut souvent déblayer et redémarrer avant le constat, ce qui menace la preuve [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-intermediaire","type":"acteur","titre":"Courtier (mandataire de l'assuré) ou agent général (mandataire de l'assureur)","marque":"mixte","objectif":"Garder le client et le portefeuille ; un sinistre bien réglé fidélise [S pour les statuts de mandataire, H pour l'objectif].","crainte":"Que le sinistre révèle une sous-assurance ou un défaut de conseil [C].","indicateur":"Rétention du portefeuille, ratio sinistres/primes du portefeuille [C].","lien_expert":"Pèse sur le délai et conteste volontiers une règle proportionnelle, qui peut pointer vers son propre conseil [H].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-souscription","type":"acteur","titre":"Assureur — souscription","marque":"mixte","objectif":"Tarifer juste et sélectionner les risques, avec l'aide du risk engineer [S].","crainte":"Sous-tarification, risques mal déclarés, cumuls (climat, entrepôts lithium) [S pour les cas, H pour la hiérarchie].","indicateur":"Ratio sinistres/primes (S/P), ratio combiné [S].","lien_expert":"Indirect : les constats d'expertise (déclarations inexactes, aggravation, non-conformités) devraient remonter vers la souscription [H].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-gestion","type":"acteur","titre":"Assureur — gestion sinistres","marque":"mixte","objectif":"Régler juste et dans les délais, maîtriser la charge et récupérer par les recours [S].","crainte":"Dérive des provisions, contentieux, dépassement des délais de L.121-18 et contrôle de l'ACPR [S].","indicateur":"Délais, écart entre réserve et règlement, recours exercés [S] ; coût d'expertise par dossier [H].","lien_expert":"MANDANT : choisit le cabinet, paie les honoraires, reçoit l'avis technique et DÉCIDE de la garantie [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-reassureur","type":"acteur","titre":"Réassureur (bordure)","marque":"C","objectif":"Protéger son capital et rémunérer le risque cédé [C].","crainte":"Sinistres majeurs et cumuls (événements climatiques, sinistres lithium) [C].","indicateur":"S/P du traité, exposition aux cumuls [C].","lien_expert":"Indirect ; sur les gros dossiers, attentes de qualité et de suivi [C].","statut":"NV","source_url":null,"date_verification":null,"note":"Le dossier mentionne la réassurance (Partie 2.1) sans détail : tout le reste est [C]."},{"id":"ms-act-cabinet","type":"acteur","titre":"Cabinet d'expertise","marque":"mixte","objectif":"Volume de missions, marge, place dans les panels des assureurs [H] ; le marché se consolide (Alkera–AM Group, Stelliant–HDE, acquisitions Saretec) [S].","crainte":"Perte d'un mandant, délais non tenus, turnover des experts [H].","indicateur":"Missions par an (ex. 450 000 annoncées par Saretec), délai moyen, chiffre d'affaires [S pour l'exemple].","lien_expert":"Employeur : répartit les dossiers, fixe la délégation et le tutorat du junior, forme (TEA à 3 ans) [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-expert","type":"acteur","titre":"Expert d'assurance (côté assureur)","marque":"S","objectif":"Constater, établir la cause, chiffrer, appliquer la police, préserver les recours, toujours de façon contradictoire [S].","crainte":"Erreur de causalité, rapport démonté par un contre-expert, dossier qui s'enlise, perte de confiance du mandant [S pour les risques, H pour leur poids].","indicateur":"Délais, écart entre réserve et règlement, recours exercés [S].","lien_expert":"Nœud central du modèle : il ne décide pas, mais ce qu'il établit conditionne toutes les décisions [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-expert-assure","type":"acteur","titre":"Expert d'assuré","marque":"S","objectif":"Maximiser l'indemnité de son client ; rémunéré au pourcentage, souvent via la garantie « honoraires » [S].","crainte":"Forclusion, refus de garantie, chiffrage minoré [H].","indicateur":"Indemnité obtenue [H].","lien_expert":"Contradicteur direct ; L.113-5-1 oblige désormais l'assureur à informer l'assuré de son droit à contre-expertise [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-sapiteur","type":"acteur","titre":"Sapiteurs et laboratoires","marque":"mixte","objectif":"Répondre à la question technique posée par l'expert [S].","crainte":"Protocole contesté, échantillon compromis [H].","indicateur":"Délai de rendu, reproductibilité [H].","lien_expert":"L'expert pose la question et fait accepter le protocole par les parties AVANT toute analyse destructive [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-tiers","type":"acteur","titre":"Tiers responsables (mainteneur, fabricant, transporteur, expéditeur, commissionnaire) et leurs assureurs RC","marque":"mixte","objectif":"Écarter ou limiter leur responsabilité : plafonds transport, faute partagée, clauses limitatives [S].","crainte":"Être mis en cause sur des constats opposables [H].","indicateur":"Montant du recours payé ou évité [H].","lien_expert":"Doivent être convoqués au contradictoire ; sinon les constats leur sont inopposables et le recours est fragilisé [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-reparation","type":"acteur","titre":"Entreprises de remise en état et de dépollution","marque":"mixte","objectif":"Obtenir le chantier et être payées [H].","crainte":"Retard de paiement, chantier arrêté pour préserver la preuve [H].","indicateur":"Délai entre accord et missionnement (1 mois au plus selon L.121-18) [S].","lien_expert":"Leurs devis servent de base au chiffrage (dépollution : aucun coût sourcé, uniquement sur devis) [S]. Certaines sont filiales de cabinets (ex. SOVEA, filiale de Stelliant) [S] : point de vigilance sur l'indépendance [H].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-autorites","type":"acteur","titre":"Autorités : préfet, DREAL, SDIS, OFB, ARS, police de l'eau, BEA-TT / BEA-RI","marque":"S","objectif":"Sécurité, protection de l'environnement, conformité (ICPE, LRE) [S].","crainte":"Atteinte au milieu, récidive [H].","indicateur":"Mesures prescrites, mises en demeure [S].","lien_expert":"Leurs actes créent des coûts (mesures d'urgence, dépollution imposée par le préfet au titre de la LRE) et des preuves (rapports SDIS, enquêtes BEA) ; une non-conformité relevée (ex. Grand-Couronne : site non autorisé) devient un enjeu de garantie [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-acpr","type":"acteur","titre":"ACPR (bordure)","marque":"S","objectif":"S'assurer que les pratiques des assureurs respectent les délais et obligations de L.121-18 [S].","crainte":"Pratiques non conformes à grande échelle [H].","indicateur":"Respect des délais ; mises en demeure possibles [S].","lien_expert":"Indirect : la pression passe par l'assureur vers le cabinet [H].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-act-juge","type":"acteur","titre":"Juge et expert judiciaire","marque":"mixte","objectif":"Trancher le litige / éclairer le juge ; mesure d'instruction possible avant tout procès (référé, art. 145 CPC) [S].","crainte":"— (hors logique économique du dossier) [H].","indicateur":"Rapport d'expertise judiciaire remis au juge [S].","lien_expert":"Quand l'amiable échoue, le dossier sort du canal ; la qualité du PV contradictoire amiable conditionne ce qui pourra être rejoué [H].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-flux-mandat","type":"flux","titre":"Couche 1 — Mandat et pouvoir de décision","marque":"mixte","contenu":["Assuré → assureur : déclaration du sinistre (au plus tard dans le délai du contrat, minimum 5 jours ouvrés, 2 en cas de vol) [S].","Assureur → cabinet → expert : mandat (périmètre : dommages directs, PE, recours) ; délégation de règlement éventuelle pour un junior [S].","Expert → assureur : AVIS technique (cause, chiffrage, position technique sur la garantie) — pas de décision [S].","Assureur → assuré : position de garantie, proposition d'indemnisation ou refus motivé (L.121-18) [S].","Assuré → expert d'assuré : mandat de défense ; assuré → contre-expert : contre-expertise à ses frais (L.113-5-1) [S].","Expert → sapiteur : question technique et protocole [S] ; juge → expert judiciaire : mission (art. 145 CPC) [S]."],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-flux-preuve","type":"flux","titre":"Couche 2 — Information et preuve","marque":"mixte","contenu":["Scène du sinistre → expert : constats, scellés, prélèvements — stock de preuve qui se dégrade [S pour les actes, H pour la dynamique].","Assuré → expert : pièces (police, comptabilité, maintenance, Q18/Q19, permis de feu, documents de transport) [S].","Toutes les parties ↔ expert : réunion et PV contradictoires, ce qui rend les constats opposables [S].","Sapiteur → expert : rapport d'analyse [S] ; autorités → expert : rapports SDIS, BEA-TT, fiches ARIA [S].","Expert → assureur : rapport préliminaire (avec provision) puis définitif [S] ; expert → assuré : rapport définitif (L.121-18 II) [S].","Gestion sinistres → souscription : retour d'expérience (aggravations, non-conformités, sous-assurance) — flux souvent faible [H]."],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-flux-argent","type":"flux","titre":"Couche 3 — Argent","marque":"mixte","contenu":["Assuré → assureur : prime ; assureur → réassureur : prime cédée ; réassureur → assureur : récupérations [S pour la réassurance, C pour le mécanisme].","Assureur → cabinet : honoraires d'expertise [S].","Assureur → assuré : acompte, indemnité immédiate puis différée (vétusté récupérable si reconstruction), sous 21 jours après accord [S] ; ou assureur → réparateur (réparation en nature, missionnement sous 1 mois) [S].","Assuré → expert d'assuré : honoraires au pourcentage, souvent remboursés par la garantie « honoraires » [S].","Assureur RC du tiers → assureur subrogé : recours (plafonné : 33 €/kg et 1 000 €/colis, 8,33 DTS/kg en CMR, etc.) [S]."],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-flux-responsabilite","type":"flux","titre":"Couche 4 — Responsabilité juridique","marque":"mixte","contenu":["Assureur → assuré : obligation de garantie (exclusions formelles et limitées, L.113-1) et délais de L.121-18, sinon intérêts au taux légal [S].","Tiers responsable → assuré : responsabilité contractuelle (mainteneur, C. civ. 1231-1) ou du fait des produits défectueux (fabricant, C. civ. 1245) [S, NV dans le rapport].","Assuré → assureur : subrogation après paiement (L.121-12) ; l'assureur est déchargé si l'assuré a rendu la subrogation impossible [S].","Tiers lésé → assureur RC : action directe (L.124-3) [S, NV] ; voiturier, commissionnaire, expéditeur : L.133-1, L.132-5/6, ADR 1.4 [S].","Courtier → assuré : devoir de conseil [C] ; expert → mandant : responsabilité professionnelle de l'expert [C]."],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-stocks","type":"stock","titre":"Stocks et délais","marque":"mixte","contenu":["Dossiers en cours (expert, cabinet) : entrée = missions, sortie = clôtures ; un événement climatique crée un pic d'entrée (mobilisation, renforts) [S pour la mobilisation, H pour la dynamique].","Provisions (réserves) : stock comptable de l'assureur, initialisé par la provision du rapport préliminaire ; l'écart réserve/règlement est un indicateur du métier [S].","Preuve disponible : stock qui DÉCROÎT avec le temps et les interventions (déblaiement, corrosion, intempéries, ré-inflammation des batteries lithium) [S pour les causes, H pour la décroissance].","Perte d'exploitation : stock de marge perdue qui croît pendant l'arrêt, borné par la période d'indemnisation (12-24 mois) et les frais supplémentaires limités à la marge qu'ils sauvent [S].","Horloges légales : déclaration 5 jours ouvrés (L.113-2) ; protestation 3 jours (L.133-3) ; réserves CMR 7 jours [NV] ; réponse de l'assureur 2 ou 6 mois puis paiement 21 jours (L.121-18) ; prescription 1 an en transport (L.133-6), action récursoire 1 mois, 2 ans en assurance (L.114-1), interrompue notamment par la désignation d'expert (L.114-2 [NV]) [S].","Réputation de l'expert auprès du mandant : stock lent à construire, rapide à perdre [H].","Compétence de l'expert : stock d'expérience (TEA après 3 ans, EEA 40 dossiers par an) [S]."],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-b-r1","type":"boucle","titre":"R1 — Dépendance au mandant","polarite":"R","marque":"H","chaine":"Volume de missions du mandant (+) → dépendance économique du cabinet (+) → pression implicite sur les conclusions (+) → confiance du mandant à court terme (+) → volume de missions.","lecture":"Renforçante : plus un cabinet dépend d'un assureur, plus il est tenté de lui plaire, ce qui augmente encore la dépendance. Elle n'est contenue que par B1 [H].","exemple":"Scénario (a) : qualifier la réserve Q18 non levée d'exclusion arrangerait le mandant à court terme — techniquement, ce n'est pas une exclusion sauf clause formelle et très apparente [S].","statut":"NV","source_url":null,"date_verification":null,"note":"Hypothèse non mesurée.","noeuds":["VOL","DEP","PRE","CON"]},{"id":"ms-b-b1","type":"boucle","titre":"B1 — Contrôle par l'opposabilité","polarite":"B","marque":"mixte","chaine":"Pression sur les conclusions (−) → solidité du rapport (−) → contestation et contre-expertise (+) → coût net du sinistre (−) → confiance du mandant (+) → volume → dépendance → pression.","lecture":"Équilibrante : un rapport biaisé se fait démonter (expert d'assuré, contre-expert, juge), ce qui coûte au mandant et rend la neutralité rentable. La loi du 26 mai 2026 la renforce : rapport définitif transmis à l'assuré (L.121-18) et droit à contre-expertise notifié (L.113-5-1) [S pour la loi, H pour la boucle].","exemple":"Un chiffrage minoré de la PE du scénario (a) (1 379 927 €) serait recalculé ligne à ligne par l'expert d'assuré : tendance, plafonnement des frais supplémentaires, franchise en jours [S pour les chiffres].","statut":"NV","source_url":null,"date_verification":null,"note":null,"noeuds":["PRE","SOL","CTR","CNS","CON","VOL","DEP"]},{"id":"ms-b-r2","type":"boucle","titre":"R2 — Contradictoire, recours, confiance (boucle vertueuse)","polarite":"R","marque":"mixte","chaine":"Qualité du contradictoire (+) → opposabilité des preuves (+) → succès des recours (−) → coût net du sinistre (−) → confiance du mandant (+) → volume de dossiers complexes (+) → expérience de l'expert (+) → qualité du contradictoire.","lecture":"Renforçante : le premier maillon est sourcé (sans contradictoire, constatations inopposables et recours fragilisé) ; la suite est une hypothèse de dynamique de carrière [S puis H].","exemple":"Scénario (a) : le mainteneur et son assureur RC convoqués avant le démontage de l'armoire ; le PV signé rend le constat d'échauffement opposable, le recours subrogatoire devient négociable [S].","statut":"NV","source_url":null,"date_verification":null,"note":null,"noeuds":["QCT","OPP","REC","CNS","CON","VOL","EXP"]},{"id":"ms-b-r3","type":"boucle","titre":"R3 — Spirale du délai","polarite":"R","marque":"H","chaine":"Délai de traitement (+) → durée d'arrêt de l'assuré (+) → perte d'exploitation (+) → montant en jeu et complexité (+) → délai de traitement.","lecture":"Renforçante vicieuse : plus l'enjeu monte, plus chaque partie s'arme (experts, analyses, avocats), ce qui rallonge encore. Effet de bord : le délai dégrade aussi la preuve [H].","exemple":"Atelier de décolletage à l'arrêt : chaque mois d'arrêt ajoute de la marge brute perdue sur un CA de référence de 8 M€ ; la tentation de redémarrer vite pousse à déblayer avant constat [S pour les chiffres, H pour la dynamique].","statut":"NV","source_url":null,"date_verification":null,"note":null,"noeuds":["DEL","ARR","PEX","ENJ"]},{"id":"ms-b-b2","type":"boucle","titre":"B2 — Mesures conservatoires et frais supplémentaires","polarite":"B","marque":"S","chaine":"Perte d'exploitation (+) → mesures conservatoires et frais supplémentaires d'exploitation (−) → durée d'arrêt (+) → perte d'exploitation.","lecture":"Équilibrante : sous-traiter, louer, accélérer coûte, mais sauve de la marge ; la règle « frais admis dans la limite de la marge qu'ils sauvent » est précisément ce régulateur [S].","exemple":"Scénario (a) : 250 000 € de frais supplémentaires qui sauvent 462 000 € de marge brute — limite économique respectée, frais retenus en totalité [S].","statut":"V","source_url":null,"date_verification":null,"note":null,"noeuds":["ARR","PEX","CSV"]},{"id":"ms-b-b3","type":"boucle","titre":"B3 — Horloge légale (L.121-18)","polarite":"B","marque":"mixte","chaine":"Délai écoulé (+) → pression des délais légaux et de l'ACPR (−) → délai de traitement. Effet de bord : pression (−) → solidité du rapport.","lecture":"Équilibrante : l'échéance de 6 mois (2 mois sans expert) force une proposition ou un acompte motivé. La soupape prévue par le texte, l'acompte motivé, évite de sacrifier la preuve au délai [S] ; le risque de rapports bâclés reste une hypothèse [H].","exemple":"Scénario (c) : analyses en laboratoire des palettes de batteries plus longues que 6 mois → acompte motivé plutôt que conclusion prématurée sur la cause [S pour le mécanisme].","statut":"NV","source_url":null,"date_verification":null,"note":"Application de L.121-18 suspendue au décret selon les commentateurs [NV].","noeuds":["DEL","HOR"]},{"id":"ms-b-b4","type":"boucle","titre":"B4 — Sinistralité, prime, prévention","polarite":"B","marque":"mixte","chaine":"Sinistralité (+) → ratio sinistres/primes (+) → conditions d'assurance : prime, franchises, exigences (+) → prévention : APSAD, permis de feu, vérifications Q18 (−) → sinistralité.","lecture":"Équilibrante et lente (échelle de l'échéance annuelle). Les recours réussis allègent le coût net et donc le S/P : le travail de l'expert nourrit cette boucle [S pour les éléments, C pour la dynamique].","exemple":"Risk engineering : face à un directeur réticent, raisonner en coût total du risque et rappeler l'effet sur les conditions d'assurance, sans menace [S].","statut":"NV","source_url":null,"date_verification":null,"note":null,"noeuds":["SIN","SP","CND","PRV"]},{"id":"ms-b-b5","type":"boucle","titre":"B5 — La règle proportionnelle comme signal","polarite":"B","marque":"H","chaine":"Sous-assurance révélée (+) → réajustement des capitaux et des conditions (−) → sous-assurance.","lecture":"Équilibrante : une règle proportionnelle appliquée est douloureuse, contestée (courtier, expert d'assuré) puis corrigée à l'échéance. Elle fait aussi monter la contestation dans le dossier en cours [H].","exemple":"Scénario (a) : matériel déclaré 4,0 M€ pour 5,0 M€ réels → coefficient 0,80 ; 864 000 € au lieu de 1 080 000 € en immédiat sur ce poste [S].","statut":"NV","source_url":null,"date_verification":null,"note":null,"noeuds":["SOUS","CND"]},{"id":"ms-tension-independance","type":"tension","titre":"Indépendance technique contre mandat payé par l'assureur","marque":"mixte","contenu":"L'expert est payé par celui qui décide de payer ; il reste indépendant : il constate et évalue, il ne décide pas [S]. La pression est structurelle (R1), pas morale [H].","exemple":"Scénario (a) : la réserve Q18 non levée n'est pas une exclusion sauf clause formelle et très apparente ; elle peut en revanche réduire le recours contre le mainteneur (faute partagée) [S]. Le dire, c'est servir le mandant à long terme.","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-tension-rapidite","type":"tension","titre":"Rapidité contre solidité de la preuve","marque":"mixte","contenu":"Tout pousse à aller vite (PE, assuré, L.121-18) alors que la preuve exige convocations, scellés et protocoles acceptés [S]. Le contradictoire lui-même rallonge le délai [H].","exemple":"Batteries lithium : évacuer vite les palettes sinistrées limite la ré-inflammation (Grand-Couronne : reprise du feu vers 3 h), mais les palettes intactes doivent être analysées contradictoirement avant destruction [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-tension-cout","type":"tension","titre":"Coût d'expertise contre enjeu du dossier","marque":"mixte","contenu":"Les moyens (déplacement, sapiteur, laboratoire) doivent rester proportionnés à l'enjeu ; d'où l'automatisation des petits sinistres et la visio-expertise [S pour la tendance, H pour l'arbitrage].","exemple":"Palette abîmée en CMR : le recours est plafonné à 8,33 DTS/kg ; pour un petit envoi, un déplacement coûte plus que le recours possible. Pour le scénario (a) (plus de 4 M€ en jeu), un laboratoire se justifie sans débat [S pour les plafonds et montants].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-tension-position","type":"tension","titre":"Position technique contre décision de garantie","marque":"S","contenu":"L'expert rend une position technique motivée ; la décision de garantie appartient à l'assureur [S].","exemple":"Scénario (b) : l'expert établit la vitesse, le taux de remplissage et le ballant de la citerne ; la question « la RC automobile couvre-t-elle la pollution ? » relève de l'assureur [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-tension-delai-verite","type":"tension","titre":"Délai légal contre vérité technique","marque":"mixte","contenu":"Six mois peuvent ne pas suffire à établir une cause ; le texte prévoit alors un acompte motivé ou un refus motivé d'acompte [S]. Utiliser la soupape plutôt que conclure trop tôt [H].","exemple":"Fillinges (BEA-TT 2023-03) : même l'enquête publique a affaibli sa conclusion entre le rapport annuel (« très vraisemblablement électrique ») et le rapport final (« origine pas pu être déterminée ») [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-01","type":"etape_cycle","ordre":1,"titre":"Survenance et urgence","marque":"mixte","moteur":"Assuré, SDIS, autorités","livrable":"Alerte, mesures d'urgence, premiers rapports (SDIS)","rupture":"Déblaiement ou réparation avant constat ; ré-inflammation des batteries lithium [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-02","type":"etape_cycle","ordre":2,"titre":"Déclaration","marque":"S","moteur":"Assuré (souvent via le courtier)","livrable":"Déclaration de sinistre (minimum légal 5 jours ouvrés, 2 en cas de vol)","rupture":"Déclaration tardive : déchéance seulement si l'assureur prouve un préjudice ; circonstances nouvelles non déclarées [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-03","type":"etape_cycle","ordre":3,"titre":"Ouverture et mandat","marque":"mixte","moteur":"Gestionnaire sinistres","livrable":"Mission au cabinet ; ouverture du compteur L.121-18","rupture":"Mandat flou (dommages directs seuls alors que PE et recours sont en jeu) ; conflit d'intérêts non vérifié [S pour le contrôle, H pour le flou].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-04","type":"etape_cycle","ordre":4,"titre":"Contact et mesures conservatoires","marque":"S","moteur":"Expert","livrable":"Courrier de préconisations ; preuves préservées","rupture":"Contact tardif (usage : 24 à 72 h [NV]) ; preuves perdues avant le constat [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-05","type":"etape_cycle","ordre":5,"titre":"Contradictoire","marque":"S","moteur":"Expert","livrable":"Convocations tracées, PV de constatations, scellés","rupture":"Un mis en cause ou son assureur oublié : constats inopposables, recours fragilisé [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-06","type":"etape_cycle","ordre":6,"titre":"Analyses","marque":"S","moteur":"Sapiteur, laboratoire","livrable":"Protocole accepté, puis rapport d'analyse","rupture":"Analyse destructive sans accord des parties [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-07","type":"etape_cycle","ordre":7,"titre":"Garantie et provision","marque":"S","moteur":"Assureur (décision) sur l'avis technique de l'expert","livrable":"Rapport préliminaire (circonstances, garantie apparente, provision) ; position ou réserves","rupture":"L'expert qui « décide » la garantie ; provision incohérente [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-08","type":"etape_cycle","ordre":8,"titre":"Chiffrage","marque":"S","moteur":"Expert, avec l'assuré (et son expert)","livrable":"État de pertes, PV de chiffrage ou lettre d'acceptation","rupture":"Franchise avant la règle proportionnelle ; stock au prix de vente ; TVA récupérable indemnisée ; frais supplémentaires non plafonnés [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-09","type":"etape_cycle","ordre":9,"titre":"Proposition et règlement","marque":"S","moteur":"Assureur","livrable":"Proposition ou refus motivé (6 mois avec expert, 2 sans), acompte motivé, paiement sous 21 jours","rupture":"Dépassement : intérêts au taux légal, contrôle de l'ACPR [S].","statut":"V","source_url":null,"date_verification":null,"note":"Décret d'application de L.121-18 [NV]."},{"id":"ms-cyc-10","type":"etape_cycle","ordre":10,"titre":"Rapport définitif","marque":"S","moteur":"Expert","livrable":"Rapport définitif transmis à l'assureur ET à l'assuré","rupture":"Rapport illisible ou mal motivé : contre-expertise (L.113-5-1), contentieux [S pour les textes, H pour l'effet].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-11","type":"etape_cycle","ordre":11,"titre":"Recours","marque":"S","moteur":"Assureur subrogé","livrable":"Quittance subrogative, fiche recours, mise en cause du tiers","rupture":"Prescription (1 an en transport, 1 mois pour l'action récursoire) ; renonciation à recours dans un bail ou un contrat ; faute partagée [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cyc-12","type":"etape_cycle","ordre":12,"titre":"Litige (branche éventuelle)","marque":"mixte","moteur":"Juge, expert judiciaire","livrable":"Référé-expertise (art. 145 CPC), rapport judiciaire","rupture":"Un PV amiable faible fait tout rejouer [H].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-pert-loi","type":"perturbation","titre":"Loi du 26 mai 2026 (L.113-5-1, L.121-18)","marque":"mixte","contenu":"Renforce B1 (rapport transmis à l'assuré, contre-expertise notifiée) et donc affaiblit R1 ; crée B3 (horloge légale contrôlée par l'ACPR) [S pour les textes, H pour les effets]. Effet de bord possible : la pression du délai sur la solidité des rapports, contenue par l'acompte motivé [H].","boucles":["ms-b-b1","ms-b-r1","ms-b-b3"],"statut":"NV","source_url":null,"date_verification":null,"note":"L.113-5-1 et L.121-18 vérifiés verbatim (édition DILA) ; décret de L.121-18 [NV]."},{"id":"ms-pert-consolidation","type":"perturbation","titre":"Consolidation des cabinets","marque":"mixte","contenu":"Rapprochements (Alkera–AM Group et INCOFRI, Stelliant–HDE, acquisitions Saretec) et intégration verticale (enquête : INQUEST ; dépollution : SOVEA) [S]. Effets supposés : capacité d'investissement et spécialités accrues ; dépendance réciproque grands assureurs / grands cabinets (R1) ; vigilance d'indépendance quand le cabinet a une filiale de travaux [H].","boucles":["ms-b-r1","ms-b-r2"],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-pert-automatisation","type":"perturbation","titre":"Automatisation des petits sinistres","marque":"mixte","contenu":"L'IA automatise les petits sinistres et valorise les experts sur les dossiers complexes [S]. Effets supposés : enjeu moyen plus élevé des dossiers humains (R3 plus forte), moins de dossiers « d'apprentissage » pour les juniors, ce qui ralentit le maillon expérience de R2 [H].","boucles":["ms-b-r3","ms-b-r2"],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-pert-climat","type":"perturbation","titre":"Sinistralité climatique","marque":"mixte","contenu":"Mobilisation des experts lors des catastrophes naturelles, co-entreprise climatique Geoya (Saretec), décret sécheresse 2024-1101, prescription de 5 ans pour la sécheresse-réhydratation (L.114-1) [S]. Effets supposés : pics de stock de dossiers, délais allongés (R3) sous horloge légale (B3), durcissement des conditions (B4) [H].","boucles":["ms-b-r3","ms-b-b3","ms-b-b4"],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-pert-lithium","type":"perturbation","titre":"Batteries lithium","marque":"mixte","contenu":"Emballement thermique et ré-inflammation, dépollution sur plusieurs années, non-conformités ICPE (Grand-Couronne, ARIA 60243), défaut de télésurveillance (Viviez, ARIA 61711), FM DS 7-112, nouveaux numéros ONU dans l'ADR 2027 [S]. Effets supposés : preuve dangereuse et très périssable (tension rapidité/preuve), montants en hausse (R3), garantie discutée sur la conformité (tension position/décision), durcissement de la souscription (B4) [H].","boucles":["ms-b-r3","ms-b-b4"],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-levier-72h","type":"levier","sens":"valeur","titre":"Les 72 premières heures","marque":"mixte","contenu":"Conservatoire et convocations exhaustives : c'est l'entrée de R2, et le moment où la preuve vaut le plus [S pour les actes, H pour le poids].","exemple":"Scénario (a) : armoire électrique sous scellés avant tout démontage ; mainteneur et son assureur convoqués par écrit [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-levier-mis-en-cause","type":"levier","sens":"valeur","titre":"La liste des mis en cause (chaîne ADR × chaîne contractuelle)","marque":"S","contenu":"Croiser qui a rempli, chargé, arrimé avec qui est contractuellement responsable : la compétence différenciante d'un profil conseiller TMD [S].","exemple":"Scénario (b) : recours de l'assureur RC automobile contre le remplisseur si le taux de remplissage n'était pas conforme [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-levier-horloge","type":"levier","sens":"valeur","titre":"L'horloge tenue dès J0","marque":"S","contenu":"Déclaration, protestation de 3 jours, réserves, L.121-18, prescriptions : une échéance ratée est irréversible [S].","exemple":"Scénario (c) : recours CMR prescrit par 1 an ; action récursoire en 1 mois [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-levier-provision","type":"levier","sens":"valeur","titre":"Une provision juste dès le rapport préliminaire","marque":"S","contenu":"L'écart réserve/règlement est un indicateur du métier ; une provision cohérente stabilise la relation avec le mandant [S].","exemple":"Scénario (a) : provisionner dommages directs et PE séparément (2 329 000 € immédiat, 585 000 € différé, PE 1 379 927 €) [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-levier-redaction","type":"levier","sens":"valeur","titre":"Un rapport lisible par l'assuré","marque":"mixte","contenu":"Faits, constats, analyse, chiffre, provision ; cause établie distinguée de la cause présumée. C'est le meilleur amortisseur de B1 depuis L.121-18 et L.113-5-1 [S pour la trame et la loi, H pour l'effet].","exemple":"Fillinges : écrire « origine non déterminée » quand c'est le cas, plutôt qu'une cause probable non démontrée [S].","statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-echec-demontage","type":"levier","sens":"echec","titre":"Laisser démonter ou déblayer avant le constat","marque":"S","contenu":"Le recours meurt et l'assureur peut être déchargé envers l'assuré si la subrogation devient impossible de son fait (L.121-12) [S].","exemple":"Électricien de l'assuré qui démonte l'armoire pour relancer la production [H, cas type].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-echec-cause","type":"levier","sens":"echec","titre":"Affirmer une cause non démontrée","marque":"S","contenu":"La « negative corpus » (conclure par élimination) est désapprouvée par la NFPA 921 ; un rapport affirmatif sans preuve se fait démonter [S].","exemple":"Conclure « cause électrique » sur la seule localisation de l'armoire, sans arc mapping ni analyse [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-echec-delai","type":"levier","sens":"echec","titre":"Rater un délai court","marque":"S","contenu":"Protestation de 3 jours (jours fériés non compris), réserves CMR, prescription de 1 an en transport [S].","exemple":"Palette signée « sans réserve » à la livraison : action éteinte pour avarie ou perte partielle [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-echec-calcul","type":"levier","sens":"echec","titre":"Une erreur de méthode de chiffrage","marque":"S","contenu":"Franchise avant la règle proportionnelle, stock au prix de vente, TVA récupérable indemnisée, frais supplémentaires non plafonnés [S].","exemple":"Scénario (a) : appliquer la règle proportionnelle au bâtiment correctement déclaré [S].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-echec-decision","type":"levier","sens":"echec","titre":"Confondre position technique et décision de garantie","marque":"S","contenu":"L'expert qui annonce un refus ou un accord engage le mandant à sa place [S].","exemple":"Dire à l'assuré « c'est exclu » à propos de la réserve Q18 en réunion [S pour la règle].","statut":"V","source_url":null,"date_verification":null,"note":null},{"id":"ms-cas-test","type":"cas_test","titre":"Test du modèle : incendie d'un atelier industriel, recours contre le mainteneur (scénario a, FICTIF)","marque":"mixte","contenu":["Faits [S, fictif] : PME de décolletage, 40 salariés, feu nocturne sur l'armoire électrique d'un tour multibroche. Le rapport Q18 signalait un échauffement non levé et le contrat de maintenance couvrait les armoires. Enjeu : 2 329 000 € immédiat, 585 000 € différé, PE 1 379 927 €.","J0-J3, boucles qui s'activent : R3 démarre (l'atelier est à l'arrêt, chaque jour ajoute de la marge perdue) ; B2 s'enclenche si l'expert pousse les frais supplémentaires (sous-traitance) ; l'entrée de R2 se joue maintenant (scellés, convocation du mainteneur et de son assureur RC) [S/H].","Déraillement n°1 : l'électricien de l'assuré démonte l'armoire pour relancer une ligne → preuve détruite, recours mort, assureur potentiellement déchargé (L.121-12) [S].","Déraillement n°2 : le mainteneur n'est pas convoqué ou son assureur est oublié → PV inopposable, le recours glisse vers une expertise judiciaire (branche 12) [S].","Semaines 2-8 : analyses de l'armoire sous protocole accepté ; tension rapidité/preuve. B3 n'est pas encore contraignant (6 mois) ; R1/B1 apparaissent si le mandant suggère que la réserve Q18 « exclut » [S/H].","Déraillement n°3 : l'expert qualifie la réserve Q18 d'exclusion → position technique fausse (pas d'exclusion sans clause formelle et très apparente), contestation par l'expert d'assuré et contre-expertise (B1) [S].","Chiffrage : B5 s'active — le matériel est sous-assuré (coefficient 0,80) ; le courtier et l'expert d'assuré contestent. Déraillement n°4 : appliquer la règle proportionnelle au bâtiment, ou la franchise avant la règle [S].","Règlement : horloge L.121-18 (si applicable) — proposition ou acompte motivé avant 6 mois, paiement sous 21 jours après accord, rapport définitif transmis à l'assuré [S].","Recours : subrogation après paiement ; fondement contractuel contre le mainteneur (1231-1 C. civ.), obligation de moyens ou de résultat selon le contrat [S, NV]. Déraillement n°5 : la réserve Q18 non levée réduit le recours (faute partagée de l'assuré) ; une clause limitative ou une renonciation à recours dans le contrat de maintenance peut le plafonner — à vérifier dans le contrat [S pour la renonciation, C pour la clause limitative].","Effet sur le marché (B4) : recours réussi → coût net réduit → S/P ; la non-levée de la réserve Q18 devient un sujet de prévention à l'échéance [C/H].","Verdict du test : le modèle explique où le dossier se gagne (72 h, convocations, rapport lisible) et où il se perd (démontage, oubli d'un mis en cause, confusion position/décision, erreur de calcul). Il ne dit rien du montant final du recours : cela dépend du contrat de maintenance, hors des sources [H]."],"statut":"fictif","source_url":null,"date_verification":null,"note":"Montants : scénario (a) du rapport, fictif."},{"id":"ms-limites","type":"limite","titre":"Limites du modèle","marque":"mixte","contenu":["Qualitatif : polarités sans magnitudes ni délais chiffrés ; aucune boucle n'est mesurée [H].","Un seul mandant assureur : coassurance, apérition, programmes internationaux master/local et grands risques sont simplifiés [H].","R1, B1, R2 (au-delà du premier maillon), R3 et B5 sont des hypothèses de dynamique, plausibles mais non sourcées [H].","Le rôle du réassureur, du courtier (devoir de conseil) et la responsabilité professionnelle de l'expert relèvent de la connaissance générale à vérifier [C].","B3 dépend du décret d'application de L.121-18, dont la publication n'est pas vérifiée [NV].","Plusieurs fondements de recours sont [NV] dans le rapport (L.124-3, L.132-5/6, L.133-8, 1231-1 et 1245 C. civ., CMR art. 30/32, ICC) : à contrôler avant de les citer.","Construction, automobile, conventions inter-assureurs et assurance de personnes sont hors frontière.","Les comportements individuels (éthique, compétence) sont traités comme des variables, non comme des choix : le modèle décrit des pressions, pas des fautes [H]."],"statut":"NV","source_url":null,"date_verification":null,"note":null},{"id":"ms-questions","type":"question","titre":"Les 3 questions posées (et le choix par défaut retenu)","marque":"H","contenu":["1. Point de vue : modéliser seulement l'expert mandaté par l'assureur, ou aussi l'expert d'assuré comme second système ? — Par défaut : côté assureur, l'expert d'assuré étant un acteur externe.","2. Périmètre : inclure les grands risques internationaux (coassurance, programmes master/local, réassurance active) ? — Par défaut : non, focus PME/ETI France et transport.","3. Profondeur : rester qualitatif, ou chiffrer les boucles (stocks et flux simulés, par exemple la spirale du délai avec les chiffres du scénario a) ? — Par défaut : qualitatif, simulation possible ensuite."],"statut":"NV","source_url":null,"date_verification":null,"note":"Réponds à ces questions pour faire évoluer le modèle."},{"id":"ms-oral","type":"oral","titre":"Version orale — 3 minutes devant un directeur d'agence","marque":"mixte","contenu":["« Je vois le métier comme un système où l'expert ne décide pas, mais où presque toutes les décisions dépendent de ce qu'il établit. Il est mandaté et payé par l'assureur ; sa valeur, c'est l'opposabilité de ses constats. »","« Dans un dossier, quatre choses circulent en même temps : le mandat — qui décide —, la preuve — ce qui est établi —, l'argent — indemnité, honoraires, recours — et la responsabilité — qui doit quoi à qui. Le métier consiste à garder ces quatre couches alignées. »","« Trois horloges tournent dès la première heure. La preuve se dégrade : déblaiement, corrosion, et avec les batteries lithium, la ré-inflammation. La perte d'exploitation s'accumule tant que l'assuré est à l'arrêt. Et les délais légaux courent : trois jours pour protester en transport, un an de prescription, deux ans en assurance, et depuis la loi du 26 mai 2026, six mois pour proposer ou motiver un acompte. »","« Le cœur du système, c'est une boucle vertueuse : un contradictoire propre rend les preuves opposables ; les recours réussissent ; le coût net baisse ; le mandant confie des dossiers plus complexes, et l'expert progresse. Sa jumelle vicieuse, c'est la spirale du délai : plus un dossier traîne, plus l'arrêt dure, plus l'enjeu monte et plus il devient conflictuel. »","« Il y a une tension structurelle : l'expert est payé par celui qui décide de payer. La loi de 2026 la rééquilibre : le rapport définitif est transmis à l'assuré, et l'assuré est informé de son droit à contre-expertise. Un rapport biaisé ne tient plus ; un rapport lisible et solide devient un actif pour l'assureur. »","« Concrètement, sur un incendie d'atelier avec un recours contre le mainteneur, le dossier se gagne dans les 72 premières heures : scellés sur l'armoire, mainteneur et son assureur convoqués avant tout démontage. Il se perd si l'électricien démonte pour redémarrer, si un mis en cause est oublié, ou si l'on qualifie d'exclusion une réserve de vérification électrique non levée — ce n'en est pas une sans clause formelle ; en revanche elle réduira le recours. »","« C'est là qu'un junior apporte le plus : tenir l'horloge dès le premier jour, dresser la liste complète des mis en cause — mon expérience de conseiller transport de matières dangereuses m'aide à croiser la chaîne ADR et la chaîne contractuelle —, provisionner juste et écrire un rapport que l'assuré comprend. »"],"statut":"NV","source_url":null,"date_verification":null,"note":"Environ 3 minutes à débit posé. S'entraîner avec le chrono de l'onglet."},{"id":"ms-diag-boucles","type":"diagramme","titre":"Diagramme de boucles causales (23 nœuds)","marque":"H","legende":"Flèche pleine = polarité (+) (même sens) ; flèche rouge pointillée = polarité (−) (sens contraire). R1 dépendance au mandant ; B1 contrôle par l'opposabilité ; R2 contradictoire-recours-confiance ; R3 spirale du délai ; B2 conservatoire et frais supplémentaires ; B3 horloge légale ; B4 sinistralité-prime-prévention ; B5 règle proportionnelle comme signal.","mermaid":"flowchart TB\n  VOL[\"Volume de missions<br/>du mandant\"]\n  DEP[\"Dépendance économique<br/>du cabinet\"]\n  PRE[\"Pression implicite<br/>sur les conclusions\"]\n  CON[\"Confiance du mandant<br/>(réputation de l'expert)\"]\n  SOL[\"Solidité du rapport\"]\n  CTR[\"Contestation,<br/>contre-expertise\"]\n  CNS[\"Coût net du sinistre<br/>pour l'assureur\"]\n  EXP[\"Expérience<br/>de l'expert\"]\n  QCT[\"Qualité du<br/>contradictoire\"]\n  OPP[\"Opposabilité<br/>des preuves\"]\n  REC[\"Succès<br/>des recours\"]\n  DEL[\"Délai de<br/>traitement\"]\n  DEG[\"Dégradation<br/>des preuves\"]\n  ARR[\"Durée d'arrêt<br/>de l'assuré\"]\n  PEX[\"Perte<br/>d'exploitation\"]\n  ENJ[\"Montant en jeu,<br/>complexité\"]\n  CSV[\"Conservatoire et<br/>frais supplémentaires\"]\n  HOR[\"Pression des délais<br/>légaux (L.121-18, ACPR)\"]\n  SIN[\"Sinistralité\"]\n  SP[\"Ratio<br/>sinistres / primes\"]\n  CND[\"Conditions d'assurance<br/>(prime, capitaux, exigences)\"]\n  PRV[\"Prévention (APSAD,<br/>permis de feu, Q18)\"]\n  SOUS[\"Sous-assurance<br/>(règle proportionnelle)\"]\n  VOL -->|\"(+)\"| DEP\n  DEP -->|\"(+)\"| PRE\n  PRE -->|\"(+)\"| CON\n  CON -->|\"(+)\"| VOL\n  CTR -->|\"(+)\"| CNS\n  VOL -->|\"(+)\"| EXP\n  EXP -->|\"(+)\"| QCT\n  QCT -->|\"(+)\"| OPP\n  OPP -->|\"(+)\"| REC\n  OPP -->|\"(+)\"| SOL\n  QCT -->|\"(+)\"| DEL\n  DEL -->|\"(+)\"| DEG\n  DEL -->|\"(+)\"| ARR\n  ARR -->|\"(+)\"| PEX\n  PEX -->|\"(+)\"| ENJ\n  ENJ -->|\"(+)\"| DEL\n  PEX -->|\"(+)\"| CSV\n  PEX -->|\"(+)\"| CNS\n  DEL -->|\"(+)\"| HOR\n  CNS -->|\"(+)\"| SP\n  SIN -->|\"(+)\"| SP\n  SP -->|\"(+)\"| CND\n  CND -->|\"(+)\"| PRV\n  SOUS -->|\"(+)\"| CTR\n  SOUS -->|\"(+)\"| CND\n  ENJ -->|\"(+)\"| CTR\n  PRE -->|\"(−)\"| SOL\n  SOL -->|\"(−)\"| CTR\n  CNS -->|\"(−)\"| CON\n  REC -->|\"(−)\"| CNS\n  DEG -->|\"(−)\"| OPP\n  CSV -->|\"(−)\"| ARR\n  HOR -->|\"(−)\"| DEL\n  HOR -->|\"(−)\"| SOL\n  PRV -->|\"(−)\"| SIN\n  CND -->|\"(−)\"| SOUS\n  classDef relation fill:#e8f0fe,stroke:#1f5fbf,color:#0b1b33\n  classDef preuve fill:#fdf2e9,stroke:#b45309,color:#3b1d02\n  classDef marche fill:#ecfdf3,stroke:#15803d,color:#052e re\"]\n    j1[\"Référé-expertise<br/>(art. 145 CPC)\"]\n  end\n  s0 --> au1\n  s0 --> s1\n  s1 --> a1\n  a1 --> e1\n  e1 --> e2\n  e2 --> e3\n  e2 --> t1\n  e3 --> l1\n  l1 --> e4\n  e4 --> a2\n  a2 --> e5\n  e5 --> a3\n  e5 --> e6\n  a3 --> s9\n  s9 --> a4\n  a4 --> a5\n  a5 --> t2\n  au1 -.->|preuves et coûts| e1\n  e1 -.->|rupture : preuve détruite| j1\n  e2 -.->|rupture : mis en cause oublié| j1\n  t2 -.->|contestation| j1\n  linkStyle 18,19,20 stroke:#b91c1c,stroke-width:2px,stroke-dasharray:5 3","statut":"NV","source_url":null,"date_verification":null,"note":"Le tableau du cycle de vie détaille acteur moteur, livrable et rupture pour les 12 étapes."}]}}</script>

<script>
/* Moteur de calcul — source unique des formules côté application.
   Également chargé par Node pour les tests (résultats identiques app/Excel). */
(function (root) {
  'use strict';

  function round2(x) { return Math.round(x * 100) / 100; }

  const CalcEngine = {

    /** Règle proportionnelle de capitaux (L.121-5). */
    rpCapitaux({ dommage, declare, reel }) {
      const coeff = reel > 0 ? Math.min(1, declare / reel) : 1;
      return { coeff: round2(coeff), indemnite: round2(Math.min(dommage, dommage * coeff)) };
    },

    /** Règle proportionnelle de prime (L.113-9). */
    rpPrime({ dommage, prime_payee, prime_due }) {
      if (!prime_due) return { coeff: null, indemnite: null };
      const coeff = Math.min(1, prime_payee / prime_due);
      return { coeff: round2(coeff), indemnite: round2(Math.min(dommage, dommage * coeff)) };
    },

    /** Chaîne VàN → vétusté → RP → franchise → plafond → différé.
        Le rachat de vétusté (différé) est plafonné en % de la VALEUR À NEUF
        (25 % ou 33 % selon la police — pratique [NV], rapport bloc 1.3/2.4). */
    chaineIndemnite({ dommage_van, taux_vetuste, declare, reel, franchise, plafond, taux_rachat_max }) {
      const tr = (taux_rachat_max == null) ? 0.25 : taux_rachat_max;
      const vetuste = dommage_van * taux_vetuste;
      const vd = dommage_van - vetuste;
      const coeff = reel > 0 ? Math.min(1, declare / reel) : 1;
      let immediat = Math.max(0, vd * coeff - (franchise || 0));
      if (plafond != null && plafond > 0) immediat = Math.min(immediat, plafond);
      const differe = Math.min(vetuste, tr * dommage_van) * coeff;
      return {
        vetuste: round2(vetuste), valeur_vetuste_deduite: round2(vd), coeff: round2(coeff),
        immediat: round2(immediat), differe: round2(differe),
      };
    },

    /** Perte d'exploitation complète (rapport bloc 1.4) :
        [(baisse de CA × tendance) × taux de MB + FSE retenus − économies]
        × coeff RP (MB déclarée / MB réelle) − franchise (montant, ou jours
        ouvrés de MB sur une base de 250 jours/an). */
    pe({ baisse_ca, taux_marge, frais_supp, perte_evitee, economies,
         tendance, mb_declaree, mb_reelle, franchise_pe, mb_annuelle, franchise_jours }) {
      const t = (tendance == null) ? 1 : tendance;
      const margePerdue = baisse_ca * t * taux_marge;
      const fraisRetenus = Math.min(frais_supp || 0, perte_evitee || 0);
      const sousTotal = margePerdue + fraisRetenus - (economies || 0);
      const coeff = (mb_declaree && mb_reelle) ? Math.min(1, mb_declaree / mb_reelle) : 1;
      let franchise = franchise_pe || 0;
      if (!franchise && mb_annuelle && franchise_jours) franchise = (mb_annuelle / 250) * franchise_jours;
      const perte = Math.max(0, sousTotal * coeff - franchise);
      return {
        marge_perdue: round2(margePerdue), frais_retenus: round2(fraisRetenus),
        sous_total: round2(sousTotal), coeff_rp: round2(coeff), franchise: round2(franchise),
        perte: round2(perte),
      };
    },

    /** Plafonds transport. Renvoie {plafond_dts|plafond_eur, en_euros?}. */
    plafondsTransport({ regime, poids_kg, nb_colis, taux_montreal, cours_dts }) {
      const colis = nb_colis || 1;
      let out = {};
      switch (regime) {
        case 'cmr': out = { plafond_dts: round2(8.33 * poids_kg) }; break;
        case 'montreal': out = { plafond_dts: round2((taux_montreal == null ? 26 : taux_montreal) * poids_kg) }; break;
        case 'hague_visby': out = { plafond_dts: round2(Math.max(666.67 * colis, 2 * poids_kg)) }; break;
        case 'ctg_moins_3t': out = { plafond_eur: round2(Math.min(33 * poids_kg, 1000 * colis)) }; break;
        case 'ctg_3t_et_plus': out = { plafond_eur: round2(Math.min(20 * poids_kg, 3200 * (poids_kg / 1000))) }; break;
        default: out = {};
      }
      if (out.plafond_dts != null && cours_dts) out.en_euros = round2(out.plafond_dts * cours_dts);
      return out;
    },

    /** Échéancier : dates ISO → échéances calculées. */
    echeancier({ date_sinistre, date_declaration, date_livraison, date_accord }) {
      const p = (iso) => (iso ? new Date(iso + 'T12:00:00') : null);
      const fmt = (d) => d.toISOString().slice(0, 10);
      const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
      const addM = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
      const addOuvres = (d, n) => { // jours ouvrés lun-ven, fériés non décomptés (à vérifier à la main)
        let x = new Date(d), c = 0;
        while (c < n) { x = addD(x, 1); const j = x.getDay(); if (j !== 0 && j !== 6) c++; }
        return x;
      };
      const S = p(date_sinistre), D = p(date_declaration), L = p(date_livraison), A = p(date_accord);
      const out = {};
      if (S) {
        out['d-declaration'] = fmt(addOuvres(S, 5));
        out['d-declaration-vol'] = fmt(addOuvres(S, 2));
        out['d-aggravation'] = fmt(addD(S, 15));
        out['d-prescription-assurance'] = fmt(addM(S, 24));
      }
      if (D) {
        out['d-reponse-sans-expert'] = fmt(addM(D, 2));
        out['d-reponse-avec-expert'] = fmt(addM(D, 6));
        out['d-catnat-info'] = fmt(addM(D, 1));
      }
      if (A) out['d-paiement'] = fmt(addD(A, 21));
      if (L) {
        out['d-protestation'] = fmt(addD(L, 3));
        out['d-cmr-non-apparent'] = fmt(addD(L, 7));
        out['d-cmr-retard'] = fmt(addD(L, 21));
        out['d-presomption-perte'] = fmt(addD(L, 30));
        out['d-prescription-transport'] = fmt(addM(L, 12));
        out['d-cmr-prescription'] = fmt(addM(L, 12));
      }
      return out;
    },

    /** Exécute un vecteur de test de calculs.json ; renvoie {ok, obtenu}. */
    runVector(calcId, entrees) {
      const map = {
        'calc-rp-capitaux': (e) => this.rpCapitaux(e),
        'calc-rp-prime': (e) => this.rpPrime(e),
        'calc-chaine-indemnite': (e) => this.chaineIndemnite(e),
        'calc-pe': (e) => this.pe(e),
        'calc-plafonds-transport': (e) => this.plafondsTransport(e),
        'calc-echeancier': (e) => this.echeancier(e),
      };
      return map[calcId] ? map[calcId].call(this, entrees) : null;
    },
  };

  root.CalcEngine = CalcEngine;
  if (typeof module !== 'undefined' && module.exports) module.exports = CalcEngine;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* Expert assurance — application autonome (aucune requête réseau).
   Données de référence : injectées au build (window.DB).
   Données personnelles : localStorage, ensemencées depuis data/personal/. */
(function () {
  'use strict';

  // ---------------------------------------------------------------- état
  const DB = JSON.parse(document.getElementById('data-ref').textContent);
  const SEED = JSON.parse(document.getElementById('data-perso').textContent);
  const LS_KEY = 'expert-assurance-perso-v1';

  function loadPerso() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* stockage indisponible : on travaille en mémoire */ }
    return JSON.parse(JSON.stringify(SEED));
  }
  const P = loadPerso();
  P.ui = P.ui || { theme: 'auto' };
  P.methode = P.methode || {};
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) { /* ignoré */ }
  }

  // ---------------------------------------------------------------- utils
  const $ = (sel, el) => (el || document).querySelector(sel);
  const main = () => $('#vue');
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function eur(x) {
    if (x == null || isNaN(x)) return '—';
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(x) + ' €';
  }
  function num(x) {
    if (x == null || isNaN(x)) return '—';
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(x);
  }
  const STATUT_LABEL = { V: 'V · vérifié', NV: 'NV · non vérifié', ordre_de_grandeur: 'ordre de grandeur', fictif: 'FICTIF' };
  function badge(st) {
    return st ? `<span class="badge ${esc(st)}" title="${esc(STATUT_LABEL[st] || st)}">${esc(st === 'ordre_de_grandeur' ? '≈' : st.toUpperCase())}<\/span>` : '';
  }

  // Index global des éléments par id (navigation croisée + recherche)
  const INDEX = {};
  const ROUTES_TABLE = {
    fiches: (id) => '#/fiche/' + id, references: (id) => '#/references?focus=' + id,
    calculs: (id) => '#/calc/' + id, etapes_methode: () => '#/methode',
    pieces: () => '#/methode', scenarios: (id) => '#/scenario/' + id,
    trames: (id) => '#/trames?focus=' + id, grilles_entretien: (id) => '#/entretien?grille=' + id,
    questions: (id) => '#/entretien?q=' + id, accidents: () => '#/averifier',
    ressources: () => '#/ressources', cabinets: (id) => '#/cabinets?focus=' + id,
    lexique_fr_en: () => '#/lexique', a_verifier: () => '#/averifier',
    modele_systemique: (id) => '#/systeme?focus=' + id,
  };
  Object.keys(ROUTES_TABLE).forEach((t) => {
    (DB[t].items || []).forEach((it) => {
      INDEX[it.id] = { table: t, item: it, route: ROUTES_TABLE[t](it.id) };
    });
  });
  (SEED.star.items || []).forEach((it) => { INDEX[it.id] = { table: 'star', item: it, route: '#/entretien?star=1' }; });

  function titleOf(it, table) {
    return it.titre || it.intitule || it.label || it.question || it.nom || it.fr || it.sujet || it.poste || it.id;
  }
  function refLink(id) {
    const e = INDEX[id];
    if (!e) return esc(id);
    const t = titleOf(e.item, e.table);
    const numero = e.item.numero && e.table === 'references' ? e.item.numero + ' — ' : '';
    return `<a href="${e.route}">${esc(numero + t)}<\/a> ${badge(e.item.statut)}`;
  }

  // ---------------------------------------------------------------- thème
  function applyTheme() {
    const t = P.ui.theme;
    const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('#btn-theme').textContent = t === 'auto' ? '◐' : (t === 'dark' ? '●' : '○');
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // ---------------------------------------------------------------- vues
  const VUES = {};

  VUES.accueil = function () {
    const nv = DB.a_verifier.items.length;
    const dues = srsDue().length;
    return `
    <h1>Expert assurance — base personnelle<\/h1>
    <div class="bandeau-fictif">Les scénarios sont FICTIFS. Statuts : V vérifié · NV non vérifié · ≈ ordre de grandeur.<\/div>
    <div class="grid cols2">
      <div class="card"><h3>Réviser<\/h3>
        <p><a href="#/quiz">Cartes à répétition espacée<\/a> — <b>${dues}<\/b> carte(s) dues.<\/p>
        <p><a href="#/entretien">Entraînement entretien<\/a> : tirage chronométré, grilles par poste, banque STAR.<\/p>
        <p><a href="#/fiches">Fiches<\/a> · <a href="#/lexique">Lexique FR↔EN<\/a><\/p><\/div>
      <div class="card"><h3>Comprendre le système<\/h3>
        <p><a href="#/systeme">Modèle systémique du métier<\/a> : acteurs, flux, boucles, tensions, leviers — et la version orale de 3 minutes.<\/p><\/div>
      <div class="card"><h3>Travailler un sinistre<\/h3>
        <p><a href="#/methode">Méthode en 12 étapes<\/a> + 3 scénarios fictifs déroulables.<\/p>
        <p><a href="#/calculs">Calculateurs<\/a> : règles proportionnelles, chaîne d'indemnisation, PE, plafonds transport, délais.<\/p><\/div>
      <div class="card"><h3>Chercher un poste<\/h3>
        <p><a href="#/cabinets">Cibles et cabinets<\/a> · <a href="#/candidatures">Suivi des candidatures<\/a><\/p>
        <p><a href="#/ressources">Ressources et sprint de 6 semaines<\/a><\/p><\/div>
      <div class="card"><h3>Fiabilité<\/h3>
        <p><a href="#/averifier">Vue « À vérifier »<\/a> : <b>${nv}<\/b> éléments NV avec leur source primaire.<\/p>
        <p><a href="#/references">Références juridiques et normatives<\/a><\/p>
        <p><a href="#/donnees">Exporter / importer mes données<\/a><\/p><\/div>
    <\/div>`;
  };

  // ------------------------------------------------ recherche plein texte
  function searchCorpus() {
    const corpus = [];
    Object.keys(ROUTES_TABLE).forEach((t) => {
      DB[t].items.forEach((it) => {
        corpus.push({ id: it.id, table: t, titre: titleOf(it, t), statut: it.statut, route: INDEX[it.id].route, text: JSON.stringify(it).toLowerCase() });
      });
    });
    return corpus;
  }
  let CORPUS = null;
  VUES.recherche = function (params) {
    const q = (params.get('q') || '').trim().toLowerCase();
    if (!CORPUS) CORPUS = searchCorpus();
    let hits = [];
    if (q.length >= 2) {
      hits = CORPUS.filter((c) => c.text.includes(q)).slice(0, 80);
    }
    const TABLE_LABEL = { fiches: 'fiche', references: 'référence', calculs: 'calculateur', etapes_methode: 'étape', pieces: 'pièce', scenarios: 'scénario', trames: 'trame', grilles_entretien: 'grille', questions: 'question', accidents: 'accident', ressources: 'ressource', cabinets: 'cible', lexique_fr_en: 'lexique', a_verifier: 'à vérifier', modele_systemique: 'modèle' };
    return `<h1>Recherche<\/h1>
      <p class="muted">${q ? `${hits.length} résultat(s) pour « ${esc(q)} »` : 'Saisir au moins 2 caractères dans la barre du haut.'}<\/p>
      <ul class="clean searchhit">${hits.map((h2) => `<li><a href="${h2.route}">${esc(h2.titre)}<\/a>
        <span class="badge theme">${TABLE_LABEL[h2.table]}<\/span> ${badge(h2.statut)}<\/li>`).join('')}<\/ul>`;
  };

  // ---------------------------------------------------------------- fiches
  VUES.fiches = function (params) {
    const th = params.get('theme') || '';
    const st = params.get('statut') || '';
    const themes = [...new Set(DB.fiches.items.map((f) => f.theme))];
    const items = DB.fiches.items.filter((f) => (!th || f.theme === th) && (!st || f.statut === st));
    return `<h1>Fiches<\/h1>
      <div class="filters">${themes.map((t) => `<a class="chip ${t === th ? 'on' : ''}" href="#/fiches${t === th ? '' : '?theme=' + t}">${esc(t)}<\/a>`).join('')}
        ${['V', 'NV', 'ordre_de_grandeur'].map((s) => `<a class="chip ${s === st ? 'on' : ''}" href="#/fiches${s === st ? '' : '?statut=' + s}${th ? '&theme=' + th : ''}">${esc(s)}<\/a>`).join('')}<\/div>
      <ul class="clean">${items.map((f) => `<li><a href="#/fiche/${f.id}"><b>${esc(f.numero)}<\/b> — ${esc(f.titre)}<\/a>
        <span class="badge theme">${esc(f.theme)}<\/span> ${badge(f.statut)}<\/li>`).join('')}<\/ul>
      <p class="muted">La numérotation « noyau dur 1.0-1.11 » viendra du rapport_recherche.md (non fourni) — voir <a href="#/averifier">À vérifier<\/a>.<\/p>`;
  };

  VUES.fiche = function (_p, id) {
    const f = DB.fiches.items.find((x) => x.id === id);
    if (!f) return '<p>Fiche introuvable.<\/p>';
    const l = f.liens || {};
    const bloc = (label, ids) => (ids && ids.length ? `<p><b>${label} :<\/b> ${ids.map(refLink).join(' · ')}<\/p>` : '');
    return `<div class="toolbar no-print"><a class="btn" href="#/fiches">← Fiches<\/a>
        <button onclick="window.print()">Imprimer (A4)<\/button><\/div>
      <div class="card">
      <h1>${esc(f.numero)} — ${esc(f.titre)} ${badge(f.statut)} <span class="badge theme">${esc(f.theme)}<\/span><\/h1>
      <ul>${f.points.map((p) => `<li>${esc(p)}<\/li>`).join('')}<\/ul>
      ${bloc('Références', l.referenceIds)}${bloc('Calculateurs', l.calculIds)}${bloc('Questions', l.questionIds)}${bloc('Scénarios', l.scenarioIds)}
      ${f.note ? `<p class="muted">Note : ${esc(f.note)}<\/p>` : ''}
      <p class="print-only muted">Base personnelle de révision — ${new Date().toLocaleDateString('fr-FR')}. Statut : ${esc(STATUT_LABEL[f.statut] || f.statut)}.<\/p>
      <\/div>`;
  };

  // ------------------------------------------------------------ références
  VUES.references = function (params) {
    const ty = params.get('type') || '';
    const st = params.get('statut') || '';
    const focus = params.get('focus') || '';
    const types = [...new Set(DB.references.items.map((r) => r.type))];
    const items = DB.references.items.filter((r) => (!ty || r.type === ty) && (!st || r.statut === st));
    setTimeout(() => { const el = document.getElementById(focus); if (el) el.scrollIntoView({ block: 'center' }); }, 30);
    return `<h1>Références<\/h1>
      <div class="filters">${types.map((t) => `<a class="chip ${t === ty ? 'on' : ''}" href="#/references${t === ty ? '' : '?type=' + t}">${esc(t)}<\/a>`).join('')}
      ${['V', 'NV'].map((s) => `<a class="chip ${s === st ? 'on' : ''}" href="#/references${s === st ? '' : '?statut=' + s}${ty ? '&type=' + ty : ''}">${s}<\/a>`).join('')}<\/div>
      ${items.map((r) => `<div class="card" id="${r.id}">
        <h3>${esc(r.code)}${r.numero ? ' · ' + esc(r.numero) : ''} ${badge(r.statut)}<\/h3>
        <p><b>${esc(r.intitule)}<\/b><\/p><p>${esc(r.resume)}<\/p>
        ${r.source_url ? `<p><a href="${esc(r.source_url)}" rel="noopener">Source consultée<\/a>${r.date_verification ? ' · vérifié le ' + esc(r.date_verification) : ''}<\/p>` : ''}
        ${r.note ? `<p class="muted">${esc(r.note)}<\/p>` : ''}<\/div>`).join('')}`;
  };

  // ----------------------------------------------------------- calculateurs
  VUES.calculs = function () {
    return `<h1>Calculateurs<\/h1>
      ${DB.calculs.items.map((c) => `<div class="card"><h3><a href="#/calc/${c.id}">${esc(c.titre)}<\/a> ${badge(c.statut)}<\/h3>
      <p class="muted">${esc(c.formule.slice(0, 140))}${c.formule.length > 140 ? '…' : ''}<\/p>
      <p><b>Base :<\/b> ${c.base_juridique.map(refLink).join(' · ') || '—'}<\/p><\/div>`).join('')}`;
  };

  const CALC_FORMS = {
    'calc-rp-capitaux': { run: (v) => CalcEngine.rpCapitaux(v), out: (r) => `Coefficient : <b>${num(r.coeff * 100)} %<\/b><br>Indemnité : <strong class="total">${eur(r.indemnite)}<\/strong>` },
    'calc-rp-prime': { run: (v) => CalcEngine.rpPrime(v), out: (r) => (r.indemnite == null ? 'Renseigner la prime due.' : `Coefficient : <b>${num(r.coeff * 100)} %<\/b><br>Indemnité réduite : <strong class="total">${eur(r.indemnite)}<\/strong>`) },
    'calc-chaine-indemnite': { run: (v) => CalcEngine.chaineIndemnite(v), out: (r) => `Vétusté : ${eur(r.vetuste)} · Valeur vétusté déduite : ${eur(r.valeur_vetuste_deduite)} · Coeff RP : ${num(r.coeff * 100)} %<br>Indemnité immédiate : <strong class="total">${eur(r.immediat)}<\/strong><br>Indemnité différée (rachat de vétusté) : <strong>${eur(r.differe)}<\/strong>` },
    'calc-pe': { run: (v) => CalcEngine.pe(v), out: (r) => `Marge brute perdue : ${eur(r.marge_perdue)} · Frais retenus (écrêtés) : ${eur(r.frais_retenus)}<br>Perte d'exploitation : <strong class="total">${eur(r.perte)}<\/strong>` },
    'calc-plafonds-transport': { run: (v) => CalcEngine.plafondsTransport(v), out: (r) => `${r.plafond_dts != null ? `Plafond : <strong class="total">${num(r.plafond_dts)} DTS<\/strong>` : ''}${r.plafond_eur != null ? `Plafond : <strong class="total">${eur(r.plafond_eur)}<\/strong>` : ''}${r.en_euros != null ? `<br>≈ ${eur(r.en_euros)} (au cours saisi)` : ''}` },
  };

  function calcForm(c) {
    if (c.id === 'calc-echeancier') return echeancierForm(c);
    const spec = CALC_FORMS[c.id];
    const inputs = c.parametres.map((p) => {
      if (p.type === 'choix') {
        return `<label>${esc(p.label)}<\/label><select name="${p.nom}">${p.options.map((o) => `<option>${o}<\/option>`).join('')}<\/select>`;
      }
      const defv = p.defaut != null ? ` value="${p.defaut}"` : '';
      const step = p.type === 'taux' ? ' step="0.01" placeholder="ex. 0,20 pour 20 %"' : ' step="any"';
      return `<label>${esc(p.label)}${p.optionnel ? ' <small>(optionnel)<\/small>' : ''}<\/label><input name="${p.nom}" type="number" inputmode="decimal"${step}${defv}>`;
    }).join('');
    return `<form class="calc" id="f-${c.id}" onsubmit="return false">${inputs}
      <p><button class="primary" data-run="${c.id}">Calculer<\/button><\/p>
      <div class="resultat" id="r-${c.id}" hidden><\/div><\/form>`;
  }

  function echeancierForm(c) {
    const dates = [['date_sinistre', 'Date du sinistre / de sa connaissance'], ['date_declaration', 'Date de déclaration'], ['date_livraison', 'Date de livraison (transport)'], ['date_accord', "Date d'accord sur la proposition"]];
    return `<form class="calc" id="f-${c.id}" onsubmit="return false">
      ${dates.map(([n, l]) => `<label>${l}<\/label><input type="date" name="${n}">`).join('')}
      <p><button class="primary" data-run="${c.id}">Calculer l'échéancier<\/button><\/p>
      <div class="resultat" id="r-${c.id}" hidden><\/div><\/form>`;
  }

  function runCalc(id) {
    const c = DB.calculs.items.find((x) => x.id === id);
    const form = document.getElementById('f-' + id);
    const out = document.getElementById('r-' + id);
    const vals = {};

  // Tirage chronométré
  const TIRAGE = { actif: false, questions: [], i: 0, notes: [], timer: null, restant: 90, grille: '' };
  function startTirage(grilleId) {
    const g = DB.grilles_entretien.items.find((x) => x.id === grilleId);
    const pool = g.questionIds.map(questionById).filter(Boolean).filter((q) => q.type !== 'a_poser');
    const n = Math.min(5, pool.length);
    const qs = [...pool].sort(() => Math.random() - 0.5).slice(0, n);
    Object.assign(TIRAGE, { actif: true, questions: qs, i: 0, notes: [], restant: 90, grille: g.poste });
    renderTirage();
    TIRAGE.timer = setInterval(() => {
      TIRAGE.restant--; const el = $('#chrono');
      if (el) { el.textContent = fmtChrono(TIRAGE.restant); el.className = 'timer' + (TIRAGE.restant <= 0 ? ' over' : (TIRAGE.restant <= 15 ? ' warn' : '')); }
    }, 1000);
  }
  function fmtChrono(s) { const a = Math.abs(s); const m = Math.floor(a / 60); const r = a % 60; return (s < 0 ? '−' : '') + m + ':' + String(r).padStart(2, '0'); }
  function renderTirage() {
    const z = $('#zone-tirage'); if (!z) return;
    if (!TIRAGE.actif) { z.innerHTML = ''; return; }
    if (TIRAGE.i >= TIRAGE.questions.length) {
      clearInterval(TIRAGE.timer);
      const moyenne = TIRAGE.notes.reduce((a, b) => a + b, 0) / TIRAGE.notes.length;
      P.progression.historique_entrainements.push({ date: new Date().toISOString().slice(0, 10), grille: TIRAGE.grille, n: TIRAGE.notes.length, moyenne: Math.round(moyenne * 10) / 10 });
      save();
      z.innerHTML = `<div class="card"><h3>Terminé<\/h3><p>Note moyenne auto-évaluée : <b>${num(moyenne)}/5<\/b>. Historique enregistré.<\/p><\/div>`;
      TIRAGE.actif = false;
      return;
    }
    const q = TIRAGE.questions[TIRAGE.i];
    TIRAGE.restant = 90;
    z.innerHTML = `<div class="card">
      <p class="muted">Question ${TIRAGE.i + 1}/${TIRAGE.questions.length} — réponds à voix haute, 90 s<\/p>
      <div class="timer" id="chrono">1:30<\/div>
      <p><b>${esc(q.question)}<\/b><\/p>
      <p><button id="btn-reveal">Voir la réponse attendue<\/button><\/p>
      <div id="rep" hidden><p>${esc(q.reponse)}<\/p>${q.a_eviter ? `<p><small>À éviter : ${esc(q.a_eviter)}<\/small><\/p>` : ''}
      <p>Auto-notation :<\/p><div class="notation">${[1, 2, 3, 4, 5].map((n) => `<button data-note="${n}">${n}<\/button>`).join('')}<\/div><\/div><\/div>`;
    $('#btn-reveal').onclick = () => { $('#rep').hidden = false; };
    z.querySelectorAll('[data-note]').forEach((b) => {
      b.onclick = () => { TIRAGE.notes.push(+b.dataset.note); TIRAGE.i++; renderTirage(); };
    });
  }

  // ------------------------------------------------------------------ quiz
  function srsState(id) { return P.progression.srs[id] || { ease: 2.5, interval: 0, due: '1970-01-01', reps: 0 }; }
  function srsDue() {
    const today = new Date().toISOString().slice(0, 10);
    const pool = DB.questions.items.filter((q) => q.type === 'flash' || q.type === 'technique');
    return pool.filter((q) => srsState(q.id).due <= today);
  }
  function srsGrade(id, grade) { // 0 encore, 3 difficile, 4 bien, 5 facile
    const s = srsState(id);
    if (grade < 3) { s.interval = 0; s.reps = 0; }
    else {
      s.reps += 1;
      s.ease = Math.max(1.3, s.ease + (0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02)));
      s.interval = s.reps === 1 ? 1 : (s.reps === 2 ? 3 : Math.round(s.interval * s.ease));
    }
    const d = new Date(); d.setDate(d.getDate() + Math.max(s.interval, grade < 3 ? 0 : 1));
    s.due = d.toISOString().slice(0, 10);
    P.progression.srs[id] = s;
    save();
  }

  function ouvreCandidature(idx, cible) {
    const dlg = $('#dlg-cand'); if (!dlg) return;
    const f = dlg.querySelector('form');
    f.elements.idx.value = idx == null ? '' : idx;
    const c = idx != null ? P.candidatures.items[idx] : { cible: cible || '', poste: '', etape: 'repérée', contact: '' };
    f.elements.cible.value = c.cible; f.elements.poste.value = c.poste;
    f.elements.etape.value = c.etape; f.elements.contact.value = c.contact || '';
    f.elements.note.value = '';
    dlg.showModal();
    dlg.onclose = () => {
      if (dlg.returnValue === 'ok') {
        const date = new Date().toISOString().slice(0, 10);
        const item = idx != null ? P.candidatures.items[idx] : { id: 'cand-' + Date.now(), statut: 'NV', source_url: null, date_verification: null, note: null, historique: [] };
        item.cible = f.elements.cible.value; item.poste = f.elements.poste.value;
        item.etape = f.elements.etape.value; item.contact = f.elements.contact.value;
        if (f.elements.note.value) item.historique.push({ date, note: f.elements.note.value });
        if (idx == null) P.candidatures.items.push(item);
        save(); route();
      } else if (dlg.returnValue === 'suppr' && idx != null) {
        if (confirm('Supprimer cette candidature ?')) { P.candidatures.items.splice(idx, 1); save(); route(); }
      }
